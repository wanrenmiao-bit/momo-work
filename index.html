<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3efe9">
<title>沫沫的人生工作台</title>
<style>
:root{
  /* 莫兰迪可爱风 · 低饱和暖色系 */
  --bg:#f4f0ea;
  --bg2:#efe9e1;
  --surface:#fffdfa;
  --surface2:#f7f2ea;
  --surface3:#efe8de;
  --border:#e7ded2;
  --border2:#d8cdbc;
  --text:#55504a;
  --text2:#8a8178;
  --muted:#aaa097;
  --accent:#e0a3b8;        /* 柔和雾紫 */
  --accent2:#cf8aa0;
  --accent-soft:rgba(224,163,184,.16);
  --green:#94b08e;         /* 莫兰迪绿 */
  --green-soft:rgba(148,176,142,.18);
  --red:#cf9b94;           /* 陶土红 */
  --red-soft:rgba(207,155,148,.16);
  --blue:#9fb4c4;
  --cyan:#9ec3bf;
  --orange:#d6a878;
  --pink:#d3a4ab;
  --amber:#e0a3b8;
  --radius: 11px;
  --radius-sm: 8px;
  --shadow:0 2px 14px rgba(120,105,90,.07);
  --shadow-lg:0 14px 40px rgba(120,105,90,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent2);text-decoration:none;word-break:break-all}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d3c8b9;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;padding:22px 14px;
  overflow:hidden
}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;flex-shrink:0}
.side-nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -14px;padding:0 14px}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px;flex-shrink:0}
.logo-mark{width:40px;height:40px;border-radius:8px;background:linear-gradient(140deg,var(--accent),#f3c9d6);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 16px rgba(224,163,184,.4)}
.logo-txt b{display:block;font-size:15.5px;font-weight:700;letter-spacing:.3px;color:var(--text)}
.logo-txt span{display:block;font-size:9.5px;color:var(--muted);letter-spacing:1.4px}
.nav-section{margin-bottom:14px}
.nav-section-title{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px;padding:0 13px;margin-bottom:8px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 13px;border-radius:6px;color:var(--text2);
  font-size:14px;margin-bottom:4px;transition:.16s;text-align:left;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.on{background:var(--accent);color:#fff;font-weight:650;box-shadow:0 6px 16px rgba(224,163,184,.34)}
.nav-item svg{flex-shrink:0}
.nav-item .n{ margin-left:auto;font-size:11px;background:var(--surface3);color:var(--text2);padding:1px 7px;border-radius:5px;font-weight:600}
.nav-item.on .n{background:rgba(255,255,255,.24);color:#fff}
.nav-project{padding-left:38px;font-size:13.5px;color:var(--text2)}
.nav-project::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:-7px}
.nav-project.on::before{background:var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.side-foot .mini{width:100%;justify-content:flex-start;font-size:13px;color:var(--text2);padding:10px 13px;border-radius:6px;display:flex;align-items:center;gap:9px;transition:.16s}
.side-foot .mini:hover{background:var(--surface2);color:var(--text)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:12px;padding:16px 26px;
  border-bottom:1px solid var(--border);background:rgba(244,240,234,.9);
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:30;
}
.topbar h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.3px;color:var(--text)}
.topbar .sub{font-size:13px;color:var(--muted);margin-left:3px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{padding:24px 26px 70px;max-width:1340px;width:100%}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 17px;border-radius:6px;background:var(--surface2);
  border:1px solid var(--border);color:var(--text);font-size:14px;
  min-height:42px;transition:.16s;white-space:nowrap;
  line-height:1;text-align:center;
}
.btn:hover{background:var(--surface3);border-color:var(--border2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(207,155,148,.3);background:var(--red-soft)}
.btn.danger:hover{background:rgba(207,155,148,.22)}
.btn.sm{padding:7px 13px;min-height:36px;font-size:13px;border-radius:6px}
.btn.xs{padding:5px 11px;min-height:32px;font-size:12.5px;border-radius:5px}
.btn.wide{width:100%}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{margin:0;font-size:16px;font-weight:700;color:var(--text)}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}

.tag{display:inline-block;padding:3px 11px;border-radius:11px;font-size:12px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);white-space:nowrap}
.tag.amber{background:rgba(224,163,184,.16);color:#a85d72;border-color:rgba(224,163,184,.3)}
.tag.green{background:var(--green-soft);color:#5f7d5a;border-color:rgba(148,176,142,.3)}
.tag.red{background:var(--red-soft);color:#a96d64;border-color:rgba(207,155,148,.3)}
.tag.blue{background:rgba(159,180,196,.16);color:#5f7d8c;border-color:rgba(159,180,196,.3)}
.tag.purple{background:var(--accent-soft);color:var(--accent2);border-color:rgba(224,163,184,.3)}
.tag.cyan{background:rgba(158,195,191,.16);color:#56807c;border-color:rgba(158,195,191,.3)}

.empty{text-align:center;padding:42px 18px;color:var(--muted);font-size:14px}
.empty svg{opacity:.45;margin-bottom:10px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:.3px;line-height:1.2;color:var(--text)}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}

.field{margin-bottom:15px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:600}
.chk{display:flex;align-items:center;gap:9px;padding:11px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:13.6px;color:var(--text);cursor:pointer;line-height:1.4}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;font-size:16px;outline:none;transition:.16s;color:var(--text);
}
.field textarea{min-height:110px;resize:vertical;line-height:1.65;background:var(--surface2)}
.field input:focus,.field textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.field .hint.ok{color:var(--green)}
.field .hint.warn{color:var(--red)}
.field .hint.grabbing{color:var(--accent2)}
.url-grab{display:flex;gap:8px;align-items:stretch}
.url-grab input{flex:1;min-width:0}
.url-grab .btn{flex-shrink:0;white-space:nowrap;padding:0 14px;font-size:13.5px}
.url-grab .btn[disabled]{opacity:.6;cursor:default}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.mask{
  position:fixed;inset:0;background:rgba(85,80,74,.36);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:18px;
}
.mask.on{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border2);border-radius:11px;
  width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.modal-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-h b{font-size:17px;color:var(--text)}
.modal-h .x{margin-left:auto;color:var(--muted);padding:4px 8px;font-size:24px;line-height:1}
.modal-b{padding:20px 22px;overflow-y:auto}
.modal-f{padding:15px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.modal-f .btn{min-height:44px;padding:10px 22px}

.pbar{height:8px;border-radius:5px;background:var(--surface3);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#f3c9d6);transition:width .35s}
.pbar.g i{background:linear-gradient(90deg,var(--green),#a9c2a4)}

.li{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:none}
.li .body{flex:1;min-width:0}
.li .ops{display:flex;gap:3px;flex-shrink:0}
.iconbtn{width:34px;height:34px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface3);color:var(--text)}
.iconbtn.del:hover{color:var(--red);background:var(--red-soft)}

.addline{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addline input{flex:1;min-width:160px;padding:10px 13px;background:var(--surface2);border:1px dashed var(--border2);border-radius:6px;font-size:16px;outline:none;color:var(--text)}
.addline input:focus{border-style:solid;border-color:var(--accent);background:#fff}
/* 项目 · 资料 / 产出 行内添加 */
.proj-add{margin-bottom:12px}
.proj-quick-add{margin-top:0;flex-wrap:nowrap;gap:7px}
.proj-quick-add input{min-width:0;flex:1;padding:9px 12px;font-size:15px}
.qa-add{width:36px;height:36px;flex-shrink:0;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;transition:.15s}
.qa-add:hover{background:var(--accent2)}
.proj-add-ops{display:flex;gap:7px;margin-top:7px}
.proj-add-ops .btn.xs{flex:1;justify-content:center}
.proj-file{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 8px;border-radius:5px;background:var(--surface2);border:1px solid var(--border);font-size:11.5px;color:var(--text2);max-width:100%}
.proj-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-file i{font-style:normal;color:var(--muted);flex-shrink:0}
.proj-file svg{flex-shrink:0;color:var(--blue)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:11px;background:var(--surface2);border:1px solid var(--border);font-size:13px;color:var(--text2);min-height:36px;display:inline-flex;align-items:center;transition:.16s}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:rgba(224,163,184,.35);color:var(--accent2);font-weight:600}

.clk{cursor:pointer;transition:.16s}
.clk:hover{border-color:var(--border2);background:var(--surface2)}

.backbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.backbar h2{margin:0;font-size:21px;font-weight:700;color:var(--text)}
.backbar .r{margin-left:auto;display:flex;gap:8px}

.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(12px);
  background:var(--text);color:#fff;border-radius:8px;font-size:14px;z-index:200;
  opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;padding:12px 22px;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 自定义下拉框 */
.dd{position:relative;min-width:120px}
.dd-btn{width:100%;display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:15px;color:var(--text);cursor:pointer;transition:.16s;text-align:left}
.dd-btn:hover{border-color:var(--border2);background:var(--surface3)}
.dd.on .dd-btn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.dd-btn .dd-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .dd-chev{transition:.2s;color:var(--muted);flex-shrink:0}
.dd.on .dd-chev{transform:rotate(180deg)}
.dd-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:6px;box-shadow:var(--shadow-lg);z-index:60;max-height:264px;overflow:auto;padding:6px;display:none}
.dd-opt{padding:9px 12px;border-radius:5px;font-size:14.5px;color:var(--text2);cursor:pointer;transition:.12s}
.dd-opt:hover{background:var(--surface2);color:var(--text)}
.dd-opt.on{color:var(--accent2);font-weight:600;background:var(--accent-soft)}
.dd-group{font-size:10.5px;color:var(--muted);letter-spacing:1px;padding:9px 12px 4px;font-weight:700}
.dd-group:first-child{padding-top:4px}

/* 人生目标 */
.goal-card{padding:20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);margin-bottom:16px;box-shadow:var(--shadow)}
.goal-list{display:flex;flex-direction:column}
.goal-card.dragover{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 8px 26px rgba(224,163,184,.2)}
.goal-card.dragover::after{display:none}
.goal-grip{color:var(--muted);cursor:grab}
.goal-grip:hover{color:var(--accent)}
.goal-move-up,.goal-move-down{display:none}
.goal-drop-last{margin-top:14px;border:1.5px dashed var(--border2);border-radius:var(--radius);padding:14px;text-align:center;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.goal-drop-last.dragover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent2)}
@media(max-width:768px){.goal-grip{display:none}.goal-move-up,.goal-move-down{display:inline-flex}.goal-move-up{order:-1}}
.goal-head{display:flex;align-items:flex-start;gap:14px}
.goal-ring{flex-shrink:0}
.goal-ring text{fill:var(--text)}
.goal-title{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--text)}
.goal-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.goal-note{font-size:13px;color:var(--text2);line-height:1.6}
.goal-expand{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer}
.goal-expand:hover{color:var(--text)}
/* 目标达成：奖励感专属样式（和「勾掉一个任务」明确区分开） */
.goal-card.achieved{
  border:1.5px solid rgba(224,163,184,.6);
  background:linear-gradient(135deg,rgba(255,229,238,.9),rgba(255,253,250,.96) 46%,rgba(240,224,196,.5));
  box-shadow:0 10px 34px rgba(224,163,184,.24);
  position:relative;overflow:hidden;
}
/* 右上角彩带 */
.goal-card.achieved::before{
  content:'达成';position:absolute;right:-40px;top:14px;width:150px;
  transform:rotate(38deg);text-align:center;
  background:linear-gradient(90deg,#e0a3b8,#d6a878);color:#fff;
  font-size:12px;font-weight:800;letter-spacing:3px;padding:5px 0;
  box-shadow:0 3px 12px rgba(199,120,110,.32);z-index:2;
}
/* 顶部流光 */
.goal-card.achieved::after{
  content:'';position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,#e0a3b8,#d6a878,#94b08e,#9fb4c4,#e0a3b8);
  background-size:280% 100%;animation:rewardflow 5.5s linear infinite;
}
@keyframes rewardflow{0%{background-position:0 0}100%{background-position:280% 0}}
.goal-card.achieved .goal-title{color:#a85d72}
/* 奖励横幅 */
.goal-reward{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:14px;padding:13px 15px;border-radius:9px;
  background:linear-gradient(135deg,rgba(224,163,184,.2),rgba(214,168,120,.14));
  border:1px dashed rgba(199,120,110,.42);
}
.goal-reward-ico{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 32%,#fff2f6,#f0a8c0);color:#a85d72;box-shadow:0 3px 10px rgba(224,163,184,.4)}
.goal-reward-main{flex:1;min-width:150px}
.goal-reward-t{font-size:14.5px;font-weight:800;color:#a85d72;letter-spacing:.3px}
.goal-reward-s{font-size:12.2px;color:#8a6a62;margin-top:3px;line-height:1.55}
.goal-reward-chips{display:flex;gap:6px;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.75);color:#a85d72;border:1px solid rgba(224,163,184,.42)}
.rchip.gold{color:#8a6636;border-color:rgba(214,168,120,.5)}
.rchip.green{color:#5f7d5a;border-color:rgba(148,176,142,.45)}
@media(max-width:768px){.goal-card.achieved::before{right:-46px;top:12px;font-size:11px}.goal-reward{gap:10px;padding:12px}}
.achieved-hero{background:linear-gradient(135deg,#f3b6c8,#e0a3b8) !important;color:#7a3b4d;border:none !important;box-shadow:0 8px 28px rgba(224,163,184,.32);position:relative;overflow:hidden}
.achieved-hero::after{content:'';position:absolute;right:-22px;top:-22px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.22)}
.goal-stats{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.goal-stats .gstat,.goal-stats .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.achieved-hero .gstat-ico{color:#fff;opacity:.95;margin-bottom:6px}
.achieved-hero .gstat-num{font-size:42px;font-weight:850;line-height:1;color:#fff;letter-spacing:-1px}
.achieved-hero .gstat-num span{font-size:15px;font-weight:700;margin-left:3px;opacity:.85}
.achieved-hero .gstat-lab{font-size:14px;font-weight:700;margin-top:5px;color:#7a3b4d}
.achieved-hero .gstat-sub{display:flex;align-items:center;gap:4px;font-size:11.5px;margin-top:6px;color:#8a4a5c;opacity:.92}
.goal-medal{width:62px;height:62px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 32%,#ffe0ec,#f0a8c0);box-shadow:0 4px 16px rgba(224,163,184,.5),inset 0 2px 4px rgba(255,255,255,.6);color:#a85d72;position:relative}
.goal-medal-spark{position:absolute;right:-4px;top:-5px;color:#f3b6c8;filter:drop-shadow(0 1px 1px rgba(168,93,114,.4));animation:sparkpop 2.6s ease-in-out infinite}
@keyframes sparkpop{0%,100%{transform:scale(1) rotate(0);opacity:.85}50%{transform:scale(1.25) rotate(8deg);opacity:1}}
@media(max-width:768px){.goal-stats{grid-template-columns:1fr 1fr}.goal-stats .achieved-hero{grid-column:1 / -1}}
.milestone-list{padding:14px 0 4px}
.milestone{border-radius:6px;border:1px solid var(--border);margin-bottom:10px;background:var(--surface2);transition:.16s;overflow:hidden}
.milestone:hover{border-color:var(--border2)}
.milestone.done{background:linear-gradient(135deg,rgba(224,163,184,.16),rgba(224,163,184,.05));border-color:rgba(224,163,184,.4);box-shadow:0 2px 14px rgba(224,163,184,.12)}
/* 标题行整体垂直居中 */
.milestone-row{display:flex;align-items:center;gap:12px;padding:12px}
.milestone-num{width:28px;height:28px;border-radius:50%;background:var(--surface3);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.milestone.done .milestone-num{background:linear-gradient(140deg,#e0a3b8,#d08aa0);color:#fff}
.milestone-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.milestone-title{font-size:14.5px;font-weight:600;color:var(--text);line-height:1.4}
.milestone.done .milestone-title{color:#a85d72}
.milestone-time{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:3px}
.milestone.done .milestone-time{color:#a85d72}
.ms-mini{flex-shrink:0;display:flex;align-items:center}
.ms-mini text{font-size:13px}
.milestone-actions{flex-shrink:0;display:flex;gap:4px;align-items:center}
.btn-achieve{padding:6px 12px;border-radius:5px;background:var(--accent-soft);color:var(--accent2);border:1px solid rgba(224,163,184,.3);font-size:12px;font-weight:600;transition:.16s;white-space:nowrap}
.btn-achieve:hover{background:rgba(224,163,184,.26)}
.btn-achieve.completed{background:rgba(224,163,184,.18);color:#a85d72;border-color:rgba(224,163,184,.4);cursor:default}
.btn-achieve.view{background:var(--surface);color:var(--text2);border-color:var(--border2)}
.btn-achieve.view:hover{background:var(--surface3);color:var(--text)}
.goal-completed-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:11px;background:var(--green-soft);color:#5f7d5a;border:1px solid rgba(148,176,142,.3);font-size:12px;font-weight:700}

/* 第三层：里程表 */
.sub-list{padding:2px 12px 12px 52px;border-top:1px dashed var(--border);margin-top:2px}
.sub-empty{font-size:12.5px;color:var(--muted);padding:10px 0 6px}
.submile{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:5px;background:var(--surface);border:1px solid var(--border);margin-top:8px;transition:.14s}
.submile:hover{border-color:var(--border2)}
.submile.done{background:rgba(148,176,142,.09);border-color:rgba(148,176,142,.3)}
.sub-check{width:20px;height:20px;border-radius:3px;border:1.8px solid var(--border2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;transition:.14s}
.sub-check:hover{border-color:var(--accent)}
.sub-check.on{background:var(--green);border-color:var(--green)}
.sub-idx{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.sub-title{flex:1;min-width:0;font-size:13.5px;color:var(--text);line-height:1.45}
.submile.done .sub-title{color:var(--text2);text-decoration:line-through;text-decoration-color:rgba(148,176,142,.6)}
.sub-at{font-size:11px;color:#5f7d5a;flex-shrink:0}
.sub-ops{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:.14s}
.submile:hover .sub-ops{opacity:1}
.sub-ops .iconbtn{width:26px;height:26px}
.sub-add{margin-top:9px}

/* 目标内联新建 */
.goal-add-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.ga-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.goal-add-card input{flex:1;min-width:180px;padding:12px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:16px;outline:none;color:var(--text)}
.goal-add-card input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.goal-add-card .btn.primary{flex-shrink:0;min-height:46px}
.ga-row2{margin-top:11px}
.ga-cats{display:flex;gap:6px;flex-wrap:wrap}
.ga-cats .chip{background:var(--surface2)}
.ga-cats .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ga-note{font-size:14.5px !important}

/* 灵感库 */
.idea-add-card{background:linear-gradient(135deg,var(--accent-soft),rgba(224,163,184,.05));border:1px solid rgba(224,163,184,.28);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.idea-add-card .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.idea-add-card input{flex:1;min-width:200px;padding:12px 15px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:16px;outline:none;color:var(--text)}
.idea-add-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.idea-add-card .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.idea-add-card .filters .chip{background:var(--surface)}
.idea-add-card .filters .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.idea-in{width:100%;flex:1 1 220px;resize:vertical;min-height:46px;font-size:14.5px !important;line-height:1.5;padding:12px 14px !important;font-family:inherit;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);transition:.16s}
.idea-in:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}

/* 灵感库：按日期分组的时间轴瀑布流 */
.idea-timeline{display:flex;flex-direction:column;gap:28px}
.idea-day-group{display:flex;flex-direction:column;gap:12px}
.idea-day-title{font-size:15px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.idea-day-title::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
.idea-masonry{columns:4 220px;column-gap:14px}
.idea-card{break-inside:avoid;display:inline-block;width:100%;margin:0 0 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:15px 15px 13px;box-shadow:var(--shadow);border-top:3px solid var(--accent);cursor:pointer;position:relative}
.idea-card:nth-child(4n+2){border-top-color:var(--cyan)}
.idea-card:nth-child(4n+3){border-top-color:var(--orange)}
.idea-card:nth-child(4n+4){border-top-color:var(--green)}
.idea-card.sel{z-index:2;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(224,163,184,.42),0 10px 26px rgba(120,105,90,.13)}
.idea-card.done{opacity:.62;background:var(--surface2)}
.idea-card.done .idea-card-text{text-decoration:line-through;color:var(--text2)}
.idea-card-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.idea-card-text{font-size:14.2px;line-height:1.7;word-break:break-word;margin:0 0 12px;color:var(--text);white-space:pre-wrap}
.idea-card-foot{display:flex;align-items:center;gap:8px}
.idea-actions{display:flex;gap:4px;margin-left:auto}
@media(max-width:1100px){.idea-masonry{columns:3 200px}}
@media(max-width:860px){.idea-masonry{columns:2 180px}}
@media(max-width:520px){.idea-masonry{columns:1}}
@media(max-width:768px){.idea-masonry{column-gap:10px}}
.btn-done{padding:5px 11px;border-radius:5px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--text2);background:var(--surface3);transition:.16s}
.btn-done:hover{border-color:var(--green);color:#5f7d5a}
.btn-done.on{background:var(--green-soft);border-color:rgba(148,176,142,.35);color:#5f7d5a}

/* 学习记录 */
.study-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.study-item-title{font-size:16px;font-weight:700;flex:1;min-width:0;color:var(--text)}
.study-item-date{font-size:12px;color:var(--muted);flex-shrink:0}
.study-item-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.study-item-body{font-size:14.3px;line-height:1.75;color:var(--text2);white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:6px;padding:14px 16px}

/* 项目三栏：横向滑动 + 悬停变宽 */
.project-dashboard{display:flex;gap:14px;align-items:stretch;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.project-col{flex:1 1 0;min-width:248px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-height:260px;transition:flex .35s cubic-bezier(.4,0,.2,1),box-shadow .2s,border-color .2s}
.project-col:hover{flex:1.9 1 0;border-color:var(--border2);box-shadow:0 0 0 2px var(--accent-soft)}
.project-col-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text2);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.project-col-h:hover{color:var(--text)}
.project-col-h .ex{font-size:11px;margin-left:8px;color:var(--muted);opacity:0;transition:.15s}
.project-col-h:hover .ex{opacity:.7}
.project-col:hover .ex{opacity:1;color:var(--accent2)}
.project-col-h .n{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:5px}

.project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 15px 13px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.project-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#f3c9d6)}
.project-card:hover{transform:translateY(-4px) scale(1.015);border-color:var(--border2);box-shadow:0 14px 32px rgba(120,105,90,.16)}
.project-card:active{transform:translateY(-1px) scale(.995)}
.project-card .tag{position:absolute;top:12px;right:12px}
.project-card .name{font-size:15px;font-weight:700;margin:4px 56px 6px 0;line-height:1.35;color:var(--text)}
.project-card.done{opacity:.85}
.project-card.done .tag{background:rgba(155,135,210,.16);color:#8d72c4}
.project-card.done .pbar i{background:var(--green)!important}
.project-card .desc{font-size:12.5px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.project-card .meta{display:flex;gap:12px;font-size:11.8px;color:var(--muted);flex-wrap:wrap}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.project-card.dragover{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 8px 26px rgba(224,163,184,.2)}
.proj-grip{position:absolute;right:12px;bottom:12px;top:auto;left:auto;color:var(--muted);cursor:grab;z-index:3}
.proj-grip:hover{color:var(--accent)}
.proj-move-btns{display:none;gap:4px;margin-top:4px;justify-content:flex-end}
.proj-drop-last{margin-top:16px;border:1.5px dashed var(--border2);border-radius:var(--radius);padding:14px;text-align:center;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.proj-drop-last.dragover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent2)}
@media(max-width:768px){.proj-grip{display:none}.proj-move-btns{display:inline-flex}.proj-move-up{order:-1}}

/* 项目数据分析 */
.proj-an-grid{display:grid;grid-template-columns:1.1fr 1.4fr 1.2fr;gap:18px}
.pa-block{background:var(--surface2);border-radius:8px;padding:14px 15px}
.pa-h{font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:11px}
.pa-donut{display:flex;align-items:center;gap:14px}
.pa-legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text2)}
.dlegend{display:flex;align-items:center;gap:7px}
.dlegend .dl-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.dlegend b{margin-left:auto;font-weight:700;color:var(--text)}
.pbar-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12px}
.pbar-name{flex:0 0 84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.pbar-track{flex:1;height:8px;border-radius:3px;background:var(--surface3);overflow:hidden}
.pbar-track i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .35s}
.pbar-pct{flex:0 0 34px;text-align:right;font-weight:700;color:var(--text2)}
.mbars{display:flex;align-items:flex-end;gap:10px;height:96px;padding-top:6px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.mbar-f{width:60%;max-width:22px;border-radius:3px 3px 2px 2px;background:linear-gradient(180deg,var(--accent),#f3c9d6);min-height:4px;transition:height .35s}
.mbar-l{font-size:10.5px;color:var(--muted)}
@media(max-width:768px){.proj-an-grid{grid-template-columns:1fr}}

.task-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
.task-row:first-child{border-top:none}
.task-check{width:20px;height:20px;border-radius:3px;border:2px solid var(--border2);flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s}
.task-check:hover{border-color:var(--accent)}
.task-check.readonly{cursor:default;opacity:.7}
.task-check.readonly:hover{border-color:var(--border2)}
.task-check.done{background:var(--accent);border-color:var(--accent)}
.task-check.done svg{display:block}
.task-title{flex:1;font-size:14px;line-height:1.5;color:var(--text)}
.task-title.done{text-decoration:line-through;color:var(--muted)}
.task-title.abandoned{text-decoration:line-through;color:var(--muted);opacity:.7}
.task-pri{font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;margin-left:6px}
.gt-proj{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--orange);background:rgba(214,168,120,.16);padding:2px 7px;border-radius:3px;margin-left:6px;vertical-align:middle;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt-proj svg{opacity:.85;flex:none}
.task-pri.P0{background:var(--red-soft);color:var(--red)}
.task-pri.P1{background:rgba(159,180,196,.18);color:var(--blue)}
.task-pri.P2{background:var(--green-soft);color:var(--green)}
.task-pri.P3{background:var(--surface3);color:var(--muted)}
.task-row.abandoned{opacity:.75}
.task-quick-add{display:flex;gap:8px;align-items:center}
.task-quick-add input{flex:1;min-width:0}
.pri-chips{display:flex;gap:5px;align-items:center;flex-shrink:0}
.pri-chip{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);background:var(--surface2);border:1px solid var(--border);transition:.15s;padding:0}
.pri-chip:hover{border-color:var(--pc)}
.pri-chip.on{background:var(--pc);border-color:var(--pc);color:#fff}
/* 快速添加行里的太阳：带框，和优先级同高 */
.task-sun-btn{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface2);border:1px solid var(--border);transition:.15s;flex-shrink:0}
.task-sun-btn.on{color:var(--red);background:rgba(207,155,148,.14);border-color:rgba(199,120,110,.4);box-shadow:0 0 10px rgba(207,155,148,.25)}
.task-sun-btn:hover{color:var(--red)}
/* 任务行右侧操作区：太阳和其它图标同尺寸、同风格、并排 */
.task-row .ops{display:flex;align-items:center;gap:2px;flex-shrink:0;margin-top:-3px}
.task-row .ops .iconbtn{width:32px;height:32px;border-radius:6px;border:none;background:none}
.iconbtn.task-sun{width:32px;height:32px;border:none;background:none;border-radius:6px;color:var(--muted);box-shadow:none}
.iconbtn.task-sun:hover{color:var(--red);background:var(--red-soft)}
.iconbtn.task-sun.on{color:var(--red);background:rgba(207,155,148,.16);box-shadow:none}
.task-row .ops .iconbtn.on{color:var(--accent2);background:var(--accent-soft)}

/* 收入 */
.inc-row{display:grid;grid-template-columns:96px 1fr 120px 34px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--border);font-size:14px}
.inc-row:first-of-type{border-top:none}
.inc-amt{color:#5f7d5a;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.inc-date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px}
.bar-row .nm{width:88px;flex-shrink:0;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{flex:1;height:9px;background:var(--surface3);border-radius:3px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar-row .vl{width:92px;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums;flex-shrink:0}

/* 每日生活 - 二级导航 */
.nav-sub{padding-left:38px;font-size:13.5px;color:var(--text2)}
.nav-sub::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:-7px;flex-shrink:0}

/* 子模块切换条 */
.subtabs{display:flex;gap:6px;margin-bottom:4px}
.subtab{padding:8px 16px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:14px;font-weight:600;min-height:40px;transition:.16s}
.subtab.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ===== 计划与复盘 ===== */
.pr-must{margin-bottom:14px}
.pr-add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pr-add input{flex:1;min-width:140px;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:15px;outline:none;color:var(--text)}
.pr-add input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.plan-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin:-6px 0 12px 2px}
.plan-hint svg{flex-shrink:0}

/* ---------- 番茄钟 ---------- */
.pomo-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-top:14px}
.pomo-hero{display:flex;flex-direction:column;align-items:stretch;padding:14px 16px 16px;margin-top:14px}
.pomo-hero .card-h{margin-bottom:6px}
.pomo-hero-body{display:flex;align-items:center;gap:16px;margin-top:6px;justify-content:flex-start}
.pomo-side{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0;max-width:520px}
.pomo-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;align-items:start}
.pomo-lr{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:18px;margin-top:18px;align-items:start}
.pomo-timer{display:flex;flex-direction:column;align-items:stretch;padding:14px 16px 16px}
.pomo-timer .card-h{margin-bottom:6px}
.pomo-records .pomo-list{max-height:none}
.pomo-analysis .pomo-insight{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--surface3);font-size:13px;color:var(--text2)}
.pomo-analysis .pomo-insight svg{color:var(--accent);flex-shrink:0}
.pomo-analysis .pomo-insight b{color:var(--text)}
.pomo-stage{display:flex;flex-direction:column;align-items:center;padding:4px 0;flex-shrink:0}
.pomo-ring-wrap{position:relative;width:150px;height:150px;margin-bottom:0}
.pomo-ring-wrap svg{display:block;transform:rotate(-90deg)}
.pomo-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pomo-time{font-size:38px;font-weight:800;letter-spacing:1px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1}
.pomo-state{font-size:12.5px;color:var(--muted);letter-spacing:.5px}
.pomo-hand{transform-origin:60px 60px;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.pomo-mins{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 2px}
.pomo-min{padding:8px 15px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:13.5px;color:var(--text2);transition:.15s;min-height:38px}
.pomo-min:hover{border-color:var(--border2);color:var(--text)}
.pomo-min.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.pomo-min:disabled{opacity:.4;cursor:not-allowed}
.pomo-ctrl{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.pomo-big{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 30px;border-radius:999px;font-size:15.5px;font-weight:700;
  background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(224,163,184,.4);transition:.16s;min-height:48px}
.pomo-big:hover{background:var(--accent2);transform:translateY(-1px)}
.pomo-big.ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border);box-shadow:none}
.pomo-big.ghost:hover{background:var(--surface3);color:var(--text);transform:none}
.pomo-link-row{display:flex;gap:8px;align-items:stretch;flex-direction:column;margin-top:8px;width:100%}
.pomo-note-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;width:100%}
.pomo-note-row input{flex:1;min-width:0;padding:8px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;font-size:14px;color:var(--text);outline:none}
.pomo-note-row input:focus{border-color:var(--accent);background:#fff}
.pomo-hint-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.pomo-hint-row svg{color:var(--accent);flex-shrink:0}
.pomo-link-row .lb,.pomo-note-row .lb{font-size:13px;color:var(--text2);flex-shrink:0;width:100%}
.pomo-link-row .dd{flex:1;min-width:0}
.plk-list{display:flex;flex-direction:column;gap:7px;width:100%}
.plk-add{display:flex;gap:8px;align-items:center;width:100%}
.plk-empty{font-size:12.5px;color:var(--muted);font-style:italic}
.plk{display:inline-flex;align-items:center;gap:6px;padding:6px 9px 6px 8px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);font-size:13px;color:var(--text);transition:.15s}
.plk:hover{border-color:var(--border2);background:var(--surface)}
.plk-dot{width:7px;height:7px;border-radius:50%;background:var(--tc)}
.plk-type{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);padding:2px 5px;border-radius:4px}
.plk-name{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plk-x{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;transition:.14s}
.plk-x:hover{background:var(--red-soft);color:var(--red)}
.plk-add .dd{flex:1;min-width:0}
.pomo-sound{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);
  border-radius:999px;padding:8px 14px;transition:.15s;min-height:38px}
.pomo-sound:hover{border-color:var(--border2)}
.pomo-sound.off{color:var(--muted)}
.pomo-sound svg{flex-shrink:0}

.pomo-list .prow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.pomo-list .prow .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.pomo-list .prow .tt{flex:1;min-width:0;font-size:13.5px;color:var(--text);word-break:break-word}
.pomo-list .prow .tt i{font-style:normal;display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.pomo-list .prow .mn{font-size:12px;font-weight:700;color:var(--accent2);flex-shrink:0}
.pomo-list .prow .gx{color:var(--muted);cursor:pointer;flex-shrink:0;width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.pomo-list .prow .gx:hover{color:var(--red);background:var(--red-soft)}
.pomo-day{font-size:12.5px;color:var(--muted);margin:14px 0 7px;display:flex;align-items:center;gap:8px}
.pomo-day b{color:var(--text2);font-weight:700}
.pomo-day .dots{margin-left:auto;display:flex;gap:3px;align-items:center;color:var(--red)}

.pomo-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pomo-bar .bn{font-size:13px;color:var(--text);width:132px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pomo-bar .bt{flex:1;height:9px;background:var(--surface3);border-radius:999px;overflow:hidden;min-width:40px}
.pomo-bar .bf{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#f3c9d6)}
.pomo-bar .bv{font-size:12px;color:var(--text2);font-weight:650;flex-shrink:0;width:52px;text-align:right}

/* 迷你悬浮计时条 */
.pomo-mini{position:fixed;right:22px;bottom:22px;z-index:70;display:none;align-items:center;gap:11px;padding:11px 16px 11px 13px;
  background:var(--surface);border:1px solid var(--border2);border-radius:999px;box-shadow:var(--shadow-lg);cursor:pointer;transition:.18s}
.pomo-mini:hover{transform:translateY(-2px)}
.pomo-mini.on{display:flex}
.pomo-mini .mtxt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.pomo-mini .mtime{font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.4px}
.pomo-mini .mlab{font-size:11.5px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pomo-mini .mico{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pomo-mini.paused .mico{background:var(--surface3);color:var(--muted)}

/* 番茄钟：计时页 */
.pomo-timer-wrap{display:flex;justify-content:center;margin-top:18px}
.pomo-timer{max-width:460px;width:100%;display:flex;flex-direction:column;align-items:stretch;padding:14px 16px 16px}
.pomo-top{display:grid;grid-template-columns:minmax(460px,1.1fr) 1fr;gap:18px;align-items:stretch;margin-bottom:18px}
.pomo-top .pomo-timer{max-width:none}
.pomo-top-right .grid.g2{gap:12px;height:100%}
.pomo-top-right .grid.g2>.stat{height:100%}
.pomo-timer-body{display:grid;grid-template-columns:minmax(180px,1fr) minmax(300px,1.45fr);gap:14px;align-items:stretch;flex:1;min-height:0}
.pomo-timer-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:4px 0}
.pomo-timer-right{display:flex;flex-direction:column;justify-content:flex-start;gap:10px;min-width:0;overflow-y:auto;max-height:100%;height:100%;padding-right:4px}
.pomo-timer-right .pomo-interrupt{margin-top:0;flex-shrink:0}
.pomo-timer-right .plk-name{max-width:160px}
.pomo-side-block{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;flex-shrink:0}
.pomo-side-block .lb{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:5px}
.pomo-scroll{max-height:142px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.pomo-records-list .prk{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text)}
.prk-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prk-x{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;transition:.14s;flex-shrink:0}
.prk-x:hover{background:var(--red-soft);color:var(--red)}
.pomo-rec-add{display:flex;gap:8px;align-items:center}
.pomo-rec-add input{flex:1;min-width:0;padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:5px;font-size:13px;color:var(--text);outline:none}
.pomo-rec-add input:focus{border-color:var(--accent);background:#fff}
.pomo-link-block .plk-list{gap:6px}
.pomo-link-block .plk-add{margin-top:2px}
.pomo-interrupt{margin-top:12px;padding:12px;background:var(--surface2);border:1px dashed var(--border2);border-radius:8px}
.pi-h{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);margin-bottom:8px}
.pi-chips{display:flex;flex-wrap:wrap;gap:7px}
.pi-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pi-tag{font-size:11.5px;color:var(--text2);background:var(--surface3);padding:3px 9px;border-radius:5px}

/* 番茄记录：分析仪表板 */
.pomo-dashboard{margin-bottom:16px}
.pd-summary{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;margin-bottom:16px}
.pd-today-card{background:linear-gradient(135deg,var(--accent-soft),rgba(224,163,184,.05));border:1px solid rgba(224,163,184,.28);border-radius:var(--radius);padding:16px 18px}
.pd-today-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--accent2);margin-bottom:10px}
.pd-today-body{display:flex;align-items:center;gap:18px}
.pd-ring{flex-shrink:0}
.pd-today-info{flex:1}
.pd-today-num{font-size:38px;font-weight:850;line-height:1;color:var(--text);letter-spacing:-1px}
.pd-today-num span{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.pd-today-lab{font-size:12.5px;color:var(--text2);margin-top:3px}
.pd-depth{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);padding:5px 11px;border-radius:999px}
.pd-mood{margin-top:12px;font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:6px;padding-top:10px;border-top:1px dashed var(--border2)}
.pd-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pd-metric{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:13px 14px}
.pd-mk{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.pd-mv{font-size:18px;font-weight:750;color:var(--text);line-height:1.25;word-break:break-word}
.pd-mh{font-size:11px;color:var(--text2);margin-top:6px;line-height:1.45}
.pd-charts{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.pd-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.pd-insight{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;color:var(--text2)}
.pd-insight svg{color:var(--accent);flex-shrink:0}
.pd-pie{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pd-pie-legend{flex:1;min-width:120px;display:flex;flex-direction:column;gap:7px}
.pd-pie-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);cursor:pointer;padding:4px 6px;border-radius:5px;transition:.14s}
.pd-pie-item:hover{background:var(--surface2)}
.pd-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.pd-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-num{margin-left:auto;font-weight:700;color:var(--text)}
.pd-heat-wrap{overflow-x:auto;padding-bottom:4px}
.pd-heat{display:grid;grid-template-columns:54px repeat(7,28px);grid-template-rows:36px repeat(24,20px);gap:3px;position:relative;min-width:100%}
.pd-heat-corner{grid-column:1;grid-row:1}
.pd-heat-day{grid-row:1;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.25}
.pd-heat-hour{grid-column:1;font-size:10.5px;color:var(--muted);text-align:right;padding-right:6px;align-self:center}
.pd-heat-cell{background:var(--surface2);border-radius:2px}
.pd-heat-events-overlay{position:absolute;left:54px;top:36px;right:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;pointer-events:none}
.pd-heat-event{position:absolute;left:10%;width:80%;border-radius:3px;background:rgba(224,163,184,.75);pointer-events:auto;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.15s;min-height:2px}
.pd-heat-event:hover{background:rgba(224,163,184,.95);z-index:2}
.pd-heat-month{display:flex;flex-direction:column;gap:6px}
.pd-month-h{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.pd-month-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pd-month-cell{aspect-ratio:1;border-radius:5px;background:var(--surface2);display:flex;align-items:flex-start;justify-content:flex-start;padding:5px;font-size:11px;color:var(--text2);position:relative;transition:.15s}
.pd-month-cell.in{background:var(--surface)}
.pd-month-cell.on{background:rgba(224,163,184,var(--ho))}
.pd-month-d{line-height:1}
.pomo-list .prow.aborted{opacity:.65;background:rgba(207,155,148,.1);border-color:rgba(199,120,110,.3)}
.pomo-list .prow .tt i.int{color:var(--red);display:inline-flex;align-items:center;gap:4px;margin-top:4px}
@media(max-width:768px){
  .pd-summary{grid-template-columns:1fr}
  .pd-metrics{grid-template-columns:repeat(2,1fr)}
  .pd-charts{grid-template-columns:1fr}
  .pd-heat{grid-template-columns:46px repeat(7,24px);grid-template-rows:32px repeat(24,18px)}
  .pd-heat-events-overlay{left:46px;top:32px}
  .pd-heat-event{left:8%;width:84%}
}

/* 每日生活子导航（移动端） */
.daily-sub{display:none;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.daily-sub button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--border);font-size:13.5px;color:var(--text2);min-height:40px;white-space:nowrap}
.daily-sub button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}

.plan-layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(420px,1.8fr);gap:16px;align-items:stretch;margin-bottom:18px;height:460px;min-height:460px}
.plan-must-col{display:flex;flex-direction:column;height:100%;min-height:0}
.plan-must-col .plan-zone{flex:1;display:flex;flex-direction:column;height:100%;min-height:0;margin-bottom:0}
.plan-quadrant-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:100%;min-height:0}
.plan-quadrant-grid .plan-zone{display:flex;flex-direction:column;min-height:0;margin-bottom:0}
.plan-zone{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 14px 12px;transition:.16s;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(120,105,90,.04)}
.plan-zone::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--zc,var(--border2))}
.plan-zone.dragover{border-color:var(--accent);background:var(--accent-soft)}
.plan-zone-h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:10px;color:var(--text);flex-shrink:0}
.plan-zone-h .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.plan-zone-h .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.plan-zone-add{display:flex;gap:6px;margin-bottom:8px;flex-shrink:0}
.plan-zone-add input{flex:1;min-width:0;padding:8px 11px;background:var(--surface);border:1px solid var(--border);border-radius:5px;font-size:14px;outline:none;color:var(--text)}
.plan-zone-add .btn{padding:7px 10px;min-height:36px}
.plan-zone-empty{font-size:12px;color:var(--muted);text-align:center;padding:12px 0;flex-shrink:0}
.plan-zone-body{flex:1;overflow-y:auto;min-height:0;padding-right:4px}
.plan-ops{display:flex;align-items:center;gap:2px;flex-shrink:0}
.plan-ops .iconbtn{width:30px;height:30px;border-radius:6px}
.plan-cat-dot{font-size:10px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--cc);color:#fff;cursor:default;flex-shrink:0}
.plan-sun{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s}
.plan-sun:hover{color:var(--red);background:var(--red-soft)}
.plan-sun.on{color:var(--red);background:rgba(207,155,148,.16)}
.plan-zone.must{background:var(--surface);border:2px solid rgba(199,120,110,.55);box-shadow:0 10px 32px rgba(199,120,110,.16);position:relative;overflow:hidden}
.plan-zone.must::before{content:'';position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--red),#e09a90,#d98c82)}
.plan-zone.must::after{content:'';position:absolute;right:-20px;top:-20px;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle,rgba(207,155,148,.14) 0%,rgba(207,155,148,0) 70%);pointer-events:none}
.plan-zone.must .plan-zone-h{color:var(--red);font-size:16px;letter-spacing:.3px;padding-top:4px;position:relative;z-index:1}
.plan-zone.must .plan-zone-h .cnt{margin-left:auto;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--red),#d98c82);padding:2px 9px;border-radius:999px;box-shadow:0 2px 6px rgba(199,120,110,.3)}
.plan-zone.must .plan-zone-h .dot{width:10px;height:10px}
.plan-zone.must .plan{position:relative;padding-left:16px;background:#fff;border-color:rgba(199,120,110,.2);box-shadow:0 2px 8px rgba(199,120,110,.08)}
.plan-zone.must .plan::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--red),#d98c82);border-radius:6px 0 0 6px}
.plan-zone.must .plan:hover{border-color:rgba(199,120,110,.35);box-shadow:0 4px 14px rgba(199,120,110,.12)}
.must-flag{flex-shrink:0;color:#fff;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--red),#d98c82);box-shadow:0 3px 8px rgba(199,120,110,.35);animation:flagpulse 2.4s ease-in-out infinite}
@keyframes flagpulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}
.mini-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:5px;border:1px solid var(--border);background:var(--surface3);color:var(--text2);cursor:pointer;transition:.15s;white-space:nowrap}
.mini-btn:hover{border-color:var(--border2);background:#fff}
.mini-btn.must-up{color:var(--red);border-color:rgba(199,120,110,.35);background:rgba(207,155,148,.1)}
.mini-btn.must-up:hover{background:var(--red);color:#fff;border-color:var(--red)}

.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.move-list{display:flex;flex-direction:column;gap:8px}
.move-opt{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;text-align:left;transition:.15s;min-height:48px}
.move-opt:hover{border-color:var(--accent);background:#fff}
.move-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.move-opt .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.move-opt .mv-n{font-size:14.5px;font-weight:650;color:var(--text)}
.move-opt .mv-d{margin-left:auto;font-size:12px;color:var(--muted)}
.plan{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;background:#fff;border:1px solid rgba(120,105,90,.12);border-radius:8px;margin-bottom:10px;cursor:grab;transition:.15s}
.plan:hover{border-color:rgba(120,105,90,.24);box-shadow:0 2px 8px rgba(120,105,90,.06)}
.plan.done{opacity:.55}
.plan.done .plan-t{text-decoration:line-through}
.plan-check{width:20px;height:20px;border-radius:3px;border:2px solid var(--border2);flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}

/* 复盘 */

.grat-rows .gitem{display:flex;gap:8px;align-items:center;padding:8px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.grat-rows .gitem .gt{flex:1;font-size:13.5px;line-height:1.5;color:var(--text);word-break:break-word}
.grat-rows .gitem .gx{color:var(--muted);cursor:pointer;flex-shrink:0;width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.grat-rows .gitem .gx:hover{color:var(--red);background:var(--red-soft)}
.grat-rows .gitem .gx2{color:var(--muted);cursor:pointer;flex-shrink:0;width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center}

.grat-rows .gitem.grat-task.abandoned{opacity:.6}
.grat-rows .gitem.grat-task.abandoned .gt{text-decoration:line-through;color:var(--muted)}
.grat-task-add{display:flex;gap:8px;align-items:center}
.grat-task-add input{flex:1;min-width:0}
.gt-check{width:18px;height:18px;border-radius:3px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.gt-check.done{background:var(--green);border-color:var(--green);color:#fff}
.grat-sun.on{color:var(--red);background:rgba(207,155,148,.16) !important;border-radius:6px}
.grat-rows .gitem .gt-ops{display:flex;align-items:center;gap:2px;flex-shrink:0}

.grat-rows .gitem.editing{background:var(--surface);border-color:var(--accent)}

.grat-rows .gitem .gt{cursor:text}
.grat-hint-save{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:9px 11px;margin-top:8px;line-height:1.5}
.grat-hint-save svg{flex-shrink:0;margin-top:1px}
.grat-add{display:flex;gap:8px;margin-top:4px}
.grat-add input{flex:1;min-width:0;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;font-size:14px;outline:none;color:var(--text)}
.grat-add input:focus{border-color:var(--accent);background:#fff}
.grat-foot{display:flex;gap:8px;margin-top:6px;align-items:center}
.mood-input{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.mood-input label{font-size:13px;color:var(--text2);font-weight:600}
.mood-input input{flex:1;padding:9px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:15px;outline:none;color:var(--text)}
.mood-input input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.mood-pick{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}

.mood-faces{display:flex;flex-wrap:wrap;gap:9px}
.mface{width:46px;height:46px;border-radius:8px;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;padding:0}
.mface:hover{transform:translateY(-2px);border-color:var(--mc)}
.mface.on{background:color-mix(in srgb, var(--mc) 16%, var(--surface));border-color:var(--mc);box-shadow:0 4px 12px color-mix(in srgb, var(--mc) 30%, transparent)}
.mface svg{display:block}
.cal-mood{position:absolute;right:3px;bottom:2px;line-height:0;pointer-events:none}
.cal-day{position:relative}
.grat-mood-an{margin-top:14px}
.mood-dist{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.md-row{display:flex;align-items:center;gap:9px}
.md-face{width:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:0}
.md-k{font-size:13px;color:var(--text);width:34px;flex-shrink:0}
.md-bar{flex:1;height:8px;background:var(--surface3);border-radius:999px;overflow:hidden;min-width:30px}
.md-fill{height:100%;border-radius:999px;display:block}
.md-n{font-size:12.5px;font-weight:700;color:var(--text2);width:22px;text-align:right;flex-shrink:0}
.mood-verdict{display:flex;align-items:center;gap:7px;margin-top:13px;padding-top:12px;border-top:1px solid var(--surface3);font-size:13px;color:var(--text2)}
.mood-verdict svg{color:var(--accent);flex-shrink:0}
.mood-verdict b{color:var(--text)}
.grat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding-bottom:13px;border-bottom:1px solid var(--border)}
.grat-head .gt-title{font-size:16px;font-weight:800;color:var(--text)}
.done-pill{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent2);font-size:11.5px;font-weight:700}
.grat-reward{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:8px;margin-bottom:16px;background:linear-gradient(135deg,#fde9d2,#f7dbe8 55%,#e8e0f4);border:1px solid rgba(207,155,148,.42);box-shadow:0 6px 20px rgba(207,155,148,.22);animation:rewardPop .5s ease, rewardGlow 2.6s ease-in-out infinite}
.grat-reward .gr-ico{width:46px;height:46px;border-radius:8px;background:#fff;color:var(--accent2);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.grat-reward .gr-txt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.grat-reward .gr-txt b{font-size:14.5px;color:#7a5a8c}
.grat-reward .gr-txt span{font-size:12.5px;color:#8a6f7a;line-height:1.5}
.grat-reward .gr-txt .hr{display:inline-flex;vertical-align:-2px;margin:0 1px;color:var(--red)}
.grat-reward .gr-pill{margin-left:auto;flex-shrink:0;padding:6px 13px;border-radius:999px;background:#fff;color:#c87f76;font-size:13px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.08)}
@keyframes rewardPop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rewardGlow{0%,100%{box-shadow:0 6px 20px rgba(207,155,148,.22)}50%{box-shadow:0 6px 30px rgba(224,163,184,.42)}}
.cal-day.done{background:var(--accent-soft);color:var(--accent2);font-weight:700}
.cal-day.done::after{content:'';position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cal-day.sel.done::after{background:#fff}

<script>
/* ============================================================
   沫沫的人生工作台 · 莫兰迪可爱风
   模块：人生目标 / 灵感库 / 学习记录 / 项目 / 收入记录 / 计划与复盘 / 感恩日历
============================================================ */

const KEY = 'wb_momo_v3';
const META_KEY = 'wb_momo_meta_v3';

/* ---------- 账号 / 会话 / 加密（前端 AES-GCM，零后端）---------- */
let SESSION = { user:null, guest:true };   // 当前登录用户（null = 游客）
let SKEY = null;                           // 当前用户的 AES 密钥，仅存内存，不落盘
function hashStr(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++){ h=((h<<5)+h + s.charCodeAt(i))>>>0; } return h.toString(16); }
function scopeKey(){ return SESSION.user ? 'wb_momo_user_'+hashStr(SESSION.user) : 'wb_momo_guest_v3'; }
function userFile(u){ return 'momo-u-'+hashStr(u)+'.json'; }
async function deriveKey(user, pass, salt){
  const enc = new TextEncoder();
  const bk = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: salt || enc.encode('momo-'+user), iterations:120000, hash:'SHA-256' },
    bk, { name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']
  );
}
async function encryptWithKey(key, obj){
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  const out = new Uint8Array(16+12+ct.byteLength);
  out.set(salt,0); out.set(iv,16); out.set(new Uint8Array(ct),28);
  let s=''; for(let i=0;i<out.length;i++) s+=String.fromCharCode(out[i]);
  return btoa(s);
}
async function decryptWithKey(key, b64){
  const buf = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const salt=buf.slice(0,16), iv=buf.slice(16,28), ct=buf.slice(28);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function encryptDB(user, pass, obj){ return encryptWithKey(await deriveKey(user,pass), obj); }
async function decryptDB(user, pass, b64){ return decryptWithKey(await deriveKey(user,pass), b64); }

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function d2s(d){ const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
const TODAY = d2s(new Date());
function off(n){ const d = new Date(); d.setDate(d.getDate()+n); return d2s(d); }
function nextDay(s){ const p = (s||TODAY).split('-').map(Number); const d = new Date(p[0], p[1]-1, p[2]); d.setDate(d.getDate()+1); return d2s(d); }
function nowStamp(){ const d = new Date(); const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function fmtSize(b){ if(b==null) return ''; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; if(b<1073741824) return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
function fmtMD(s){ if(!s) return ''; const p = s.split('-'); return p.length===3 ? (+p[1])+'月'+(+p[2])+'日' : s; }
function fmtYM(s){ if(!s) return '未填日期'; return s.slice(0,4)+'年'+ (+s.slice(5,7))+'月'; }
function money(n){ return '¥' + Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2100); }

/* ---------- 心情表（全内联 SVG 小脸，不用 emoji）---------- */
const MOOD_FACE = '<circle cx="12" cy="12" r="9"/>';
const MOODS = [
  { k:'兴奋', c:'#d6a878', d:MOOD_FACE+'<path d="M7.4 13.2a4.6 4.6 0 0 0 9.2 0"/><path d="M7.9 8.1l1.9 1"/><path d="M16.1 8.1l-1.9 1"/><path d="M9.3 10.9h.01"/><path d="M14.7 10.9h.01"/>' },

function defaultFrameworks(){
  const out = [];
  const add = (name, parent) => { const n = { id:uid(), name, parent:parent||'' }; out.push(n); return n.id; };
  /* kids 支持：'名称'（二级） / ['名称',[三级]] / ['名称',[['三级',[四级]],'三级']] */
  const tree = (name, kids) => {
    const pid = add(name);
    (kids||[]).forEach(k=>{
      if(Array.isArray(k)){
        const sid = add(k[0], pid);
        (k[1]||[]).forEach(c=>{
          if(Array.isArray(c)){ const tid = add(c[0], sid); (c[1]||[]).forEach(d=>add(d, tid)); }
          else add(c, sid);
        });
      } else add(k, pid);
    });
  };

function migrateData(d){
  // 旧版字段清理；新版本用 plans / reviews / gratitude(map)
  if(Array.isArray(d.projects)) d.projects.forEach(p => {
    if(Array.isArray(p.tasks)) p.tasks.forEach(t => {
      delete t.due;
      if(t.pri == null) t.pri = 'P2';
      if(t.today == null) t.today = false;
      if(t.abandoned == null) t.abandoned = false;
    });
    if(p.imp == null) p.imp = false;
    if(p.urg == null) p.urg = false;
    if(p.today == null) p.today = false;
  });
  if(!d.plans) d.plans = [];
  if(Array.isArray(d.plans)) d.plans.forEach(p=>{
    if(p.sourceType == null) p.sourceType = '';
    if(p.sourceId == null) p.sourceId = '';
    if(p.sourceSub == null) p.sourceSub = '';
    // 今日必做从 cat 中独立出来
    if(p.must == null){
      if(p.cat === 'must'){ p.must = true; p.cat = p.originCat || 'q2'; delete p.originCat; }
      else { p.must = false; }
    }
    if(!p.cat || p.cat === 'must') p.cat = 'q2';
  });
  if(!d.reviews) d.reviews = [];
  if(Array.isArray(d.reviews)) d.reviews.forEach(r=>{
    if(!r.type) r.type = 'daily';
    if(r.fields == null) r.fields = {};
    // 旧版纯文本 content 迁移到日常复盘的 summary 字段
    if(r.content && !r.fields.summary) r.fields.summary = r.content;
  });
  if(!d.pomos) d.pomos = [];
  if(Array.isArray(d.pomos)) d.pomos.forEach(p=>{
    if(!Array.isArray(p.links)){
      const t = p.linkType, id = p.linkId;
      p.links = (t && t!=='none' && id) ? [{ type:t, id }] : [];
    }
    delete p.linkType; delete p.linkId;
    if(p.actualMin == null) p.actualMin = p.min || 25;
    if(!Array.isArray(p.interrupts)) p.interrupts = [];
    if(p.aborted == null) p.aborted = false;
  });
  if(!d.library) d.library = [];
  if(d.frameworks === undefined) d.frameworks = defaultFrameworks();   // 仅在从未初始化时铺默认框架；用户清空后保持空，不再自动补
  if(!d.accounts) d.accounts = [];
  if(Array.isArray(d.accounts)) d.accounts.forEach(a=>{ if(!a.group) a.group='work'; });
  if(Array.isArray(d.studies)) d.studies.forEach(s=>{ if(!s.createdAt) s.createdAt=(s.created||TODAY)+' 09:00'; if(s.duration==null) s.duration=0; });
  if(Array.isArray(d.library)) d.library.forEach(x=>{ if(x.catId==null) x.catId=''; });
  // 里程碑三层：补齐 subs
  if(Array.isArray(d.goals)) d.goals.forEach(g=>{
    if(!Array.isArray(g.milestones)) g.milestones=[];
    g.milestones.forEach(m=>{ if(!Array.isArray(m.subs)) m.subs=[]; });
  });
  // 心情归一化到预置心情表
  if(d.gratitude && !Array.isArray(d.gratitude)) Object.keys(d.gratitude).forEach(k=>{
    const g = d.gratitude[k]; if(!g) return;
    if(g.mood && !MOODS.some(m=>m.k===g.mood)) g.mood = MOOD_ALIAS[g.mood] || '平静';
    // tomorrow 从字符串数组迁移为对象数组
    if(Array.isArray(g.tomorrow)){
      g.tomorrow = g.tomorrow.map(it => {
        if(typeof it === 'string') return { text:it, pri:'P2', today:false, abandoned:false, done:false };
        return { text:it.text||'', pri:it.pri||'P2', today:!!it.today, abandoned:!!it.abandoned, done:!!it.done };
      });
    }
  });
  if(!d.gratitude || Array.isArray(d.gratitude)) d.gratitude = {};
  return d;
}
function priToCat(pri){
  switch(pri){
    case 'P0': return 'q1';
    case 'P1': return 'q3';
    case 'P2': return 'q2';
    case 'P3': return 'q4';
    default: return 'q2';
  }
}
function priColor(pri){
  switch(pri){
    case 'P0': return 'var(--red)';
    case 'P1': return 'var(--blue)';
    case 'P2': return 'var(--green)';
    case 'P3': return 'var(--muted)';
    default: return 'var(--muted)';
  }
}
function priLabel(pri){
  switch(pri){
    case 'P0': return 'P0 · 重要且紧急';
    case 'P1': return 'P1 · 紧急不重要';
    case 'P2': return 'P2 · 重要不紧急';

    default: return pri;

}
function priChips(name, cur){
  cur = cur || 'P2';
  const opts = [['P0','P0'],['P1','P1'],['P2','P2'],['P3','P3']];
  let h = '<input type="hidden" id="'+name+'" value="'+esc(cur)+'"><div class="pri-chips" data-pri="'+name+'">';
  opts.forEach(([v,l]) => {
    h += '<button type="button" class="pri-chip '+v+(v===cur?' on':'')+'" style="--pc:'+priColor(v)+'" onclick="setPriChip(\''+name+'\',\''+v+'\')">'+l+'</button>';
  });
  h += '</div>';
  return h;
}
function setPriChip(name, val){
  const wrap = document.querySelector('.pri-chips[data-pri="'+name+'"]'); if(!wrap) return;
  wrap.querySelectorAll('.pri-chip').forEach(b => b.classList.toggle('on', b.textContent === val));
  const inp = document.getElementById(name); if(inp) inp.value = val;
}

function load(){
  /* 会话（游客 / 已登录）由 restoreSession() 在 load() 之前处理 */
  let fresh = false;
  const sk = scopeKey();
  try{
    const raw = localStorage.getItem(sk);
    if(raw){ db = migrateData(JSON.parse(raw)); }
    else {
      /* 升级兼容：首次从旧版全局 KEY 取回原有数据，避免升级后“丢失” */
      const old = localStorage.getItem('wb_momo_v3');
      if(old){ db = migrateData(JSON.parse(old)); fresh = true; }
      else { db = seedDB(); fresh = true; }
    }
  }catch(e){ db = seedDB(); fresh = true; }
  normalizeDB();
  try{ const m = localStorage.getItem(META_KEY); if(m) meta = Object.assign(meta, JSON.parse(m)); }catch(e){}
  meta.sync = Object.assign({ token:'', gistId:'', auto:false, lastSync:0 }, meta.sync||{});
  if(!meta.wanrenPassHash) meta.wanrenPassHash = '7046afc5';
  if(fresh){ meta.lastBackupCount = totalCount(); saveMeta(); save(); }
}
/* 把当前 AES 密钥 + 登录时间戳写入本地，实现 24h 免重复登录（仅本地，不上云） */
async function saveSessionRecord(key, user){
  try{
    const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
    let bs = ''; for(let i=0;i<raw.length;i++) bs += String.fromCharCode(raw[i]);
    localStorage.setItem('wb_momo_session_v3', JSON.stringify({ user, loginAt: Date.now(), keyB64: btoa(bs) }));
  }catch(e){ /* 密钥持久化失败不影响登录 */ }
}
/* 启动 / 刷新时尝试静默恢复登录态：24h 内直接还原密钥，否则回到需输入密码 */
async function restoreSession(){
  let restoredUser = null;
  try{ const ms = localStorage.getItem(META_KEY); if(ms){ const m = JSON.parse(ms); if(m.session && m.session.user === 'wanren') restoredUser = m.session.user; } }catch(e){}
  if(!restoredUser){ SESSION = { user:null, guest:true }; return; }
  SESSION = { user:restoredUser, guest:false };
  try{
    const sr = localStorage.getItem('wb_momo_session_v3');
    if(!sr) return;                                   // 无密钥记录：保留用户态，交由 openLogin 走“解锁”流程
    const s = JSON.parse(sr);
    const expired = (Date.now() - (s.loginAt||0)) >= 24*3600*1000;
    if(!s.user || s.user !== restoredUser || expired || !s.keyB64){
      localStorage.removeItem('wb_momo_session_v3');  // 过期 / 非法：清除旧密钥，仍保留用户态以便重新登录
      return;
    }
    const bin = atob(s.keyB64);
    const raw = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) raw[i] = bin.charCodeAt(i);
    SKEY = await crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['encrypt','decrypt']);
  }catch(e){ SKEY = null; }
}

}

/* ---------- 资料文件本地存储 (IndexedDB) ---------- */
let _filesDB = null;
function openFilesDB(){
  return new Promise((resolve, reject)=>{
    if(_filesDB){ resolve(_filesDB); return; }
    if(!window.indexedDB){ reject(new Error('no idb')); return; }
    const req = indexedDB.open('wb_momo_files', 1);
    req.onupgradeneeded = e=>{ const db=e.target.result; if(!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath:'id' }); };
    req.onsuccess = e=>{ _filesDB = e.target.result; resolve(_filesDB); };
    req.onerror = e=> reject(e.target.error);
  });
}
function putFile(id, blob){ return openFilesDB().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').put({ id, blob, ts:Date.now() }); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function getFile(id){ return openFilesDB().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('files','readonly'); const r=tx.objectStore('files').get(id); r.onsuccess=()=>res(r.result?r.result.blob:null); r.onerror=()=>rej(r.error); })); }
function delFile(id){ return openFilesDB().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function clearFiles(){ return openFilesDB().then(db=>new Promise((res)=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').clear(); tx.oncomplete=()=>res(); tx.onerror=()=>res(); })).catch(()=>{}); }
function totalCount(obj){
  const d = obj || db;
  return d.goals.length + d.goals.reduce((a,g)=>a+g.milestones.length,0)
    + d.ideas.length
    + d.studies.length
    + d.projects.length + d.projects.reduce((a,p)=>a+p.tasks.length+p.assets.length+p.outputs.length,0)
    + d.incomes.length
    + d.plans.length
    + d.reviews.length
    + d.pomos.length
    + d.library.length
    + Object.keys(d.gratitude).length;
}
