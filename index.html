function delIdea(id){
  const i = db.ideas.find(x=>x.id===id); if(!i) return;
  confirmBox('删除这条灵感？', '「'+esc((i.text||'').slice(0,30))+(i.text&&i.text.length>30?'…':'')+'」删除后无法恢复，请确认。', ()=>{
    db.ideas = db.ideas.filter(x=>x.id!==id); save(); render(); toast('已删除');
  });
}

function viewStudies(){
  const ss = db.studies;
  const allTags = [...new Set(ss.flatMap(s=>s.tags||[]))].sort();
  const f = route.filter || 'all';
  const list = f==='all' ? ss : ss.filter(s => (s.tags||[]).includes(f));
  const sorted = list.slice().sort((a,b)=> (b.created||'').localeCompare(a.created||''));
  let h = '<div class="card" style="padding:14px 16px;margin-bottom:14px">'
    + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    + '<input id="studyTitle" placeholder="学习主题 / 标题" style="flex:1;min-width:160px;padding:11px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:16px;outline:none;color:var(--text)">'
    + '<input id="studyTags" placeholder="标签，用空格分隔" style="flex:1;min-width:160px;padding:11px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:16px;outline:none;color:var(--text)">'
    + '<button class="btn primary" style="min-height:44px" onclick="quickStudy()">'+ico('plus',16)+'记一笔</button>'
    + '</div></div>';
  if(allTags.length){
    h += '<div class="chips">'
      + chip('all','全部 '+ss.length)
      + allTags.map(t => chip(t, t+' '+ss.filter(s=>(s.tags||[]).includes(t)).length)).join('')
      + '</div>';
  }
  h += '<div class="card-h"><h3>学习笔记</h3><div class="r"><button class="btn primary sm" onclick="editStudy()">'+ico('plus',15)+'新建笔记</button></div></div>';
  if(!sorted.length) return h + emptyBox('还没有学习笔记，学完随手记两句，回看时值千金');
  sorted.forEach(s => {
    h += '<div class="study-item">'
      + '<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:10px">'
      +   '<div class="study-item-title">'+esc(s.title)+'</div>'
      +   '<div class="study-item-date">'+esc(s.createdAt||s.created||'—')+(s.duration?(' · 填写 '+s.duration+' 分钟'):'')+'</div>'
      + '</div>'
      + '<div class="study-item-tags">'+(s.tags||[]).map(t=>'<span class="tag blue">'+esc(t)+'</span>').join('')+'</div>'
      + '<div class="study-item-body">'+esc(s.content||'')+'</div>'
      + '<div style="display:flex;justify-content:flex-end;gap:6px;margin-top:12px">'
      +   '<button class="btn sm" onclick="editStudy(\''+s.id+'\')">'+ico('edit',14)+'编辑</button>'
      +   '<button class="btn sm danger" onclick="delStudy(\''+s.id+'\')">'+ico('del',14)+'删除</button>'
      + '</div>'
      + '</div>';
  });
  return h;
}
function quickStudy(){
  const t = $('studyTitle').value.trim();
  const tagStr = $('studyTags').value.trim();
  if(!t){ $('studyTitle').focus(); return; }
  const tags = tagStr ? tagStr.split(/[\s,，]+/).filter(Boolean) : [];
  db.studies.unshift({ id:uid(), title:t, content:'', tags, created:TODAY, createdAt:nowStamp(), duration:0 });
  $('studyTitle').value = ''; $('studyTags').value = '';
  save(); render(); toast('笔记已创建');
}
function editStudy(id){
  const s = id ? db.studies.find(x=>x.id===id) : null;
  openForm(s?'编辑学习笔记':'新建学习笔记', [
    { k:'title', l:'标题', t:'text', req:true, ph:'例：SVG 与 CSS 动画学习笔记' },
    { k:'content', l:'正文（长文本，支持多行）', t:'textarea', req:true, ph:'记下关键结论、心得、待办...' },
    { k:'tags', l:'标签（用空格分隔）', t:'text', ph:'前端 动画' },
    { k:'created', l:'日期', t:'date' },
    { k:'duration', l:'填写时长（分钟）', t:'number', ph:'例如 30' }
  ], s ? { ...s, tags:(s.tags||[]).join(' '), duration:(s.duration||0) } : { created:TODAY, duration:0 }, v => {
    const tags = v.tags ? v.tags.split(/[\s,，]+/).filter(Boolean) : [];
    if(s){ Object.assign(s, { title:v.title, content:v.content, tags, created:v.created, duration:Number(v.duration)||0 }); }
    else db.studies.unshift({ id:uid(), title:v.title, content:v.content, tags, created:v.created||TODAY, createdAt:nowStamp(), duration:Number(v.duration)||0 });
    save(); render(); toast('已保存');
  });
}
function delStudy(id){
  const s = db.studies.find(x=>x.id===id);
  confirmBox('删除学习笔记「'+s.title+'」？', '此操作不可撤销。', ()=>{
    db.studies = db.studies.filter(x=>x.id!==id); save(); render(); toast('已删除');
  });
}

const PRI = { P0:{c:'red'}, P1:{c:'amber'}, P2:{c:''} };
function projectAnalysisHTML(){
  const ps = db.projects;
  const ct = { '进行中':'#94b08e', '待启动':'#b6a6cf', '暂停':'#e0b56b', '已完成':'#9aa0a6' };
  const order = ['进行中','待启动','暂停','已完成'];
  const counts = order.map(s => ({ s, n: ps.filter(p=>p.status===s).length }));
  const total = ps.length || 1;
  const R=42, C=2*Math.PI*R, cx=60, cy=60;
  let off=0, segs='';
  counts.forEach(seg=>{
    if(seg.n>0){
      const len = seg.n/total*C;
      segs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+ct[seg.s]+'" stroke-width="13" stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      off += len;
    }
  });
  const donut = '<svg width="118" height="118" viewBox="0 0 120 120">'+segs
    + '<text x="60" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">'+ps.length+'</text>'
    + '<text x="60" y="74" text-anchor="middle" font-size="11" fill="var(--muted)">个项目</text></svg>';
  const legend = counts.map(seg=> '<div class="dlegend"><span class="dl-dot" style="background:'+ct[seg.s]+'"></span>'+seg.s+'<b>'+seg.n+'</b></div>').join('');

  const allT = ps.reduce((a,p)=>a+p.tasks.length,0);
  const doneT = ps.reduce((a,p)=>a+p.tasks.filter(t=>t.done).length,0);
  const tPct = allT ? Math.round(doneT/allT*100) : 0;
  const pbars = ps.slice().sort((a,b)=> (b.tasks.filter(t=>t.done).length)-(a.tasks.filter(t=>t.done).length)).slice(0,6).map(p=>{
    const t=p.tasks.length, d=p.tasks.filter(x=>x.done).length, pct=t?Math.round(d/t*100):0;
    return '<div class="pbar-row"><span class="pbar-name" title="'+esc(p.name)+'">'+esc(p.name)+'</span>'
      + '<span class="pbar-track"><i style="width:'+pct+'%;background:'+(p.status==='已完成'?'var(--green)':'var(--accent)')+'"></i></span>'
      + '<span class="pbar-pct">'+pct+'%</span></div>';
  }).join('') || '<div style="font-size:12px;color:var(--muted)">还没有项目</div>';

  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  const oc = months.map(m => ps.reduce((a,p)=> a + p.outputs.filter(o=>(o.date||'').slice(0,7)===m).length,0));
  const maxO = Math.max(1,...oc);
  const mbar = months.map((m,i)=> '<div class="mbar"><span class="mbar-f" style="height:'+Math.max(4,Math.round(oc[i]/maxO*100))+'%"></span><span class="mbar-l">'+m.slice(2)+'</span></div>').join('');

  return '<div class="card proj-an"><div class="card-h"><h3>项目数据分析</h3>'
    + '<div class="r" style="font-size:12px;color:var(--muted)">任务完成 '+doneT+'/'+allT+'（'+tPct+'%）</div></div>'
    + '<div class="proj-an-grid">'
    +   '<div class="pa-block"><div class="pa-h">状态分布</div><div class="pa-donut">'+donut+'<div class="pa-legend">'+legend+'</div></div></div>'
    +   '<div class="pa-block"><div class="pa-h">各项目任务完成度</div>'+pbars+'</div>'
    +   '<div class="pa-block"><div class="pa-h">近 6 个月产出</div><div class="mbars">'+mbar+'</div></div>'
    + '</div></div>';
}

function editProject(id){
  const p = id ? db.projects.find(x=>x.id===id) : null;
  openForm(p?'编辑项目':'新建项目', [
    { k:'name', l:'项目名称', t:'text', req:true, ph:'例：个人工作台 v1' },
    { k:'status', l:'状态', t:'select', opts:['进行中','待启动','暂停','已完成'] },
    { k:'desc', l:'一句话说清这个项目要干嘛', t:'textarea' },
    { k:'created', l:'创建日期', t:'date' }
  ], p || { status:'进行中', created:TODAY }, v => {
    if(p) Object.assign(p,v);
    else db.projects.unshift({ id:uid(), name:v.name, status:v.status, desc:v.desc, created:v.created||TODAY, tasks:[], assets:[], outputs:[] });
    save(); render(); toast('已保存');
  });
}
function delProject(id){
  const p = db.projects.find(x=>x.id===id);
  confirmBox('删除项目「'+p.name+'」？','包含 '+p.tasks.length+' 个任务、'+p.assets.length+' 条资料、'+p.outputs.length+' 项产出，全部删除且不可撤销。', ()=>{
    db.projects = db.projects.filter(x=>x.id!==id); closeProject(); save(); render(); toast('已删除');
  });
}
function toggleTask(pid,tid){ const t=db.projects.find(x=>x.id===pid).tasks.find(x=>x.id===tid); t.done=!t.done; save(); render(); }
function quickTask(pid,el){
  const v = el.value.trim(); if(!v) return;
  db.projects.find(x=>x.id===pid).tasks.push({ id:uid(), title:v, pri:'P2', done:false });
  el.value=''; save(); render(); toast('任务已添加');
}
function editTask(pid,tid){

  const t = tid ? p.tasks.find(x=>x.id===tid) : null;
  openForm(t?'编辑任务':'添加任务', [
    { k:'title', l:'任务内容', t:'text', req:true },
    { k:'pri', l:'优先级', t:'select', opts:[['P0','P0 · 最重要，先做'],['P1','P1 · 重要'],['P2','P2 · 有空再说']] }

    if(t) Object.assign(t,v);

    save(); render(); toast('已保存');

  });

function delProjItem(pid,field,id){
  const p = db.projects.find(x=>x.id===pid); if(!p) return;
  const names = { tasks:'任务', assets:'资料', outputs:'产出' };
  const item = (p[field]||[]).find(x=>x.id===id);
  const label = item ? (item.title||item.name||'该项') : '该项';

function statG(k,v,unit){
  return '<div class="stat"><div class="k">'+esc(k)+'</div><div class="v" style="color:#5f7d5a">'+v+(unit?'<small>'+unit+'</small>':'')+'</div></div>';
}
function barChart(list){
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  const vals = months.map(m => list.filter(x=>(x.date||'').startsWith(m)).reduce((a,x)=>a+(+x.amount||0),0));
  const max = Math.max(1, ...vals);
  const W = 640, H = 190, pad = 30, bw = 44;
  const step = (W - pad*2) / months.length;
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="190" preserveAspectRatio="xMidYMid meet" style="display:block">';
  [0,.25,.5,.75,1].forEach(f=>{ const y = pad + (H-pad-34)*(1-f); svg += '<line x1="'+pad+'" y1="'+y.toFixed(1)+'" x2="'+(W-pad+6)+'" y2="'+y.toFixed(1)+'" stroke="var(--surface3)" stroke-width="1"/>'; });
  months.forEach((m,i)=>{
    const v = vals[i];
    const hgt = Math.max(2, (H-pad-34) * v / max);
    const x = pad + step*i + (step-bw)/2;
    const y = H - 34 - hgt;
    const isNow = m === TODAY.slice(0,7);
    svg += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+hgt.toFixed(1)+'" rx="5" fill="'+(isNow?'#cbb6dd':'var(--accent)')+'"/>';
    if(v>0) svg += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--text)" font-weight="700">'+(v>=10000?(v/10000).toFixed(1)+'w':v)+'</text>';
    svg += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-13)+'" text-anchor="middle" font-size="11.5" fill="var(--muted)">'+(+m.slice(5))+'月</text>';
  });
  svg += '</svg>';
  return svg;
}
function sourceCard(list){
  const map = {};
  list.forEach(x => { const k = x.source||'未填来源'; map[k] = (map[k]||0) + (+x.amount||0); });
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max = Math.max(1, ...arr.map(a=>a[1]));
  const colors = ['#94b08e','var(--blue)','var(--accent)','var(--cyan)','var(--orange)','var(--pink)'];
  let h = '<div class="card" style="margin-bottom:0"><div class="card-h"><h3>收入来源 TOP</h3></div>';
  if(!arr.length) h += '<div style="color:var(--muted);font-size:13.5px">暂无数据</div>';
  arr.forEach((a,i)=>{
    h += '<div class="bar-row"><span class="nm" title="'+esc(a[0])+'">'+esc(a[0])+'</span>'
      + '<span class="tr"><i style="width:'+(a[1]/max*100).toFixed(1)+'%;background:'+colors[i%6]+'"></i></span>'
      + '<span class="vl">'+money(a[1])+'</span></div>';
  });
  return h + '</div>';
}
function catCard(list){
  const map = {};
  list.forEach(x => { const k = x.cat||'其他'; map[k] = (map[k]||0) + (+x.amount||0); });
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const total = arr.reduce((a,b)=>a+b[1],0) || 1;
  const colors = { '主业':'#94b08e','副业':'var(--orange)','理财':'var(--blue)','外快':'var(--accent)','红包':'var(--pink)','其他':'#b0a695' };
  let h = '<div class="card" style="margin-bottom:0"><div class="card-h"><h3>收入结构</h3></div>';
  if(!arr.length) return h + '<div style="color:var(--muted);font-size:13.5px">暂无数据</div></div>';
  const r = 52, cx = 66, cy = 66, C = 2*Math.PI*r;
  let acc = 0;
  let svg = '<svg viewBox="0 0 132 132" width="132" height="132" style="flex-shrink:0">';
  arr.forEach(a=>{
    const frac = a[1]/total, len = C*frac;
    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(colors[a[0]]||'#b0a695')+'" stroke-width="17" '
      + 'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+'")"/>';
    acc += len;
  });
  svg += '<text x="66" y="63" text-anchor="middle" font-size="12" fill="var(--muted)">合计</text>';
  svg += '<text x="66" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">'+(total>=10000?(total/10000).toFixed(1)+' 万':total)+'</text>';
  svg += '</svg>';
  h += '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">' + svg + '<div style="flex:1;min-width:150px">';
  arr.forEach(a=>{
    h += '<div style="display:flex;align-items:center;gap:8px;font-size:13.2px;margin-bottom:8px">'
      + '<span style="width:10px;height:10px;border-radius:3px;background:'+(colors[a[0]]||'#b0a695')+';flex-shrink:0"></span>'
      + '<span style="color:var(--text2)">'+esc(a[0])+'</span>'
      + '<span style="margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums">'+(a[1]/total*100).toFixed(0)+'% · '+money(a[1])+'</span></div>';
  });
  return h + '</div></div></div>';
}
function editIncome(id){

    { k:'amount', l:'金额（元）', t:'number', req:true, ph:'0' },

function exportCSV(){

let _openDD = null;
const _ddHooks = {};
/* opts 支持三种写法：'值' / ['值','显示名'] / {group:'分组标题'} */
function dd(id, inputId, opts, cur, onPick){
  const flat = opts.filter(o => !(o && o.group));
  const curOpt = flat.find(o=>{ const v=Array.isArray(o)?o[0]:o; return String(v)===String(cur); });
  const first = flat[0];
  const lab = curOpt ? (Array.isArray(curOpt)?curOpt[1]:curOpt)
                     : (first ? (Array.isArray(first)?first[1]:first) : '');
  if(onPick) _ddHooks[id] = onPick; else delete _ddHooks[id];
  let h = '<div class="dd" id="'+id+'">'
    + '<input type="hidden" id="'+inputId+'" value="'+esc(cur)+'">'
    + '<button type="button" class="dd-btn" onclick="toggleDD(\''+id+'\')">'
    +   '<span class="dd-val">'+esc(lab)+'</span>'
    +   '<svg class="dd-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
    + '</button>'
    + '<div class="dd-pop" style="display:none">';
  opts.forEach(o=>{
    if(o && o.group){ h += '<div class="dd-group">'+esc(o.group)+'</div>'; return; }
    const val = Array.isArray(o)?o[0]:o, l = Array.isArray(o)?o[1]:o;
    h += '<div class="dd-opt'+(String(val)===String(cur)?' on':'')+'" onclick="pickDD(\''+id+'\',\''+esc(val)+'\',\''+esc(l)+'\')">'+esc(l)+'</div>';
  });
  h += '</div></div>';
  return h;
}
function toggleDD(id){
  const el = document.getElementById(id); if(!el) return;
  const pop = el.querySelector('.dd-pop');
  const isOpen = pop.style.display === 'block';
  closeAllDD();
  if(!isOpen){ pop.style.display='block'; el.classList.add('on'); _openDD = id; }
}
function closeAllDD(){ document.querySelectorAll('.dd-pop').forEach(p=>p.style.display='none'); document.querySelectorAll('.dd').forEach(d=>d.classList.remove('on')); _openDD=null; }
function pickDD(ddId, val, lab){
  const el = document.getElementById(ddId);
  el.querySelector('.dd-val').textContent = lab;
  el.querySelector('input[type=hidden]').value = val;
  el.querySelectorAll('.dd-opt').forEach(o=>o.classList.remove('on'));
  const hit = Array.from(el.querySelectorAll('.dd-opt')).find(o=>o.textContent===lab);
  if(hit) hit.classList.add('on');
  closeAllDD();
  const fn = _ddHooks[ddId];
  if(typeof fn === 'function') fn(val, lab);
}
document.addEventListener('click', e => { if(_openDD && !e.target.closest('.dd')) closeAllDD(); });

function openForm(title, fields, values, onOK, onDelete){
  let h = '';
  fields.forEach(f => {
    const v = values[f.k] == null ? '' : values[f.k];
    h += '<div class="field"><label>'+esc(f.l)+(f.req?' <span style="color:var(--red)">*</span>':'')+'</label>';
    if(f.t === 'textarea') h += '<textarea id="f_'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
    else if(f.t === 'select'){
      h += dd('dd_'+f.k, 'f_'+f.k, f.opts, v);
    }
    else h += '<input id="f_'+f.k+'" type="'+(f.t||'text')+'"'+(f.t==='number'?' inputmode="decimal" step="0.01"':'')+' value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'">';
    if(f.hint) h += '<div class="hint">'+esc(f.hint)+'</div>';
    h += '</div>';
  });
  const btns = [];
  if(onDelete) btns.push({ t:'删除', cls:'btn danger', fn:()=>{ closeModal(); onDelete(); } });
  btns.push({ t:'取消', cls:'btn', fn:closeModal });
  btns.push({ t:'保存', cls:'btn primary', fn:()=>{
    const out = {};
    for(const f of fields){
      const el = $('f_'+f.k);
      const val = el ? el.value.trim() : '';
      if(f.req && !val){ toast('「'+f.l.replace(/（.*/,'')+'」不能为空'); el && el.focus(); return; }
      out[f.k] = val;
    }
    closeModal(); onOK(out);
  }});
  openModal(title, h, btns);
  setTimeout(()=>{ const first = $('f_'+fields[0].k); if(first && window.innerWidth>768) first.focus(); }, 60);
}
function confirmBox(title, desc, onOK){

    { t:'取消', cls:'btn', fn:closeModal },

  ]);
}

/* ============================================================
   云端同步（GitHub Gist）
============================================================ */
const GIST_API = 'https://api.github.com/gists';
const SYNC_FILE = 'momo-workbench.json';

function syncReady(){ return meta.sync && meta.sync.token && meta.sync.gistId; }
function ghHeaders(){ return { 'Authorization':'Bearer ' + meta.sync.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' }; }

function openSync(){
  const s = meta.sync || {};
  const last = s.lastSync ? new Date(s.lastSync).toLocaleString('zh-CN') : '尚未同步';
  const cfg = (s.token && s.gistId) ? '<span style="color:#5f7d5a">已配置</span>' : '<span style="color:var(--muted)">未配置</span>';
  const b = ''
    + '<div style="font-size:13.6px;line-height:1.85;color:var(--text2);margin-bottom:14px">'
    + '通过 GitHub <b>私有 Gist</b> 中转数据，实现多设备同步。只需三样：① 一个 GitHub 账号；② 一个<b>仅勾选 gist 权限</b>的私人访问令牌（PAT）；③ 一个 Gist（首次同步自动创建，可留空）。'
    + '<br>令牌只存在本机浏览器，仅用于读写你自己的 Gist，不上传我的服务器。'
    + '</div>'
    + '<label class="fld"><span>GitHub 访问令牌 (PAT)</span>'
    + '<input id="syncToken" type="password" placeholder="ghp_xxx 或 github_pat_xxx" value="'+esc(s.token)+'" autocomplete="off"></label>'
    + '<label class="fld"><span>Gist ID（留空则首次同步时自动新建）</span>'
    + '<input id="syncGist" type="text" placeholder="留空自动创建" value="'+esc(s.gistId)+'"></label>'
    + '<label style="display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:14px;color:var(--text)">'
    + '<input id="syncAuto" type="checkbox" '+(s.auto?'checked':'')+'> 自动同步：每次保存后自动推送到云端</label>'
    + '<div style="font-size:12.5px;color:var(--muted);margin:6px 0 12px"><span class="sync-dot '+(s.lastSync?'on':'')+'"></span>状态：'+cfg+' ｜ 上次同步：'+last+'</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + '<button class="btn primary" onclick="saveSyncCfg()">保存设置</button>'
    + '<button class="btn" onclick="closeModal();pullCloud(true)">从云端拉取 ▼</button>'
    + '<button class="btn" style="grid-column:1/3" onclick="closeModal();pushCloud(true)">推送本机数据到云端 ▲</button>'
    + '</div>';
  openModal('云端同步', b, [{ t:'关闭', cls:'btn', fn:closeModal }]);
}

function saveSyncCfg(){
  meta.sync = meta.sync || {};
  meta.sync.token = $('syncToken').value.trim();
  meta.sync.gistId = $('syncGist').value.trim();
  meta.sync.auto = $('syncAuto').checked;
  saveMeta();
  closeModal();
  toast((meta.sync.token && meta.sync.gistId) ? '同步设置已保存' : '已保存（未填令牌/Gist，暂不能同步）');
  if(meta.sync.token && meta.sync.gistId) pushCloud(false);
}

async function pushCloud(manual){
  if(!meta.sync || !meta.sync.token){ if(manual) toast('请先在「云端同步」里填写令牌'); return; }
  try{
    const content = JSON.stringify(db);
    let url = GIST_API, method = 'POST';
    const body = { files:{ [SYNC_FILE]:{ content } }, description:'沫沫的人生工作台 云端同步' };
    if(meta.sync.gistId){ url = GIST_API + '/' + meta.sync.gistId; method = 'PATCH'; }
    const res = await fetch(url, { method, headers: ghHeaders(), body: JSON.stringify(body) });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!meta.sync.gistId && data.id){ meta.sync.gistId = data.id; }
    meta.sync.lastSync = Date.now(); saveMeta();
    if(manual) toast('已推送到云端');
  }catch(e){
    if(manual) toast('推送失败：' + e.message + '（检查令牌/Gist ID/网络，GitHub API 需联网）');
    else console.warn('auto push failed:', e.message);
  }
}

async function pullCloud(manual){
  if(!syncReady()){ if(manual) toast('请先在「云端同步」里完成配置'); return; }
  try{
    const res = await fetch(GIST_API + '/' + meta.sync.gistId, { headers: ghHeaders() });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const file = data.files && data.files[SYNC_FILE];
    if(!file || !file.content){ if(manual) toast('云端暂无数据，请先推送一次'); return; }
    let nd;
    try{ nd = migrateData(JSON.parse(file.content)); }catch(err){ if(manual) toast('云端数据解析失败'); return; }
    if(manual && totalCount() > 0){
      confirmBoxCustom('从云端拉取？', '会用云端记录覆盖本机当前数据，<b>本机未同步的改动会丢失</b>。建议先点「导出备份」留底。', '确认拉取覆盖', ()=>applyPull(nd));
    } else {
      applyPull(nd);
    }
  }catch(e){
    if(manual) toast('拉取失败：' + e.message + '（检查令牌/Gist ID/网络）');
  }
}

function applyPull(nd){
  db = Object.assign(blankDB(), nd);
  ['goals','ideas','studies','projects','incomes','plans','reviews','pomos','library'].forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
  if(typeof db.gratitude !== 'object' || db.gratitude === null || Array.isArray(db.gratitude)) db.gratitude = {};
  db.goals.forEach(g=>{ if(!Array.isArray(g.milestones)) g.milestones=[]; });
  db.projects.forEach(p=>{ ['tasks','assets','outputs'].forEach(k=>{ if(!Array.isArray(p[k])) p[k]=[]; }); });
  db.seeded = true;
  meta.sync.lastSync = Date.now(); saveMeta();
  save(); closeProject(); render();
  toast('已从云端拉取最新数据');
}

let _pushTimer = null;
function schedulePush(){
  if(!meta.sync || !meta.sync.auto || !meta.sync.token || !meta.sync.gistId) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(()=>{ pushCloud(false); }, 900);
}

let gratView = { ym: TODAY.slice(0,7), sel: TODAY };

function gratMonthNav(delta){
  let [y,m] = gratView.ym.split('-').map(Number);

  gratView.ym = y+'-'+String(m).padStart(2,'0');

function selGratDay(d){ gratView.sel = d; render(); }

function gratCalendar(){
  const [y,m] = gratView.ym.split('-').map(Number);
  const first = new Date(y,m-1,1), startDow = first.getDay();
  const daysInMonth = new Date(y,m,0).getDate();
  const prevDays = new Date(y,m-1,0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({ d:prevDays-i, other:true });
  for(let d=1;d<=daysInMonth;d++) cells.push({ d, other:false, date: y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0') });
  while(cells.length%7!==0) cells.push({ d:'', other:true });
  const dows = ['日','一','二','三','四','五','六'];
  let h = '<div class="cal"><div class="cal-head">'
    + '<button class="iconbtn" onclick="gratMonthNav(-1)">'+ico('chev',16)+'</button>'
    + '<div class="mt">'+y+'年'+m+'月</div>'
    + '<button class="iconbtn" onclick="gratMonthNav(1)">'+ico('chev',16)+'</button></div>';
  h += '<div class="cal-grid">'+dows.map(w=>'<div class="cal-dow">'+w+'</div>').join('')+'</div>';
  h += '<div class="cal-grid">';
  cells.forEach(c=>{
    if(c.other || !c.date){ h += '<div class="cal-day other"></div>'; return; }
    const g = db.gratitude[c.date];
    const moodFace = (g && g.mood && moodOf(g.mood)) ? '<span class="cal-mood" title="'+esc(g.mood)+'">'+moodIcon(g.mood,13)+'</span>' : '';
    const cls = 'cal-day'+(c.date===TODAY?' today':'')+(c.date===gratView.sel?' sel':'')+(gratHas(c.date)?' has':'')+(gratComplete(c.date)?' done':'');
    h += '<div class="'+cls+'" onclick="selGratDay(\''+c.date+'\')">'+c.d+moodFace+'</div>';
  });
  h += '</div></div>';
  return h;
}

    + ' <span class="n">'+isArr.length+(max?' / '+max:'')+'</span></div>';

/* ---- 声音：Web Audio 合成机械滴答 ---- */
let _AC = null, _tickBuf = {};
function audioCtx(){
  if(!_AC){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{ _AC = new AC(); }catch(e){ return null; }
  }
  if(_AC.state === 'suspended'){ try{ _AC.resume(); }catch(e){} }
  return _AC;
}
function tickBuffer(ac, high){
  const key = high ? 'h' : 'l';
  if(_tickBuf[key]) return _tickBuf[key];
  const len = Math.floor(ac.sampleRate * 0.035);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++){
    const decay = Math.pow(1 - i/len, high ? 11 : 8);
    d[i] = (Math.random()*2 - 1) * decay;
  }
  _tickBuf[key] = buf;
  return buf;
}
function playTick(high){
  if(!pomoCfg.sound) return;
  const ac = audioCtx(); if(!ac) return;
  try{
    const src = ac.createBufferSource();
    src.buffer = tickBuffer(ac, high);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = high ? 2700 : 1850;
    bp.Q.value = 7;
    const g = ac.createGain();
    g.gain.value = high ? 0.15 : 0.19;
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start();
  }catch(e){}
}
function playBell(){
  const ac = audioCtx(); if(!ac) return;
  try{
    const t0 = ac.currentTime;
    [880, 1108.7, 1318.5].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      const t = t0 + i * 0.19;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.26, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 1.1);
    });
  }catch(e){}
}
function togglePomoSound(){
  pomoCfg.sound = !pomoCfg.sound;
  meta.pomoCfg = { minutes:pomoCfg.minutes, sound:pomoCfg.sound };
  saveMeta();
  if(pomoCfg.sound){ audioCtx(); playTick(true); }
  render();
}

function libDescendants(id){
  const out=[id]; const st=libChildren(id).map(x=>x.id);
  while(st.length){ const c=st.pop(); out.push(c); libChildren(c).forEach(k=>st.push(k.id)); }
  return out;
}

}

function paintLibList(){ const w = $('libListWrap'); if(w) w.innerHTML = libListHTML(); }
function libSearch(v){ libSearchTerm = v; paintLibList(); }
function libSetCat(c){ libCat = c; render(); }

function libFields(){
  return [
    { k:'catId', l:'知识分类', t:'select', opts:[['','未分类']].concat(libCatOptions()) },
    { k:'target', l:'归属项目 / 学习 / 目标', t:'select', opts:libLinkOptions() },
    { k:'note', l:'备注', ph:'可选' }

function libApplyTarget(x, out){
  x.catId = out.catId || '';
  const raw = out.target || 'none|'; const i = raw.indexOf('|');
  x.linkedType = raw.slice(0, i) || 'none';
  x.linkedId = raw.slice(i + 1);

function libUpload(input){
  const files = Array.from(input.files||[]);
  input.value = '';
  if(!files.length) return;
  const defCat = (libCatId && libCatId !== '__none__') ? libCatId : '';
  Promise.all(files.map(f=>{
    const id = uid();
    return putFile(id, f).then(()=>{
      const ext = (f.name.split('.').pop()||'').toLowerCase();
      db.library.unshift({ id, name:f.name, type:ext||'file', size:f.size, date:TODAY, catId:defCat, linkedType:'none', linkedId:'', note:'' });
    });
  })).then(()=>{
    save(); render(); toast('已存入 '+files.length+' 份资料'+(defCat?('（分类：'+libCatLabel(defCat)+'）'):'（仅本机）'));
  }).catch(()=>{
    save(); render(); toast('部分文件未能存入，可能超过浏览器存储上限');
  });
}
function libAddLink(){
  const defCat = (libCatId && libCatId !== '__none__') ? libCatId : '';
  openForm('添加链接资料', [
    { k:'name', l:'资料名称', req:true },
    { k:'url', l:'链接地址', req:true, ph:'https://…' }
  ].concat(libFields()), { catId:defCat, target:'none|' }, out=>{
    const x = { id:uid(), name:out.name, type:'link', url:out.url, size:0, date:TODAY, catId:'', linkedType:'none', linkedId:'', note:'' };
    libApplyTarget(x, out);
    db.library.unshift(x);
    save(); render(); toast('链接已添加');
  });
}
function libEdit(id){
  const x = db.library.find(z=>z.id===id); if(!x) return;
  const fields = [{ k:'name', l:'资料名称', req:true }]
    .concat(x.type==='link' ? [{ k:'url', l:'链接地址' }] : [])
    .concat(libFields());
  openForm('编辑资料', fields, { name:x.name, url:x.url||'', catId:x.catId||'', target:(x.linkedType||'none')+'|'+(x.linkedId||''), note:x.note||'' }, out=>{
    x.name = out.name || x.name;
    if(x.type==='link' && out.url) x.url = out.url;
    libApplyTarget(x, out);
    save(); render(); toast('已更新');
  });
}
function libOpenLink(id){ libEdit(id); }
let _libUrl = null;
function libModal(title, body, btns){
  openModal(title, body, btns);
  const m = $('mask').querySelector('.modal'); if(m) m.classList.add('lib-preview');
}
function libOpen(id){
  const x = db.library.find(z=>z.id===id); if(!x) return;
  const ext = (x.type||'').toLowerCase();
  if(x.type === 'link'){
    _libUrl = null;
    libModal(esc(x.name),
      '<div class="lib-pv-link"><iframe class="lib-pv-frame" src="'+esc(x.url)+'"></iframe>'
      + '<div class="lib-pv-tip">若对方网站禁止内嵌，可点「新标签打开」</div></div>',
      [ { t:'新标签打开', cls:'btn', fn:()=>window.open(x.url,'_blank','noopener') }, { t:'关闭', cls:'btn', fn:closeModal } ]);
    return;
  }
  getFile(id).then(blob=>{
    if(!blob){ toast('本机文件数据缺失，请重新上传'); return; }
    if(['txt','md','csv'].includes(ext)){
      _libUrl = null;
      blob.text().then(txt=>{
        libModal(esc(x.name), '<pre class="lib-pv-text">'+esc(txt)+'</pre>', [ { t:'关闭', cls:'btn', fn:closeModal } ]);
      });
      return;
    }
    _libUrl = URL.createObjectURL(blob);
    let body;
    const btns = [ { t:'关闭', cls:'btn', fn:closeModal } ];
    if(['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext)){
      body = '<div class="lib-pv-imgwrap"><img class="lib-pv-img" src="'+_libUrl+'" alt="'+esc(x.name)+'"></div>';
    } else if(ext === 'pdf'){
      body = '<iframe class="lib-pv-frame" src="'+_libUrl+'"></iframe>';
    } else {
      body = '<div class="lib-pv-none">'+ico('file',30)+'<p>此文件类型暂不支持内联预览</p><span>'+esc(x.name)+'</span></div>';
      btns.unshift({ t:'下载到本机打开', cls:'btn primary', fn:()=>libDownload(id) });
    }
    libModal(esc(x.name), body, btns);
  }).catch(()=> toast('打开失败'));
}
function libDownload(id){
  const x = db.library.find(z=>z.id===id); if(!x) return;
  if(x.type === 'link'){ window.open(x.url,'_blank','noopener'); return; }
  getFile(id).then(blob=>{
    if(!blob){ toast('本机文件数据缺失'); return; }
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = x.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 60000);
  }).catch(()=> toast('下载失败'));
}
function libDel(id){
  const x = db.library.find(z=>z.id===id); if(!x) return;
  confirmBoxCustom('删除这份资料？', '「'+esc(x.name)+'」将从资料库移除'+(x.type!=='link'?'，本机文件也会一并删除':'')+'。', '删除', ()=>{
    db.library = db.library.filter(z=>z.id!==id);
    if(x.type!=='link') delFile(id);
    save(); render(); toast('已删除');
  });
}

/* ---- 计时 ---- */
function fmtClock(sec){
  const m = Math.floor(Math.max(0,sec)/60), s = Math.max(0,sec)%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function setPomoMinutes(m){
  if(pomo.running) return;
  pomoCfg.minutes = m;
  pomo.total = m*60; pomo.remain = m*60;
  meta.pomoCfg = { minutes:m, sound:pomoCfg.sound };
  saveMeta();
  render();
}
function startPomo(){
  audioCtx();
  if(pomo.paused){
    pomo.endAt = Date.now() + pomo.remain*1000;
    pomo.paused = false; pomo.running = true;
  }else{
    pomo.total = pomoCfg.minutes*60;
    pomo.remain = pomo.total;
    pomo.endAt = Date.now() + pomo.total*1000;
    pomo.running = true; pomo.paused = false;
  }
  pomo.lastSec = -1;
  if(pomo.timer) clearInterval(pomo.timer);
  pomo.timer = setInterval(pomoLoop, 200);
  render();
  toast('专注开始，'+pomoCfg.minutes+' 分钟后见');
}
function pausePomo(){
  if(!pomo.running) return;
  pomo.remain = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
  pomo.running = false; pomo.paused = true;
  if(pomo.timer){ clearInterval(pomo.timer); pomo.timer = null; }
  render();
}
function abortPomo(){
  confirmBox('放弃这个番茄？', '当前进度不会被记录，确定要放弃吗？', () => {
    stopPomoTimer();
    pomo.remain = pomoCfg.minutes*60;
    pomo.total = pomoCfg.minutes*60;
    render();
    toast('已放弃，休息一下再来');
  });
}
function stopPomoTimer(){
  if(pomo.timer){ clearInterval(pomo.timer); pomo.timer = null; }
  pomo.running = false; pomo.paused = false; pomo.lastSec = -1;
}
function pomoLoop(){
  const left = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
  if(left !== pomo.lastSec){
    pomo.lastSec = left;
    pomo.remain = left;
    pomo.secTick++;
    if(left > 0) playTick(pomo.secTick % 2 === 0);
    paintPomo();
  }
  if(left <= 0) finishPomo();
}
function finishPomo(){
  stopPomoTimer();
  playBell();
  const now = new Date();
  const at = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const links = pomoCfg.links.map(l=>({ type:l.type, id:l.id }));
  db.pomos.unshift({
    id: uid(), date: d2s(now), at: at, min: pomoCfg.minutes,
    links: links,
    label: links.map(l=>pomoLinkLabel(l.type,l.id)).join(' · '), note: ''
  });
  save();
  pomo.remain = pomoCfg.minutes*60;
  pomo.total = pomoCfg.minutes*60;
  render();
  const lab = curPomoLabel();
  toast('番茄完成！' + (lab ? '「'+lab+'」+1' : '专注 '+pomoCfg.minutes+' 分钟'));
}
function delPomo(id){ db.pomos = db.pomos.filter(x=>x.id!==id); save(); render(); toast('已删除'); }

/* ---- 只刷新计时相关节点，避免整页重绘 ---- */
function paintPomo(){
  const t = fmtClock(pomo.remain);
  const el = $('pomoTime'); if(el) el.textContent = t;
  const ring = $('pomoArc');
  if(ring){
    const r = 104, c = 2*Math.PI*r;
    const pct = pomo.total ? (pomo.total - pomo.remain)/pomo.total : 0;
    ring.setAttribute('stroke-dasharray', (c*pct).toFixed(1)+' '+(c*(1-pct)).toFixed(1));
  }
  const hand = $('pomoHand');
  if(hand){
    const secInto = pomo.total - pomo.remain;
    hand.setAttribute('transform', 'rotate('+((secInto % 60) * 6)+' 60 60)');
  }
  const lk = $('pomoLinked');
  if(lk){
    const ls = curPomoLabels();
    lk.innerHTML = ls.length ? ls.map((l,i)=> (i? ' · ':'') + (pomoCfg.links[i]?pomoTypeName(pomoCfg.links[i].type)+' · ':'') + esc(l)).join('') : '';
  }
  paintPomoMini();
}
function paintPomoMini(){
  const box = $('pomoMini'); if(!box) return;
  const active = pomo.running || pomo.paused;
  box.classList.toggle('on', active && route.tab !== 'pomo');
  box.classList.toggle('paused', pomo.paused);
  if(!active) return;
  $('pomoMiniTime').textContent = fmtClock(pomo.remain);
  $('pomoMiniIco').innerHTML = ico(pomo.paused ? 'pause' : 'tomato', 16);
  const l = curPomoLabel();
  $('pomoMiniLab').textContent = l || (pomo.paused ? '已暂停' : '专注中');
}

/* ---- 视图 ---- */
function viewPomo(){
  const ps = db.pomos;
  const today = ps.filter(p => p.date === TODAY);
  const todayMin = today.reduce((a,p)=>a+(p.min||25),0);
  const totalMin = ps.reduce((a,p)=>a+(p.min||25),0);
  const days = new Set(ps.map(p=>p.date)).size;

  let h = '<div class="grid g4 stats" style="margin-bottom:18px">'
    + stat('今日番茄', today.length, '个')
    + stat('今日专注', todayMin >= 60 ? (todayMin/60).toFixed(1) : todayMin, todayMin >= 60 ? '小时' : '分钟')
    + stat('累计番茄', ps.length, '个')
    + stat('专注天数', days, '天') + '</div>';

  // 顶部：专注力总结与分析
  const agg = {};
  ps.forEach(p => {
    const links = (p.links && p.links.length) ? p.links : [{ type:'none', id:'' }];
    links.forEach(l => {
      const k = l.type + '|' + l.id;
      if(!agg[k]) agg[k] = { n:0, min:0, label: pomoLinkLabel(l.type, l.id) || '未关联的专注', type: l.type };
      agg[k].n++; agg[k].min += (p.min||25);
    });
  });
  const aggList = Object.values(agg).sort((a,b)=>b.min-a.min).slice(0,8);
  h += '<div class="card pomo-analysis"><div class="card-h"><h3>专注力总结与分析</h3>'
    + '<div class="r" style="font-size:12px;color:var(--muted)">累计 '+totalMin+' 分钟 · 平均每日 '+((days?Math.round(totalMin/days):0))+' 分钟</div></div>';
  if(!aggList.length) h += emptyBox('完成第一个番茄后，这里会显示你的时间去向');
  else{
    const max = aggList[0].min || 1;
    aggList.forEach(a => {
      h += '<div class="pomo-bar">'
        + '<span class="bn" title="'+esc(a.label)+'">'+esc(a.label)+'</span>'
        + '<span class="bt"><span class="bf" style="width:'+Math.max(6, Math.round(a.min/max*100))+'%"></span></span>'
        + '<span class="bv">'+a.n+' 个</span></div>';
    });
    if(aggList[0]) h += '<div class="pomo-insight">'+ico('spark',14)+'<span>投入最多的是 <b>'+esc(aggList[0].label)+'</b>，共 '+aggList[0].min+' 分钟。</span></div>';
  }
  h += '</div>';

  // 左右布局：左番茄钟 / 右番茄记录
  h += '<div class="pomo-lr">';

  // 左：番茄钟独立卡片
  h += '<div class="card pomo-timer">';
  h += '<div class="card-h"><h3>专注计时</h3>'
    + '<div class="r"><button class="pomo-sound'+(pomoCfg.sound?'':' off')+'" onclick="togglePomoSound()">'
    + ico(pomoCfg.sound?'volume':'mute',14) + (pomoCfg.sound?'滴答声开':'已静音') + '</button></div></div>';

  const r = 104, c = 2*Math.PI*r;
  const pct = pomo.total ? (pomo.total - pomo.remain)/pomo.total : 0;
  const secInto = pomo.total - pomo.remain;
  const linkLab = curPomoLabel();

  h += '<div class="pomo-stage"><div class="pomo-ring-wrap">'
    + '<svg width="190" height="190" viewBox="0 0 240 240">'
    +   '<circle cx="120" cy="120" r="'+r+'" fill="none" stroke="var(--surface3)" stroke-width="13"/>'
    +   '<circle id="pomoArc" cx="120" cy="120" r="'+r+'" fill="none" stroke="'+(pomo.running?'var(--red)':'var(--accent)')+'" stroke-width="13" stroke-linecap="round"'
    +     ' stroke-dasharray="'+(c*pct).toFixed(1)+' '+(c*(1-pct)).toFixed(1)+'"/>'
    +   '<g transform="translate(60 60)">'
    +     '<line id="pomoHand" x1="60" y1="60" x2="60" y2="18" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round"'
    +       ' transform="rotate('+((secInto % 60) * 6)+' 60 60)" class="pomo-hand"/>'
    +     '<circle cx="60" cy="60" r="3.4" fill="var(--red)"/>'
    +   '</g>'
    + '</svg>'
    + '<div class="pomo-face">'
    +   '<div class="pomo-time" id="pomoTime">'+fmtClock(pomo.remain)+'</div>'
    +   '<div class="pomo-state">'+(pomo.running?'专注中':(pomo.paused?'已暂停':'准备开始'))+'</div>'
    +   '<div class="pomo-linked" id="pomoLinked">'+(linkLab?esc(pomoTypeName(pomoCfg.linkType)+' · '+linkLab):'')+'</div>'
    + '</div></div></div>';

  h += '<div class="pomo-mins">';
  POMO_MINS.forEach(m => {
    h += '<button class="pomo-min'+(pomoCfg.minutes===m?' on':'')+'"'+(pomo.running||pomo.paused?' disabled':'')
      + ' onclick="setPomoMinutes('+m+')">'+m+'′</button>';

  h += '</div>';

  if(!pomo.running && !pomo.paused)
    h += '<button class="pomo-big" onclick="startPomo()">'+ico('play',17)+'开始专注</button>';

  h += '<div class="card pomo-records"><div class="card-h"><h3>番茄记录</h3><div class="r" style="font-size:12px;color:var(--muted)">共 '+ps.length+' 个</div></div>';
  h += '<div class="pomo-list">';

      const mins = gp[d].reduce((a,p)=>a+(p.min||25),0);

  h += '</div></div>';

  h += '</div>';
  return h;

const ACCT_GROUPS = [
  { k:'work', n:'工作', desc:'公司邮箱 / OA / 内部系统' },
  { k:'life', n:'生活', desc:'银行 / 会员 / 个人服务' }
];
const ACCT_SHOWN = new Set();

function copyText(t, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast(msg||'已复制')).catch(()=>fallbackCopy(t,msg));
  } else fallbackCopy(t,msg);
}
function fallbackCopy(t, msg){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg||'已复制'); }catch(e){ toast('复制失败，请手动复制'); }
  ta.remove();
}
function maskPass(p){ return '•'.repeat(Math.max(6, Math.min((p||'').length, 12))); }

  h += '<div class="acct-row"><span class="acct-k">密码</span>'
    + '<span class="acct-v mono">'+(shown?esc(a.pass||'—'):maskPass(a.pass||''))+'</span>'
    + '<button class="iconbtn" title="'+(shown?'隐藏密码':'显示密码')+'" onclick="acctToggle(\''+a.id+'\')">'+ico(shown?'eyeOff':'eye',14)+'</button>'
    + '<button class="iconbtn" title="复制密码" onclick="copyAcct(\''+a.id+'\',\'pass\',\'密码已复制\')">'+ico('copy',13)+'</button></div>';
  if(a.note) h += '<div class="acct-note">'+esc(a.note)+'</div>';
  h += '</div>';
  return h;
}
function viewAccounts(){
  let h = '<div class="acct-tip">'+ico('lock',15)+'账号密码只存在本机浏览器、不上传服务器；若部署到线上，链接公开可访问，请勿填入真实敏感密码，或只记便于记忆的提示。</div>';
  ACCT_GROUPS.forEach(g => {
    const list = db.accounts.filter(a=>a.group===g.k);
    h += '<div class="acct-group">';
    h += '<div class="acct-group-h"><div class="ag-title">'+g.n+' <span class="cnt">'+list.length+'</span></div>'
      + '<button class="btn primary sm" onclick="addAcct(\''+g.k+'\')">'+ico('plus',15)+'添加'+g.n+'账号</button></div>';
    h += '<div class="acct-grid">';
    if(!list.length) h += '<div class="card empty" style="grid-column:1/-1">'+ico('box2',30,1.5)+'<div>还没有'+g.n+'账号，点上面添加</div></div>';
    else list.forEach(a => h += acctCard(a));
    h += '</div></div>';
  });
  return h;
}
function acctToggle(id){ if(ACCT_SHOWN.has(id)) ACCT_SHOWN.delete(id); else ACCT_SHOWN.add(id); render(); }
function copyAcct(id, field, msg){
  const a = db.accounts.find(x=>x.id===id); if(!a) return;
  copyText(field==='user'?(a.user||''):(a.pass||''), msg);
}
function acctFields(v){
  return [
    { k:'name', l:'名称', ph:'如：公司邮箱', req:true },
    { k:'url',  l:'网址（可选）', ph:'https://...' },
    { k:'user', l:'账号', ph:'用户名 / 手机号 / 邮箱' },
    { k:'pass', l:'密码', ph:'留空则只记账号' },
    { k:'note', l:'备注（可选）', t:'textarea', ph:'找回方式 / 提示等' }
  ];
}
function addAcct(group){
  openForm('添加'+(group==='life'?'生活':'工作')+'账号', acctFields(), { group: group||'work' }, (out)=>{
    db.accounts.push({ id:uid(), group: group||'work', name:out.name, url:out.url, user:out.user, pass:out.pass, note:out.note, created:TODAY });
    save(); render(); toast('已添加');
  });
}
function editAcct(id){
  const a = db.accounts.find(x=>x.id===id); if(!a) return;
  openForm('编辑账号', acctFields(), a, (out)=>{
    Object.assign(a, { name:out.name, url:out.url, user:out.user, pass:out.pass, note:out.note });
    save(); render(); toast('已保存');
  }, ()=>delAcct(id));
}
function delAcct(id){
  const a = db.accounts.find(x=>x.id===id); if(!a) return;
  confirmBox('删除账号「'+(a.name||'未命名')+'」？', '删除后无法恢复，请确认。', ()=>{
    db.accounts = db.accounts.filter(x=>x.id!==id); ACCT_SHOWN.delete(id); save(); render(); toast('已删除');
  });
}

/* ============================================================
   渲染
============================================================ */
function dailySubNav(){
  let h = '<div class="daily-sub">';
  DAILY_TABS.forEach(t => {
    h += '<button class="'+(route.tab===t.k?'on':'')+'" onclick="go(\''+t.k+'\')">'+ico(t.i,15)+t.n+'</button>';
  });
  return h + '</div>';
}
function render(){
  renderNav();
  renderNotice();
  const v = $('view');
  const isDaily = DAILY_TABS.some(t=>t.k===route.tab);
  const pre = isDaily ? dailySubNav() : '';
  if(route.tab === 'goals') v.innerHTML = viewGoals();
  else if(route.tab === 'ideas') v.innerHTML = viewIdeas();
  else if(route.tab === 'studies') v.innerHTML = viewStudies();
  else if(route.tab === 'incomes') v.innerHTML = viewIncomes();
  else if(route.tab === 'plan') v.innerHTML = pre + viewPlan();
  else if(route.tab === 'pomo') v.innerHTML = pre + viewPomo();
  else if(route.tab === 'gratitude') v.innerHTML = pre + viewGratitude();
  else if(route.tab === 'library') v.innerHTML = viewLibrary();
  else if(route.tab === 'accounts') v.innerHTML = viewAccounts();
  else v.innerHTML = viewProjects();
  paintPomoMini();
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
window.addEventListener('beforeunload', e => {
  if(pomo.running){ e.preventDefault(); e.returnValue = ''; return ''; }
});

load();
if(meta.pomoCfg){
  pomoCfg.minutes = meta.pomoCfg.minutes || 25;
  pomoCfg.sound = meta.pomoCfg.sound !== false;
  pomo.total = pomo.remain = pomoCfg.minutes * 60;
}
render();
</script>
</body>
