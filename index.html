function heatOp(v, max){ return Math.max(0.08, Math.min(1, v / Math.max(1, max))); }
function weekStart(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  const dow = (x.getDay()+6)%7; // Mon=0
  x.setDate(x.getDate()-dow); return x;
}
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtShortMD(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function pomoHeatmapWeek(){
  const start = weekStart(new Date());
  const dayNames = ['周一','周二','周三','周四','周五','周六','周日'];
  const days = [];
  for(let i=0;i<7;i++){ days.push(addDays(start,i)); }
  const dsList = days.map(d=>d2s(d));
  const end = addDays(start,7);

  // 收集本周事件：每个番茄作为一个连续色块
  const events = [];
  db.pomos.filter(p => !p.aborted).forEach(p => {
    const pd = new Date(p.date);
    if(pd < start || pd >= end) return;
    const dayIdx = dsList.indexOf(p.date);
    if(dayIdx < 0) return;
    const [h,m] = (p.at||'00:00').split(':').map(Number);
    const startMin = Math.max(0, Math.min(1439, h*60 + (m||0)));
    const dur = Math.min(p.actualMin||p.min||25, 1440 - startMin);
    if(dur <= 0) return;
    events.push({ dayIdx, startMin, dur });
  });

  let h = '<div class="pd-heat-wrap"><div class="pd-heat">';
  h += '<span class="pd-heat-corner"></span>' + days.map((d,i)=>'<span class="pd-heat-day">'+fmtShortMD(d)+'<br>'+dayNames[i]+'</span>').join('');
  for(let hr=0; hr<24; hr++){
    const hrS = String(hr).padStart(2,'0');
    h += '<span class="pd-heat-hour">'+hrS+':00</span>';
    for(let d=0; d<7; d++) h += '<span class="pd-heat-cell"></span>';
  }
  h += '<div class="pd-heat-events-overlay">';
  events.forEach(e => {
    const top = (e.startMin / 1440 * 100).toFixed(2);
    const height = Math.max(0.5, (e.dur / 1440 * 100)).toFixed(2);
    const hh = Math.floor(e.startMin/60).toString().padStart(2,'0');
    const mm = (e.startMin%60).toString().padStart(2,'0');
    h += '<div class="pd-heat-event" style="grid-column:'+(e.dayIdx+1)+';top:'+top+'%;height:'+height+'%;" title="'+dsList[e.dayIdx]+' '+hh+':'+mm+' · '+e.dur+' 分钟"></div>';
  });
  h += '</div></div></div>';
  return h;
}
function pomoHeatmapMonth(){
  const [y,m] = TODAY.split('-').map(Number);
  const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
  let cur = weekStart(first);
  const weeks = [];
  while(weeks.length < 6 && cur <= last){
    const w = []; for(let i=0;i<7;i++){ w.push(new Date(cur)); cur = addDays(cur,1); }
    weeks.push(w);
  }
  const mins = {};
  db.pomos.filter(p => !p.aborted).forEach(p => {
    mins[p.date] = (mins[p.date]||0) + (p.actualMin||p.min||25);
  });
  const max = Math.max(1, ...Object.values(mins));
  const dayNames = ['日','一','二','三','四','五','六'];
  let h = '<div class="pd-heat-month">';
  h += '<div class="pd-month-h">' + dayNames.map(d=>'<span>'+d+'</span>').join('') + '</div>';
  weeks.forEach(w => {
    h += '<div class="pd-month-row">';
    w.forEach(d => {
      const ds = d2s(d), inMonth = d.getMonth()+1 === m;
      const v = inMonth ? (mins[ds]||0) : 0;
      h += '<div class="pd-month-cell'+(inMonth?' in':'')+(v?' on':'')+'" style="--ho:'+heatOp(v,max)+';background:'+(inMonth?'rgba(224,163,184,'+heatOp(v,max)+')':'var(--surface2)')+'" title="'+ds+' · '+v+' 分钟">'
        + '<span class="pd-month-d">'+(inMonth?d.getDate():'')+'</span></div>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function copyText(t, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast(msg||'已复制')).catch(()=>fallbackCopy(t,msg));
  } else fallbackCopy(t,msg);

function fallbackCopy(t, msg){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg||'已复制'); }catch(e){ toast('复制失败，请手动复制'); }
  ta.remove();
}

    h += '<div class="acct-group">';
    h += '<div class="acct-group-h"><div class="ag-title">'+g.n+' <span class="cnt">'+list.length+'</span></div>'
      + '<button class="btn primary sm" onclick="addAcct(\''+g.k+'\')">'+ico('plus',15)+'添加'+g.n+'账号</button></div>';
    h += '<div class="acct-grid">';
    if(!list.length) h += '<div class="card empty" style="grid-column:1/-1">'+ico('box2',30,1.5)+'<div>还没有'+g.n+'账号，点上面添加</div></div>';
    else list.forEach(a => h += acctCard(a));
    h += '</div></div>';
  });
  return h;
}
function acctToggle(id){ if(ACCT_SHOWN.has(id)) ACCT_SHOWN.delete(id); else ACCT_SHOWN.add(id); render(); }
function copyAcct(id, field, msg){
  const a = db.accounts.find(x=>x.id===id); if(!a) return;
  let v = '';
  if(field==='user') v = a.user||'';
  else if(field==='pass') v = a.pass||'';
  else if(field==='url') v = a.url||'';
  copyText(v, msg);
}
function acctFields(v){
  return [
    { k:'name', l:'名称', ph:'如：公司邮箱', req:true },
    { k:'url',  l:'网址（可选）', ph:'https://...' },
    { k:'user', l:'账号', ph:'用户名 / 手机号 / 邮箱' },
    { k:'pass', l:'密码', ph:'留空则只记账号' },
    { k:'note', l:'备注（可选）', t:'textarea', ph:'找回方式 / 提示等' }
  ];
}
function addAcct(group){
  openForm('添加'+(group==='life'?'生活':'工作')+'账号', acctFields(), { group: group||'work' }, (out)=>{
    db.accounts.push({ id:uid(), group: group||'work', name:out.name, url:out.url, user:out.user, pass:out.pass, note:out.note, created:TODAY });
    save(); render(); toast('已添加');
  });
}
function editAcct(id){
  const a = db.accounts.find(x=>x.id===id); if(!a) return;
  openForm('编辑账号', acctFields(), a, (out)=>{
    Object.assign(a, { name:out.name, url:out.url, user:out.user, pass:out.pass, note:out.note });
    save(); render(); toast('已保存');
  }, ()=>delAcct(id));
}
function delAcct(id){
  const a = db.accounts.find(x=>x.id===id); if(!a) return;
  confirmBox('删除账号「'+(a.name||'未命名')+'」？', '删除后无法恢复，请确认。', ()=>{
    db.accounts = db.accounts.filter(x=>x.id!==id); ACCT_SHOWN.delete(id); save(); render(); toast('已删除');
  });
}

/* ============================================================
   渲染
============================================================ */
function dailySubNav(){
  let h = '<div class="daily-sub">';
  DAILY_TABS.forEach(t => {
    h += '<button class="'+(route.tab===t.k?'on':'')+'" onclick="go(\''+t.k+'\')">'+ico(t.i,15)+t.n+'</button>';
  });
  return h + '</div>';
}
function render(){
  renderNav();
  renderNotice();
  const v = $('view');
  const isDaily = DAILY_TABS.some(t=>t.k===route.tab);
  const pre = isDaily ? dailySubNav() : '';
  if(route.tab === 'goals') v.innerHTML = viewGoals();
  else if(route.tab === 'ideas') v.innerHTML = viewIdeas();
  else if(route.tab === 'studies') v.innerHTML = viewStudies();
  else if(route.tab === 'incomes') v.innerHTML = viewIncomes();
  else if(route.tab === 'plan') v.innerHTML = pre + viewPlan();
  else if(route.tab === 'review') v.innerHTML = pre + viewReview();
  else if(route.tab === 'pomo') v.innerHTML = pre + viewPomo();
  else if(route.tab === 'records') v.innerHTML = pre + viewRecords();
  else if(route.tab === 'gratitude') v.innerHTML = pre + viewGratitude();
  else if(route.tab === 'library') v.innerHTML = viewLibrary();
  else if(route.tab === 'accounts') v.innerHTML = viewAccounts();
  else v.innerHTML = viewProjects();
  paintPomoMini();
  paintAccount();
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
window.addEventListener('beforeunload', e => {
  if(pomo.running){ e.preventDefault(); e.returnValue = ''; return ''; }
});

(async function(){
  await restoreSession();
  load();
  if(meta.pomoCfg){
    pomoCfg.minutes = meta.pomoCfg.minutes || 25;
    pomoCfg.sound = meta.pomoCfg.sound !== false;
    pomo.total = pomo.remain = pomoCfg.minutes * 60;
  }
  /* 灵感库：跨断点时切换瀑布流 / 时间轴布局 */
  (function(){
    let _m = window.innerWidth <= 768;
    window.addEventListener('resize', () => {
      const m = window.innerWidth <= 768;
      if(_m !== m){ _m = m; if(route.tab === 'ideas') render(); }
    });
  })();
  render();
  if(SESSION.user && !SKEY) openLogin();
})();
</script>
