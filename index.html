<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3efe9">
<title>沫沫的人生工作台</title>
<style>
:root{
  /* 莫兰迪可爱风 · 低饱和暖色系 */
  --bg:#f4f0ea;
  --bg2:#efe9e1;
  --surface:#fffdfa;
  --surface2:#f7f2ea;
  --surface3:#efe8de;
  --border:#e7ded2;
  --border2:#d8cdbc;
  --text:#55504a;
  --text2:#8a8178;
  --muted:#aaa097;
  --accent:#b49cc9;        /* 柔和雾紫 */
  --accent2:#9a7fb5;
  --accent-soft:rgba(180,156,201,.16);
  --green:#94b08e;         /* 莫兰迪绿 */
  --green-soft:rgba(148,176,142,.18);
  --red:#cf9b94;           /* 陶土红 */
  --red-soft:rgba(207,155,148,.16);
  --blue:#9fb4c4;
  --cyan:#9ec3bf;
  --orange:#d6a878;
  --pink:#d3a4ab;
  --amber:#d8b483;
  --radius:20px;
  --radius-sm:14px;
  --shadow:0 2px 14px rgba(120,105,90,.07);
  --shadow-lg:0 14px 40px rgba(120,105,90,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent2);text-decoration:none;word-break:break-all}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d3c8b9;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;padding:22px 14px;
}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.logo-mark{width:40px;height:40px;border-radius:14px;background:linear-gradient(140deg,var(--accent),#cbb6dd);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 16px rgba(180,156,201,.4)}
.logo-txt b{display:block;font-size:15.5px;font-weight:700;letter-spacing:.3px;color:var(--text)}
.logo-txt span{display:block;font-size:9.5px;color:var(--muted);letter-spacing:1.4px}
.nav-section{margin-bottom:14px}
.nav-section-title{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px;padding:0 13px;margin-bottom:8px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 13px;border-radius:13px;color:var(--text2);
  font-size:14px;margin-bottom:4px;transition:.16s;text-align:left;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.on{background:var(--accent);color:#fff;font-weight:650;box-shadow:0 6px 16px rgba(180,156,201,.34)}
.nav-item svg{flex-shrink:0}
.nav-item .n{ margin-left:auto;font-size:11px;background:var(--surface3);color:var(--text2);padding:1px 7px;border-radius:10px;font-weight:600}
.nav-item.on .n{background:rgba(255,255,255,.24);color:#fff}
.nav-project{padding-left:38px;font-size:13.5px;color:var(--text2)}
.nav-project::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:-7px}
.nav-project.on::before{background:var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.side-foot .mini{width:100%;justify-content:flex-start;font-size:13px;color:var(--text2);padding:10px 13px;border-radius:13px;display:flex;align-items:center;gap:9px;transition:.16s}
.side-foot .mini:hover{background:var(--surface2);color:var(--text)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:12px;padding:16px 26px;
  border-bottom:1px solid var(--border);background:rgba(244,240,234,.9);
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:30;
}
.topbar h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.3px;color:var(--text)}
.topbar .sub{font-size:13px;color:var(--muted);margin-left:3px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{padding:24px 26px 70px;max-width:1340px;width:100%}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 17px;border-radius:13px;background:var(--surface2);
  border:1px solid var(--border);color:var(--text);font-size:14px;
  min-height:42px;transition:.16s;white-space:nowrap;
}
.btn:hover{background:var(--surface3);border-color:var(--border2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(207,155,148,.3);background:var(--red-soft)}
.btn.danger:hover{background:rgba(207,155,148,.22)}
.btn.sm{padding:7px 13px;min-height:36px;font-size:13px;border-radius:11px}
.btn.xs{padding:5px 11px;min-height:32px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{margin:0;font-size:16px;font-weight:700;color:var(--text)}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}

.tag{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;background:var(--surface3);color:var(--text2);border:1px solid var(--border);white-space:nowrap}
.tag.amber{background:rgba(216,180,131,.16);color:#a8824e;border-color:rgba(216,180,131,.3)}
.tag.green{background:var(--green-soft);color:#5f7d5a;border-color:rgba(148,176,142,.3)}
.tag.red{background:var(--red-soft);color:#a96d64;border-color:rgba(207,155,148,.3)}
.tag.blue{background:rgba(159,180,196,.16);color:#5f7d8c;border-color:rgba(159,180,196,.3)}
.tag.purple{background:var(--accent-soft);color:var(--accent2);border-color:rgba(180,156,201,.3)}
.tag.cyan{background:rgba(158,195,191,.16);color:#56807c;border-color:rgba(158,195,191,.3)}

.empty{text-align:center;padding:42px 18px;color:var(--muted);font-size:14px}
.empty svg{opacity:.45;margin-bottom:10px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:.3px;line-height:1.2;color:var(--text)}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}

.field{margin-bottom:15px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;font-size:16px;outline:none;transition:.16s;color:var(--text);
}
.field textarea{min-height:110px;resize:vertical;line-height:1.65;background:var(--surface2)}
.field input:focus,.field textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.mask{
  position:fixed;inset:0;background:rgba(85,80,74,.36);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:18px;
}
.mask.on{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border2);border-radius:22px;
  width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.modal-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-h b{font-size:17px;color:var(--text)}
.modal-h .x{margin-left:auto;color:var(--muted);padding:4px 8px;font-size:24px;line-height:1}
.modal-b{padding:20px 22px;overflow-y:auto}
.modal-f{padding:15px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.modal-f .btn{min-height:44px;padding:10px 22px}

.pbar{height:8px;border-radius:8px;background:var(--surface3);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),#cbb6dd);transition:width .35s}
.pbar.g i{background:linear-gradient(90deg,var(--green),#a9c2a4)}

.li{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:none}
.li .body{flex:1;min-width:0}
.li .ops{display:flex;gap:3px;flex-shrink:0}
.iconbtn{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface3);color:var(--text)}
.iconbtn.del:hover{color:var(--red);background:var(--red-soft)}

.addline{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addline input{flex:1;min-width:160px;padding:10px 13px;background:var(--surface2);border:1px dashed var(--border2);border-radius:11px;font-size:16px;outline:none;color:var(--text)}
.addline input:focus{border-style:solid;border-color:var(--accent);background:#fff}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:13px;color:var(--text2);min-height:36px;display:inline-flex;align-items:center;transition:.16s}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:rgba(180,156,201,.35);color:var(--accent2);font-weight:600}

.clk{cursor:pointer;transition:.16s}
.clk:hover{border-color:var(--border2);background:var(--surface2)}

.backbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.backbar h2{margin:0;font-size:21px;font-weight:700;color:var(--text)}
.backbar .r{margin-left:auto;display:flex;gap:8px}

.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(12px);
  background:var(--text);color:#fff;border-radius:14px;font-size:14px;z-index:200;
  opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;padding:12px 22px;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 自定义下拉框 */
.dd{position:relative;min-width:120px}
.dd-btn{width:100%;display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;font-size:15px;color:var(--text);cursor:pointer;transition:.16s;text-align:left}
.dd-btn:hover{border-color:var(--border2);background:var(--surface3)}
.dd.on .dd-btn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.dd-btn .dd-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .dd-chev{transition:.2s;color:var(--muted);flex-shrink:0}
.dd.on .dd-chev{transform:rotate(180deg)}
.dd-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:13px;box-shadow:var(--shadow-lg);z-index:60;max-height:264px;overflow:auto;padding:6px;display:none}
.dd-opt{padding:9px 12px;border-radius:9px;font-size:14.5px;color:var(--text2);cursor:pointer;transition:.12s}
.dd-opt:hover{background:var(--surface2);color:var(--text)}
.dd-opt.on{color:var(--accent2);font-weight:600;background:var(--accent-soft)}
.dd-group{font-size:10.5px;color:var(--muted);letter-spacing:1px;padding:9px 12px 4px;font-weight:700}
.dd-group:first-child{padding-top:4px}

/* 人生目标 */
.goal-card{padding:20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);margin-bottom:16px;box-shadow:var(--shadow)}
.goal-head{display:flex;align-items:flex-start;gap:14px}
.goal-ring{flex-shrink:0}
.goal-ring text{fill:var(--text)}
.goal-title{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--text)}
.goal-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.goal-note{font-size:13px;color:var(--text2);line-height:1.6}
.goal-expand{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer}
.goal-expand:hover{color:var(--text)}
.goal-card.achieved{border-color:rgba(216,180,131,.55);background:linear-gradient(135deg,rgba(216,180,131,.16),rgba(216,180,131,.04));box-shadow:0 6px 24px rgba(216,180,131,.14)}
.achieved-hero{background:linear-gradient(135deg,#e9c884,#d8b483) !important;color:#5a4516;border:none !important;box-shadow:0 8px 28px rgba(216,180,131,.32);position:relative;overflow:hidden}
.achieved-hero::after{content:'';position:absolute;right:-22px;top:-22px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.22)}
.goal-stats{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.goal-stats .gstat,.goal-stats .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.achieved-hero .gstat-ico{color:#fff;opacity:.95;margin-bottom:6px}
.achieved-hero .gstat-num{font-size:42px;font-weight:850;line-height:1;color:#fff;letter-spacing:-1px}
.achieved-hero .gstat-num span{font-size:15px;font-weight:700;margin-left:3px;opacity:.85}
.achieved-hero .gstat-lab{font-size:14px;font-weight:700;margin-top:5px;color:#5a4516}
.achieved-hero .gstat-sub{display:flex;align-items:center;gap:4px;font-size:11.5px;margin-top:6px;color:#6b5526;opacity:.92}
.goal-medal{width:62px;height:62px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 32%,#ffe9b0,#e0bb72);box-shadow:0 4px 16px rgba(216,180,131,.5),inset 0 2px 4px rgba(255,255,255,.6);color:#a8824e;position:relative}
.goal-medal-spark{position:absolute;right:-4px;top:-5px;color:#e9c884;filter:drop-shadow(0 1px 1px rgba(168,130,78,.4));animation:sparkpop 2.6s ease-in-out infinite}
@keyframes sparkpop{0%,100%{transform:scale(1) rotate(0);opacity:.85}50%{transform:scale(1.25) rotate(8deg);opacity:1}}
@media(max-width:768px){.goal-stats{grid-template-columns:1fr 1fr}.goal-stats .achieved-hero{grid-column:1 / -1}}
.milestone-list{padding:14px 0 4px}
.milestone{border-radius:13px;border:1px solid var(--border);margin-bottom:10px;background:var(--surface2);transition:.16s;overflow:hidden}
.milestone:hover{border-color:var(--border2)}
.milestone.done{background:linear-gradient(135deg,rgba(216,180,131,.16),rgba(216,180,131,.05));border-color:rgba(216,180,131,.4);box-shadow:0 2px 14px rgba(216,180,131,.12)}
/* 标题行整体垂直居中 */
.milestone-row{display:flex;align-items:center;gap:12px;padding:12px}
.milestone-num{width:28px;height:28px;border-radius:50%;background:var(--surface3);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.milestone.done .milestone-num{background:linear-gradient(140deg,#d8b483,#cba56a);color:#fff}
.milestone-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.milestone-title{font-size:14.5px;font-weight:600;color:var(--text);line-height:1.4}
.milestone.done .milestone-title{color:#a8824e}
.milestone-time{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:3px}
.milestone.done .milestone-time{color:#a8824e}
.ms-mini{flex-shrink:0;display:flex;align-items:center}
.ms-mini text{font-size:13px}
.milestone-actions{flex-shrink:0;display:flex;gap:4px;align-items:center}
.btn-achieve{padding:6px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent2);border:1px solid rgba(180,156,201,.3);font-size:12px;font-weight:600;transition:.16s;white-space:nowrap}
.btn-achieve:hover{background:rgba(180,156,201,.26)}
.btn-achieve.completed{background:rgba(216,180,131,.18);color:#a8824e;border-color:rgba(216,180,131,.4);cursor:default}
.btn-achieve.view{background:var(--surface);color:var(--text2);border-color:var(--border2)}
.btn-achieve.view:hover{background:var(--surface3);color:var(--text)}
.goal-completed-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--green-soft);color:#5f7d5a;border:1px solid rgba(148,176,142,.3);font-size:12px;font-weight:700}

/* 第三层：里程表 */
.sub-list{padding:2px 12px 12px 52px;border-top:1px dashed var(--border);margin-top:2px}
.sub-empty{font-size:12.5px;color:var(--muted);padding:10px 0 6px}
.submile{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--border);margin-top:8px;transition:.14s}
.submile:hover{border-color:var(--border2)}
.submile.done{background:rgba(148,176,142,.09);border-color:rgba(148,176,142,.3)}
.sub-check{width:20px;height:20px;border-radius:6px;border:1.8px solid var(--border2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;transition:.14s}
.sub-check:hover{border-color:var(--accent)}
.sub-check.on{background:var(--green);border-color:var(--green)}
.sub-idx{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.sub-title{flex:1;min-width:0;font-size:13.5px;color:var(--text);line-height:1.45}
.submile.done .sub-title{color:var(--text2);text-decoration:line-through;text-decoration-color:rgba(148,176,142,.6)}
.sub-at{font-size:11px;color:#5f7d5a;flex-shrink:0}
.sub-ops{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:.14s}
.submile:hover .sub-ops{opacity:1}
.sub-ops .iconbtn{width:26px;height:26px}
.sub-add{margin-top:9px}

/* 目标内联新建 */
.goal-add-card{background:linear-gradient(135deg,var(--accent-soft),rgba(180,156,201,.05));border:1px solid rgba(180,156,201,.28);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px}
.ga-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.goal-add-card input{flex:1;min-width:200px;padding:12px 15px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:16px;outline:none;color:var(--text)}
.goal-add-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.goal-add-card .btn.primary{flex-shrink:0;min-height:46px}
.ga-row2{margin-top:11px}
.ga-cats{display:flex;gap:6px;flex-wrap:wrap}
.ga-cats .chip{background:var(--surface)}
.ga-cats .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ga-note{margin-top:10px;width:100%;font-size:14.5px !important;padding:10px 15px !important}

/* 灵感库 */
.idea-add-card{background:linear-gradient(135deg,var(--accent-soft),rgba(180,156,201,.05));border:1px solid rgba(180,156,201,.28);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.idea-add-card .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.idea-add-card input{flex:1;min-width:200px;padding:12px 15px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:16px;outline:none;color:var(--text)}
.idea-add-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.idea-add-card .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.idea-add-card .filters .chip{background:var(--surface)}
.idea-add-card .filters .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.idea-timeline{position:relative;padding-left:26px}
.idea-timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--surface3)}
.idea-group{position:relative;margin-bottom:28px}
.idea-dot{position:absolute;left:-23px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 0 0 3px var(--bg)}
.idea-month{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:12px;letter-spacing:.5px}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.idea-note{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;position:relative;transition:.2s;box-shadow:var(--shadow);border-top:3px solid var(--accent)}
.idea-note:nth-child(4n+2){border-top-color:var(--cyan)}
.idea-note:nth-child(4n+3){border-top-color:var(--orange)}
.idea-note:nth-child(4n+4){border-top-color:var(--green)}
.idea-note.done{opacity:.6;background:var(--surface2);border-color:var(--border)}
.idea-note:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(120,105,90,.12);border-color:var(--border2)}
.idea-note-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.idea-note-tag{margin-right:auto}
.idea-note-text{font-size:14.2px;line-height:1.7;word-break:break-word;margin:0 0 14px;color:var(--text)}
.idea-note.done .idea-note-text{text-decoration:line-through;color:var(--text2)}
.idea-note-foot{display:flex;align-items:center;gap:8px}
.idea-actions{position:static;opacity:1;display:flex;gap:4px}
.idea-note.sel{grid-column:1 / -1;padding:22px 24px;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(180,156,201,.4),0 14px 34px rgba(120,105,90,.16);transform:none}
.idea-note.sel .idea-note-text{font-size:16.5px;line-height:1.85}
@media(max-width:768px){.idea-actions{opacity:1}}
/* 灵感库：小红书式多列瀑布流 */
.idea-in{width:100%;resize:vertical;min-height:46px;font-size:14.5px !important;line-height:1.5;padding:12px 14px !important;font-family:inherit;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);transition:.16s}
.idea-in:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.idea-masonry{columns:3 240px;column-gap:14px;margin-top:4px}
.idea-card{break-inside:avoid;display:inline-block;width:100%;margin:0 0 14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 15px 13px;box-shadow:var(--shadow);border-top:3px solid var(--accent);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative}
.idea-card:nth-child(5n+2){border-top-color:var(--cyan)}
.idea-card:nth-child(5n+3){border-top-color:var(--orange)}
.idea-card:nth-child(5n+4){border-top-color:var(--green)}
.idea-card:nth-child(5n+5){border-top-color:#b09cc9}
.idea-card:hover{transform:translateY(-3px) scale(1.012);box-shadow:0 12px 30px rgba(120,105,90,.14);border-color:var(--border2)}
.idea-card.sel{transform:scale(1.035);z-index:2;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(180,156,201,.5),0 16px 36px rgba(120,105,90,.18)}
.idea-card.done{opacity:.62;background:var(--surface2)}
.idea-card.done .idea-card-text{text-decoration:line-through;color:var(--text2)}
.idea-card-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.idea-card-text{font-size:14.2px;line-height:1.7;word-break:break-word;margin:0 0 12px;color:var(--text);white-space:pre-wrap}
.idea-card-foot{display:flex;align-items:center;gap:8px}
@media(max-width:768px){.idea-masonry{columns:2 150px;column-gap:10px}.idea-card:hover{transform:translateY(-2px)}.idea-card.sel{transform:scale(1.02)}}
.btn-done{padding:5px 11px;border-radius:9px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--text2);background:var(--surface3);transition:.16s}
.btn-done:hover{border-color:var(--green);color:#5f7d5a}
.btn-done.on{background:var(--green-soft);border-color:rgba(148,176,142,.35);color:#5f7d5a}

/* 学习记录 */
.study-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.study-item-title{font-size:16px;font-weight:700;flex:1;min-width:0;color:var(--text)}
.study-item-date{font-size:12px;color:var(--muted);flex-shrink:0}
.study-item-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.study-item-body{font-size:14.3px;line-height:1.75;color:var(--text2);white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:12px;padding:14px 16px}

/* 项目三栏：横向滑动 + 悬停变宽 */
.project-dashboard{display:flex;gap:14px;align-items:stretch;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.project-col{flex:1 1 0;min-width:248px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-height:260px;transition:flex .35s cubic-bezier(.4,0,.2,1),box-shadow .2s,border-color .2s}
.project-col:hover{flex:1.9 1 0;border-color:var(--border2);box-shadow:0 0 0 2px var(--accent-soft)}
.project-col-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text2);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.project-col-h:hover{color:var(--text)}
.project-col-h .ex{font-size:11px;margin-left:8px;color:var(--muted);opacity:0;transition:.15s}
.project-col-h:hover .ex{opacity:.7}
.project-col:hover .ex{opacity:1;color:var(--accent2)}
.project-col-h .n{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:10px}

.project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 15px 13px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.project-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#cbb6dd)}
.project-card:hover{transform:translateY(-4px) scale(1.015);border-color:var(--border2);box-shadow:0 14px 32px rgba(120,105,90,.16)}
.project-card:active{transform:translateY(-1px) scale(.995)}
.project-card .tag{position:absolute;top:12px;right:12px}
.project-card .name{font-size:15px;font-weight:700;margin:4px 56px 6px 0;line-height:1.35;color:var(--text)}
.project-card .desc{font-size:12.5px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.project-card .meta{display:flex;gap:12px;font-size:11.8px;color:var(--muted);flex-wrap:wrap}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

/* 项目数据分析 */
.proj-an-grid{display:grid;grid-template-columns:1.1fr 1.4fr 1.2fr;gap:18px}
.pa-block{background:var(--surface2);border-radius:14px;padding:14px 15px}
.pa-h{font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:11px}
.pa-donut{display:flex;align-items:center;gap:14px}
.pa-legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text2)}
.dlegend{display:flex;align-items:center;gap:7px}
.dlegend .dl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dlegend b{margin-left:auto;font-weight:700;color:var(--text)}
.pbar-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12px}
.pbar-name{flex:0 0 84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.pbar-track{flex:1;height:8px;border-radius:6px;background:var(--surface3);overflow:hidden}
.pbar-track i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .35s}
.pbar-pct{flex:0 0 34px;text-align:right;font-weight:700;color:var(--text2)}
.mbars{display:flex;align-items:flex-end;gap:10px;height:96px;padding-top:6px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.mbar-f{width:60%;max-width:22px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--accent),#cbb6dd);min-height:4px;transition:height .35s}
.mbar-l{font-size:10.5px;color:var(--muted)}
@media(max-width:768px){.proj-an-grid{grid-template-columns:1fr}}

.task-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
.task-row:first-child{border-top:none}
.task-check{width:20px;height:20px;border-radius:7px;border:2px solid var(--border2);flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s}
.task-check:hover{border-color:var(--accent)}
.task-check.done{background:var(--accent);border-color:var(--accent)}
.task-check.done svg{display:block}
.task-title{flex:1;font-size:14px;line-height:1.5;color:var(--text)}
.task-title.done{text-decoration:line-through;color:var(--muted)}
.task-pri{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px}
.task-pri.P0{background:var(--red-soft);color:var(--red)}
.task-pri.P1{background:rgba(216,180,131,.16);color:#a8824e}
.task-pri.P2{background:var(--surface3);color:var(--muted)}

/* 收入 */
.inc-row{display:grid;grid-template-columns:96px 1fr 120px 34px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--border);font-size:14px}
.inc-row:first-of-type{border-top:none}
.inc-amt{color:#5f7d5a;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.inc-date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px}
.bar-row .nm{width:88px;flex-shrink:0;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{flex:1;height:9px;background:var(--surface3);border-radius:6px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar-row .vl{width:92px;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums;flex-shrink:0}

/* 每日生活 - 二级导航 */
.nav-sub{padding-left:38px;font-size:13.5px;color:var(--text2)}
.nav-sub::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:-7px;flex-shrink:0}

/* 子模块切换条 */
.subtabs{display:flex;gap:6px;margin-bottom:4px}
.subtab{padding:8px 16px;border-radius:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:14px;font-weight:600;min-height:40px;transition:.16s}
.subtab.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ===== 计划与复盘 ===== */
.pr-layout{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start;margin-top:14px}
.pr-col{min-width:0}
.pr-add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pr-add input{flex:1;min-width:140px;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;font-size:15px;outline:none;color:var(--text)}
.pr-add input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.plan-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin:-6px 0 12px 2px}
.plan-hint svg{flex-shrink:0}

/* ---------- 番茄钟 ---------- */
.pomo-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-top:14px}
.pomo-hero{display:flex;flex-direction:column;align-items:stretch;padding:14px 16px 16px;margin-top:14px}
.pomo-hero .card-h{margin-bottom:6px}
.pomo-hero-body{display:flex;align-items:center;gap:16px;margin-top:6px;justify-content:flex-start}
.pomo-side{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0;max-width:520px}
.pomo-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;align-items:start}
.pomo-lr{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:18px;margin-top:18px;align-items:start}
.pomo-timer{display:flex;flex-direction:column;align-items:stretch;padding:14px 16px 16px}
.pomo-timer .card-h{margin-bottom:6px}
.pomo-records .pomo-list{max-height:none}
.pomo-analysis .pomo-insight{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--surface3);font-size:13px;color:var(--text2)}
.pomo-analysis .pomo-insight svg{color:var(--accent);flex-shrink:0}
.pomo-analysis .pomo-insight b{color:var(--text)}
.pomo-stage{display:flex;flex-direction:column;align-items:center;padding:4px 0;flex-shrink:0}
.pomo-ring-wrap{position:relative;width:190px;height:190px;margin-bottom:0}
.pomo-ring-wrap svg{display:block;transform:rotate(-90deg)}
.pomo-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pomo-time{font-size:50px;font-weight:800;letter-spacing:1px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1}
.pomo-state{font-size:12.5px;color:var(--muted);letter-spacing:.5px}
.pomo-linked{font-size:12.5px;color:var(--accent2);font-weight:650;max-width:170px;text-align:center;line-height:1.45;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pomo-hand{transform-origin:60px 60px;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.pomo-mins{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 2px}
.pomo-min{padding:8px 15px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:13.5px;color:var(--text2);transition:.15s;min-height:38px}
.pomo-min:hover{border-color:var(--border2);color:var(--text)}
.pomo-min.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.pomo-min:disabled{opacity:.4;cursor:not-allowed}
.pomo-ctrl{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.pomo-big{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 30px;border-radius:999px;font-size:15.5px;font-weight:700;
  background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(180,156,201,.4);transition:.16s;min-height:48px}
.pomo-big:hover{background:var(--accent2);transform:translateY(-1px)}
.pomo-big.ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border);box-shadow:none}
.pomo-big.ghost:hover{background:var(--surface3);color:var(--text);transform:none}
.pomo-link-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;width:100%;justify-content:flex-start}
.pomo-hint-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.pomo-hint-row svg{color:var(--accent);flex-shrink:0}
.pomo-link-row .lb{font-size:13px;color:var(--text2);flex-shrink:0;width:100%}
.pomo-link-row .dd{flex:1;min-width:180px}
.plk-list{display:flex;flex-wrap:wrap;gap:7px;width:100%}
.plk-empty{font-size:12.5px;color:var(--muted);font-style:italic}
.plk{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:20px;background:var(--accent-soft);border:1px solid rgba(180,156,201,.32);font-size:12.5px;color:var(--accent2);font-weight:600}
.plk i{font-style:normal;font-weight:700;color:var(--text2);font-size:11px;padding:1px 6px;border-radius:8px;background:var(--surface2)}
.plk b{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;cursor:pointer;color:var(--accent2);font-weight:700;font-size:14px;line-height:1;transition:.14s}
.plk b:hover{background:var(--red);color:#fff}
.plk-add{display:flex;gap:8px;align-items:center;width:100%}
.plk-add .dd{flex:1;min-width:0}
.pomo-sound{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);
  border-radius:999px;padding:8px 14px;transition:.15s;min-height:38px}
.pomo-sound:hover{border-color:var(--border2)}
.pomo-sound.off{color:var(--muted)}
.pomo-sound svg{flex-shrink:0}

.pomo-list .prow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.pomo-list .prow .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.pomo-list .prow .tt{flex:1;min-width:0;font-size:13.5px;color:var(--text);word-break:break-word}
.pomo-list .prow .tt i{font-style:normal;display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.pomo-list .prow .mn{font-size:12px;font-weight:700;color:var(--accent2);flex-shrink:0}
.pomo-list .prow .gx{color:var(--muted);cursor:pointer;flex-shrink:0;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.pomo-list .prow .gx:hover{color:var(--red);background:var(--red-soft)}
.pomo-day{font-size:12.5px;color:var(--muted);margin:14px 0 7px;display:flex;align-items:center;gap:8px}
.pomo-day b{color:var(--text2);font-weight:700}
.pomo-day .dots{margin-left:auto;display:flex;gap:3px;align-items:center;color:var(--red)}

.pomo-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pomo-bar .bn{font-size:13px;color:var(--text);width:132px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pomo-bar .bt{flex:1;height:9px;background:var(--surface3);border-radius:999px;overflow:hidden;min-width:40px}
.pomo-bar .bf{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#cbb6dd)}
.pomo-bar .bv{font-size:12px;color:var(--text2);font-weight:650;flex-shrink:0;width:52px;text-align:right}

/* 迷你悬浮计时条 */
.pomo-mini{position:fixed;right:22px;bottom:22px;z-index:70;display:none;align-items:center;gap:11px;padding:11px 16px 11px 13px;
  background:var(--surface);border:1px solid var(--border2);border-radius:999px;box-shadow:var(--shadow-lg);cursor:pointer;transition:.18s}
.pomo-mini:hover{transform:translateY(-2px)}
.pomo-mini.on{display:flex}
.pomo-mini .mtxt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.pomo-mini .mtime{font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.4px}
.pomo-mini .mlab{font-size:11.5px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pomo-mini .mico{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pomo-mini.paused .mico{background:var(--surface3);color:var(--muted)}

/* 每日生活子导航（移动端） */
.daily-sub{display:none;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.daily-sub button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--border);font-size:13.5px;color:var(--text2);min-height:40px;white-space:nowrap}
.daily-sub button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}

.plan-zone{background:var(--surface2);border:1px dashed var(--border2);border-radius:16px;padding:13px;margin-bottom:14px;transition:.16s;min-height:84px}
.plan-zone.dragover{border-color:var(--accent);background:var(--accent-soft)}
.plan-zone-h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:10px;color:var(--text)}
.plan-zone-h .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.plan-zone-h .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.plan-zone.must{background:linear-gradient(135deg,rgba(207,155,148,.16),rgba(207,155,148,.05));border:1.5px solid rgba(199,120,110,.45);box-shadow:0 6px 20px rgba(199,120,110,.12);position:relative;overflow:hidden}
.plan-zone.must::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--red),#d98c82)}
.plan-zone.must .plan-zone-h{color:var(--red);font-size:14.5px}
.must-flag{flex-shrink:0;color:var(--red);display:inline-flex;animation:flagpulse 2.4s ease-in-out infinite}
@keyframes flagpulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}
.mini-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface3);color:var(--text2);cursor:pointer;transition:.15s;white-space:nowrap}
.mini-btn:hover{border-color:var(--border2);background:#fff}
.mini-btn.must-up{color:var(--red);border-color:rgba(199,120,110,.35);background:rgba(207,155,148,.1)}
.mini-btn.must-up:hover{background:var(--red);color:#fff;border-color:var(--red)}

.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.move-list{display:flex;flex-direction:column;gap:8px}
.move-opt{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:13px;text-align:left;transition:.15s;min-height:48px}
.move-opt:hover{border-color:var(--accent);background:#fff}
.move-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.move-opt .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.move-opt .mv-n{font-size:14.5px;font-weight:650;color:var(--text)}
.move-opt .mv-d{margin-left:auto;font-size:12px;color:var(--muted)}
.plan{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-bottom:9px;cursor:grab;transition:.15s;box-shadow:0 1px 4px rgba(120,105,90,.04)}
.plan:hover{border-color:var(--border2);box-shadow:0 3px 12px rgba(120,105,90,.08)}
.plan.done{opacity:.55}
.plan.done .plan-t{text-decoration:line-through}
.plan-check{width:20px;height:20px;border-radius:7px;border:2px solid var(--border2);flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.plan-check:hover{border-color:var(--accent)}
.plan-check.done{background:var(--green);border-color:var(--green)}
.plan-check.done svg{display:block}
.plan-t{flex:1;min-width:0;font-size:14px;line-height:1.5;color:var(--text);word-break:normal;overflow-wrap:break-word}
.plan-ops{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:.15s}
.plan:hover .plan-ops{opacity:1}
@media(max-width:768px){.plan-ops{opacity:1}}

.pr-hist{margin-top:6px}
.pr-hist-day{font-size:12.5px;color:var(--muted);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.pr-hist-day b{color:var(--text2);font-weight:700}
.pr-hist-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;color:var(--text2)}
.pr-hist-row svg{flex-shrink:0;color:var(--green)}
.pr-hist-row span{flex:1;min-width:0;word-break:break-word}
.pr-hist-row .hist-cat{font-style:normal;font-size:11px;flex-shrink:0;opacity:.8}

/* 复盘 */
.review-add{margin-bottom:14px}
.review-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.review-item:hover{border-color:var(--border2);background:var(--surface2)}
.review-item-h{display:flex;align-items:center;gap:10px}
.review-item-h .t{font-size:15px;font-weight:700;color:var(--text);flex:1;min-width:0}
.review-item-h .time{font-size:12px;color:var(--muted);flex-shrink:0}
.review-item-h .chev{color:var(--muted);transition:.2s;flex-shrink:0}
.review-item.open .chev{transform:rotate(90deg)}
.review-body{font-size:14px;line-height:1.75;color:var(--text2);white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:11px;padding:13px 15px;margin-top:12px;display:none}
.review-item.open .review-body{display:block}
.review-ops{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}

/* ===== 感恩日历 ===== */
.grat-layout{display:flex;flex-direction:row;gap:22px;align-items:flex-start;margin-top:14px}
.grat-editor{flex:1;min-width:0}
.grat-calendar-wrap{width:330px;flex-shrink:0;position:sticky;top:14px}
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head .mt{font-size:15px;font-weight:700;color:var(--text);margin:0 auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:11px;cursor:pointer;color:var(--text2);position:relative;transition:.12s}
.cal-day:hover{background:var(--surface2)}
.cal-day.today{background:var(--accent-soft);color:var(--accent2);font-weight:700}
.cal-day.sel{background:var(--accent);color:#fff;font-weight:700}
.cal-day.other{color:var(--muted);opacity:.4}
.cal-day.has::after{content:'';position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-day.sel.has::after{background:#fff}

.grat-editor{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grat-editor .ed-date{font-size:13px;color:var(--muted);margin-bottom:0}
.grat-bless{font-size:13.5px;line-height:1.85;color:var(--text2);background:linear-gradient(135deg,var(--accent-soft),rgba(180,156,201,.04));border:1px solid rgba(180,156,201,.25);border-radius:13px;padding:14px 16px;margin-bottom:18px}
.grat-bless b{color:var(--accent2)}
.grat-sec{margin-bottom:18px}
.grat-sec-h{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px}
.grat-sec-h .n{font-size:11.5px;color:var(--muted);font-weight:500}
.grat-sec-h .req{font-size:11.5px;color:var(--accent2);font-weight:600}
.grat-rows .gitem{display:flex;gap:8px;align-items:center;padding:8px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;margin-bottom:8px}
.grat-rows .gitem .gt{flex:1;font-size:13.5px;line-height:1.5;color:var(--text);word-break:break-word}
.grat-rows .gitem .gx{color:var(--muted);cursor:pointer;flex-shrink:0;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.grat-rows .gitem .gx:hover{color:var(--red);background:var(--red-soft)}
.grat-add{display:flex;gap:8px;margin-top:4px}
.grat-add input{flex:1;min-width:0;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;color:var(--text)}
.grat-add input:focus{border-color:var(--accent);background:#fff}
.grat-foot{display:flex;gap:8px;margin-top:6px;align-items:center}
.mood-input{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.mood-input label{font-size:13px;color:var(--text2);font-weight:600}
.mood-input input{flex:1;padding:9px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;font-size:15px;outline:none;color:var(--text)}
.mood-input input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.mood-pick{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.mood-pick label{font-size:13px;color:var(--text2);font-weight:600}
.mood-faces{display:flex;flex-wrap:wrap;gap:9px}
.mface{width:46px;height:46px;border-radius:14px;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;padding:0}
.mface:hover{transform:translateY(-2px);border-color:var(--mc)}
.mface.on{background:color-mix(in srgb, var(--mc) 16%, var(--surface));border-color:var(--mc);box-shadow:0 4px 12px color-mix(in srgb, var(--mc) 30%, transparent)}
.mface svg{display:block}
.cal-mood{position:absolute;right:3px;bottom:2px;line-height:0;pointer-events:none}
.cal-day{position:relative}
.grat-mood-an{margin-top:14px}
.mood-dist{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.md-row{display:flex;align-items:center;gap:9px}
.md-face{width:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:0}
.md-k{font-size:13px;color:var(--text);width:34px;flex-shrink:0}
.md-bar{flex:1;height:8px;background:var(--surface3);border-radius:999px;overflow:hidden;min-width:30px}
.md-fill{height:100%;border-radius:999px;display:block}
.md-n{font-size:12.5px;font-weight:700;color:var(--text2);width:22px;text-align:right;flex-shrink:0}
.mood-verdict{display:flex;align-items:center;gap:7px;margin-top:13px;padding-top:12px;border-top:1px solid var(--surface3);font-size:13px;color:var(--text2)}
.mood-verdict svg{color:var(--accent);flex-shrink:0}
.mood-verdict b{color:var(--text)}
.grat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding-bottom:13px;border-bottom:1px solid var(--border)}
.grat-head .gt-title{font-size:16px;font-weight:800;color:var(--text)}
.done-pill{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent2);font-size:11.5px;font-weight:700}
.grat-reward{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:15px;margin-bottom:16px;background:linear-gradient(135deg,#fde9d2,#f7dbe8 55%,#e8e0f4);border:1px solid rgba(207,155,148,.42);box-shadow:0 6px 20px rgba(207,155,148,.22);animation:rewardPop .5s ease, rewardGlow 2.6s ease-in-out infinite}
.grat-reward .gr-ico{width:46px;height:46px;border-radius:14px;background:#fff;color:var(--accent2);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.grat-reward .gr-txt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.grat-reward .gr-txt b{font-size:14.5px;color:#7a5a8c}
.grat-reward .gr-txt span{font-size:12.5px;color:#8a6f7a;line-height:1.5}
.grat-reward .gr-txt .hr{display:inline-flex;vertical-align:-2px;margin:0 1px;color:var(--red)}
.grat-reward .gr-pill{margin-left:auto;flex-shrink:0;padding:6px 13px;border-radius:999px;background:#fff;color:#c87f76;font-size:13px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.08)}
@keyframes rewardPop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rewardGlow{0%,100%{box-shadow:0 6px 20px rgba(207,155,148,.22)}50%{box-shadow:0 6px 30px rgba(180,156,201,.42)}}
.cal-day.done{background:var(--accent-soft);color:var(--accent2);font-weight:700}
.cal-day.done::after{content:'';position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cal-day.sel.done::after{background:#fff}

/* 移动导航 */
.mnav{display:none}
@media(max-width:1024px){.plan-grid{grid-template-columns:1fr}}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:768px){
  .sidebar{display:none}
  .content{padding:14px 14px 100px}
  .topbar{padding:12px 14px;gap:8px}
  .topbar h1{font-size:18px}
  .topbar .sub{display:none}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .card{padding:15px}
  .pr-layout,.grat-layout,.pomo-layout{grid-template-columns:1fr}
  .grat-layout{flex-direction:column}
  .grat-calendar-wrap{width:auto;position:static}
  .pomo-grid{grid-template-columns:1fr}
  .pomo-lr{grid-template-columns:1fr}
  .pomo-hero{padding:20px 14px 18px}
  .daily-sub{display:flex}
  .pomo-ring-wrap{width:200px;height:200px}
  .pomo-hero-body{flex-direction:column;gap:14px}
  .pomo-time{font-size:44px}
  .pomo-mini{right:14px;bottom:calc(76px + env(safe-area-inset-bottom));padding:9px 14px 9px 11px}
  .lib-tools{flex-direction:column;align-items:stretch}
  .lib-search{min-width:0}
  .lib-item{padding:11px 12px;gap:10px}
  .lib-ops .iconbtn{width:40px;height:40px}
  .lib-layout{flex-direction:column}
  .lib-side{width:auto;position:static;max-height:none}
  .lib-node-row{padding:11px 10px;font-size:15px}
  .lib-node-ops{display:flex;position:static;justify-content:flex-end;margin:-4px 4px 4px 0;border:none;background:none;padding:0}
  .lib-node-ops .iconbtn.sm{width:32px;height:32px}
  .pomo-mini .mlab{display:none}
  .pomo-link-row .dd{min-width:0;width:100%;flex:1 1 100%}
  .cal{grid-column:1/-1}
  .project-col{min-width:84vw}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,253,250,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;color:var(--muted);font-size:10.5px;border-radius:10px;min-height:54px}
  .mnav button.on{color:var(--accent2)}
  .mnav .dot{position:absolute;top:5px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--red)}
  .mnav button{position:relative}
  .dsk{display:none}
  .top-actions .btn{padding:8px 11px}
  .modal{max-height:92vh;border-radius:18px 18px 14px 14px}
  .modal-f{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .toast{bottom:108px}
  .inc-row{grid-template-columns:1fr 96px 34px;gap:8px}
  .inc-row .inc-date{grid-column:1/-1;margin-bottom:-4px}
  .stat .v{font-size:21px}
  .g4.stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .idea-grid{grid-template-columns:1fr}
  .goal-head{flex-direction:column;gap:10px}
  .idea-actions{opacity:1}
}
@media(max-width:380px){.g4.stats{grid-template-columns:repeat(2,1fr)}}
.hide{display:none !important}

/* 云端同步 */
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.fld>input{width:100%}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.sync-dot.on{background:var(--green)}

/* 备份提示 */
.notice{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid rgba(180,156,201,.3);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;color:var(--text2)}
.notice .x{margin-left:auto;color:var(--muted);font-size:20px;cursor:pointer}
/* ---- 资料库 ---- */
.lib-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.lib-search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--surface3);border-radius:12px;padding:9px 13px;flex:1;min-width:180px}
.lib-search input{border:none;background:none;outline:none;flex:1;font-size:15px;color:var(--text)}
.lib-search svg{color:var(--muted);flex-shrink:0}
.lib-cats{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:20px;border:1px solid var(--surface3);background:var(--surface);color:var(--text2);font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lib-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.lib-item{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--surface3);border-radius:15px;background:var(--surface)}
.lib-ico{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lib-main{flex:1;min-width:0}
.lib-name{font-weight:600;font-size:14.6px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-link{color:var(--accent2);text-decoration:none}
.lib-link:hover{text-decoration:underline}
.lib-meta{font-size:12.6px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-badges{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.lib-badge{font-size:11.6px;padding:2px 9px;border-radius:11px;background:var(--surface3);color:var(--text2)}
.lib-badge.project{background:rgba(149,176,142,.20);color:#5f7d5a}
.lib-badge.study{background:rgba(118,162,204,.20);color:#3f6ea5}
.lib-badge.goal{background:rgba(184,150,202,.20);color:#7a5a90}
.lib-badge.cat{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent2)}
.lib-badge.muted{background:transparent;border:1px dashed var(--surface3);color:var(--muted)}
.lib-ops{display:flex;gap:5px;flex-shrink:0}

/* ---- 知识框架树 ---- */
.lib-layout{display:flex;gap:16px;align-items:flex-start}
.lib-side{width:288px;flex-shrink:0;position:sticky;top:14px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.lib-main-col{flex:1;min-width:0}
.lib-tree{margin-top:12px;overflow-y:auto;flex:1}
.lib-tree-list{margin-left:14px;padding-left:10px;border-left:1px dashed var(--surface3)}
.lib-node{position:relative}
.lib-node-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:.15s;font-size:14px;color:var(--text2)}
.lib-node-row:hover{background:var(--accent-soft);color:var(--text)}
.lib-node.on>.lib-node-row{background:var(--accent);color:#fff;font-weight:600}
.lib-node.on>.lib-node-row .ln-cnt{background:rgba(255,255,255,.28);color:#fff}
.ln-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln-cnt{font-size:11.5px;background:var(--surface3);color:var(--muted);border-radius:9px;padding:1px 7px;flex-shrink:0}
.lib-node-ops{position:absolute;right:6px;top:4px;display:none;gap:2px;background:var(--surface);border:1px solid var(--surface3);border-radius:9px;padding:2px}
.lib-node:hover>.lib-node-ops{display:flex}
.lib-node-ops .iconbtn.sm{width:24px;height:24px;padding:0}
.lib-tree-empty{font-size:13px;color:var(--muted);line-height:1.7;padding:14px 10px}
.lib-tree-tip{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid var(--surface3)}
.lib-tree-tip svg{flex-shrink:0;margin-top:2px}

.lib-pv-imgwrap{display:flex;justify-content:center;background:var(--surface3);border-radius:14px;padding:10px}
.lib-pv-img{max-width:100%;max-height:72vh;border-radius:8px}
.lib-pv-frame{width:100%;height:74vh;border:0;border-radius:14px;background:#fff}
.lib-pv-text{white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.7;color:var(--text2);max-height:74vh;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:0}
.lib-pv-link{display:flex;flex-direction:column;gap:10px}
.lib-pv-tip{font-size:12.5px;color:var(--muted);text-align:center}
.lib-pv-none{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 10px;color:var(--muted)}
.lib-pv-none p{margin:0;font-size:15px;color:var(--text2)}

/* 默认知识框架（首次使用 / 框架为空时自动铺一套，之后可随意增删改） */
function defaultFrameworks(){
  const F = (name, parent) => ({ id:uid(), name, parent:parent||'' });
  const out = [];
  const push = (name, kids) => {
    const p = F(name); out.push(p);
    (kids||[]).forEach(k => out.push(F(k, p.id)));
    return p.id;
  };
  push('学科知识', ['数学','语文','英语','其他学科']);
  push('技能方法', ['学习方法','时间管理','软件工具','写作表达']);
  push('阅读与笔记', ['读书笔记','金句摘录','书单']);
  push('项目沉淀', ['需求与方案','设计素材','复盘总结']);
  push('灵感素材', ['选题灵感','案例参考','配图配色']);
  push('生活与成长', ['健康运动','理财记账','情绪心理']);
  return out;
}

function migrateData(d){
  // 旧版字段清理；新版本用 plans / reviews / gratitude(map)
  if(Array.isArray(d.projects)) d.projects.forEach(p => { if(Array.isArray(p.tasks)) p.tasks.forEach(t => delete t.due); });
  if(!d.plans) d.plans = [];
  if(!d.reviews) d.reviews = [];
  if(!d.pomos) d.pomos = [];
  if(Array.isArray(d.pomos)) d.pomos.forEach(p=>{
    if(!Array.isArray(p.links)){
      const t = p.linkType, id = p.linkId;
      p.links = (t && t!=='none' && id) ? [{ type:t, id }] : [];
    }
    delete p.linkType; delete p.linkId;
  });
  if(!d.library) d.library = [];
  if(!d.frameworks || !d.frameworks.length) d.frameworks = defaultFrameworks();
  if(!d.accounts) d.accounts = [];
  if(Array.isArray(d.accounts)) d.accounts.forEach(a=>{ if(!a.group) a.group='work'; });
  if(Array.isArray(d.studies)) d.studies.forEach(s=>{ if(!s.createdAt) s.createdAt=(s.created||TODAY)+' 09:00'; if(s.duration==null) s.duration=0; });
  if(Array.isArray(d.library)) d.library.forEach(x=>{ if(x.catId==null) x.catId=''; });
  // 里程碑三层：补齐 subs
  if(Array.isArray(d.goals)) d.goals.forEach(g=>{
    if(!Array.isArray(g.milestones)) g.milestones=[];
    g.milestones.forEach(m=>{ if(!Array.isArray(m.subs)) m.subs=[]; });
  });
  // 心情归一化到预置心情表
  if(d.gratitude && !Array.isArray(d.gratitude)) Object.keys(d.gratitude).forEach(k=>{
    const g = d.gratitude[k]; if(!g) return;
    if(g.mood && !MOODS.some(m=>m.k===g.mood)) g.mood = MOOD_ALIAS[g.mood] || '平静';
  });
  if(!d.gratitude || Array.isArray(d.gratitude)) d.gratitude = {};
  return d;
}

function load(){
  let fresh = false;
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ db = migrateData(JSON.parse(raw)); }
    else { db = seedDB(); fresh = true; }
  }catch(e){ db = seedDB(); fresh = true; }
  ['goals','ideas','studies','projects','incomes','plans','reviews','pomos','library','frameworks','accounts'].forEach(k => { if(!Array.isArray(db[k])) db[k] = []; });
  if(typeof db.gratitude !== 'object' || db.gratitude === null || Array.isArray(db.gratitude)) db.gratitude = {};
  db.goals.forEach(g=>{ if(!Array.isArray(g.milestones)) g.milestones=[]; g.milestones.forEach(m=>{ if(!Array.isArray(m.subs)) m.subs=[]; }); });
  db.projects.forEach(p=>{ ['tasks','assets','outputs'].forEach(k=>{ if(!Array.isArray(p[k])) p[k]=[]; }); });
  try{ const m = localStorage.getItem(META_KEY); if(m) meta = Object.assign(meta, JSON.parse(m)); }catch(e){}
  meta.sync = Object.assign({ token:'', gistId:'', auto:false, lastSync:0 }, meta.sync||{});
  if(fresh){ meta.lastBackupCount = totalCount(); saveMeta(); }
  save();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('存储空间不足，建议先导出备份再清理旧数据'); }
  schedulePush();
}
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(meta)); }catch(e){} }

/* ---------- 资料文件本地存储 (IndexedDB) ---------- */
let _filesDB = null;
function openFilesDB(){
  return new Promise((resolve, reject)=>{
    if(_filesDB){ resolve(_filesDB); return; }
    if(!window.indexedDB){ reject(new Error('no idb')); return; }
    const req = indexedDB.open('wb_momo_files', 1);
    req.onupgradeneeded = e=>{ const db=e.target.result; if(!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath:'id' }); };
    req.onsuccess = e=>{ _filesDB = e.target.result; resolve(_filesDB); };
    req.onerror = e=> reject(e.target.error);
  });
}
function putFile(id, blob){ return openFilesDB().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').put({ id, blob, ts:Date.now() }); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function getFile(id){ return openFilesDB().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('files','readonly'); const r=tx.objectStore('files').get(id); r.onsuccess=()=>res(r.result?r.result.blob:null); r.onerror=()=>rej(r.error); })); }
function delFile(id){ return openFilesDB().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function clearFiles(){ return openFilesDB().then(db=>new Promise((res)=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').clear(); tx.oncomplete=()=>res(); tx.onerror=()=>res(); })).catch(()=>{}); }
function totalCount(){
  return db.goals.length + db.goals.reduce((a,g)=>a+g.milestones.length,0)
    + db.ideas.length
    + db.studies.length
    + db.projects.length + db.projects.reduce((a,p)=>a+p.tasks.length+p.assets.length+p.outputs.length,0)
    + db.incomes.length
    + db.plans.length
    + db.reviews.length
    + db.pomos.length
    + db.library.length
    + Object.keys(db.gratitude).length;
}

const EXPANDED = new Set();
function goalRing(pct, size){
  const s = size||56, r = 20, c = 2*Math.PI*r, on = c*pct/100;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 48 48" style="flex-shrink:0">'
    + '<circle cx="24" cy="24" r="'+r+'" fill="none" stroke="var(--surface3)" stroke-width="5"/>'
    + '<circle cx="24" cy="24" r="'+r+'" fill="none" stroke="'+(pct>=100?'var(--green)':'var(--accent)')+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+on.toFixed(1)+' '+(c-on).toFixed(1)+'" transform="rotate(-90 24 24)"/>'
    + '<text x="24" y="28" text-anchor="middle" font-size="12" font-weight="800">'+pct+'%</text></svg>';
}
const GOAL_CATS = ['事业','健康','成长','财务','家庭','兴趣','其他'];
let goalNewCat = '事业';

/* 里程碑进度：有子里程表按子项算，没有就按自身 done */
function msProgress(m){
  const subs = m.subs || [];
  if(!subs.length) return { done:m.done?1:0, total:1, pct:m.done?100:0, leaf:true };
  const d = subs.filter(s=>s.done).length;
  return { done:d, total:subs.length, pct:Math.round(d/subs.length*100), leaf:false };
}
function msIsDone(m){ const p = msProgress(m); return p.total>0 && p.done===p.total; }
function goalProgress(g){
  let done=0, total=0;
  (g.milestones||[]).forEach(m=>{ const p = msProgress(m); done+=p.done; total+=p.total; });
  return { done, total, pct: total?Math.round(done/total*100):0 };
}

function viewGoals(){
  const gs = db.goals;
  const allM = gs.reduce((a,g)=>a+g.milestones.length,0);
  const doneM = gs.reduce((a,g)=>a+g.milestones.filter(msIsDone).length,0);
  const allSub = gs.reduce((a,g)=>a+g.milestones.reduce((b,m)=>b+(m.subs||[]).length,0),0);
  const doneGoals = gs.filter(g => g.milestones.length && g.milestones.every(msIsDone)).length;
  const doingGoals = gs.length - doneGoals;
  let h = '<div class="goal-stats">'
    + '<div class="gstat achieved-hero">'
    +   '<div class="gstat-ico">'+ico('trophy',26)+'</div>'
    +   '<div class="gstat-num">'+doneGoals+'<span>个</span></div>'
    +   '<div class="gstat-lab">已达成目标</div>'
    +   (doneGoals ? '<div class="gstat-sub">'+ico('spark',12)+'为你骄傲，继续冲</div>' : '<div class="gstat-sub">完成第一个目标就能点亮奖杯</div>')
    + '</div>'
    + stat('人生大目标', gs.length, '个')
    + stat('进行中目标', doingGoals, '个')
    + stat('里程碑', allM, '个')
    + '</div>';

  /* 内联新建（不再弹框） */
  h += '<div class="goal-add-card">'
    + '<div class="ga-row">'
    +   '<input id="gaTitle" placeholder="写下一个大目标，比如：三年内成为能养活自己的独立开发者" onkeydown="if(event.key===\'Enter\')addGoalInline()">'
    +   '<button class="btn primary" onclick="addGoalInline()">'+ico('plus',15)+'添加</button>'
    + '</div>'
    + '<div class="ga-row2">'
    +   '<div class="ga-cats">'+GOAL_CATS.map(c=>'<button class="chip'+(goalNewCat===c?' on':'')+'" onclick="setGoalNewCat(\''+c+'\')">'+c+'</button>').join('')+'</div>'
    + '</div>'
    + '<input id="gaNote" class="ga-note" placeholder="备注 / 为什么想做这件事（可留空）">'
    + '</div>';

  if(!gs.length) return h + emptyBox('还没有目标，在上面直接写下第一个想实现的事');

  gs.forEach(g => {
    const gp = goalProgress(g);
    const msTotal = g.milestones.length, msDone = g.milestones.filter(msIsDone).length;
    const allDone = msTotal && msDone === msTotal;
    const expanded = EXPANDED.has(g.id);
    const lastDone = allDone ? (g.milestones.map(m=>m.doneAt).filter(Boolean).sort().pop()||'') : '';
    h += '<div class="goal-card'+(allDone?' achieved':'')+'">'
      + '<div class="goal-head">'
      +   (allDone
            ? '<div class="goal-medal">'+ico('trophy',34)+'<span class="goal-medal-spark">'+ico('spark',13)+'</span></div>'
            : '<div class="goal-ring">'+goalRing(gp.pct)+'</div>')
      +   '<div style="flex:1;min-width:0">'
      +     '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +       '<div class="goal-title">'+esc(g.title)+'</div>'
      +       '<span class="tag purple">'+esc(g.cat||'未分类')+'</span>'
      +       (allDone ? '<span class="goal-completed-badge">'+ico('trophy',12,2.5)+'已达成'+(lastDone?' · '+fmtMD(lastDone):'')+'</span>' : '')
      +     '</div>'
      +     (g.note ? '<div class="goal-note">'+esc(g.note)+'</div>' : '')
      +     '<div style="font-size:12.5px;color:var(--muted);margin-top:8px">里程碑 '+msDone+'/'+msTotal+' · 小项 '+gp.done+'/'+gp.total+'</div>'
      +   '</div>'
      +   '<div class="ops">'
      +     '<button class="iconbtn" onclick="event.stopPropagation();editGoal(\''+g.id+'\')" title="编辑">'+ico('edit',15)+'</button>'
      +     '<button class="iconbtn del" onclick="event.stopPropagation();delGoal(\''+g.id+'\')" title="删除">'+ico('del',15)+'</button>'
      +   '</div>'
      + '</div>';
    h += '<div class="goal-expand" onclick="toggleGoal(\''+g.id+'\')">'
      + ico('chev',14)+(expanded?'收起':'展开')+'里程碑 ('+msTotal+')'
      + '</div>';
    if(expanded){
      h += '<div class="milestone-list">';
      if(!msTotal) h += '<div style="font-size:13px;color:var(--muted);padding:8px 0">还没有里程碑，把大目标拆成 3-5 个能验收的小目标。</div>';
      g.milestones.forEach((m,idx) => {
        const p = msProgress(m);
        const done = msIsDone(m);
        const mOpen = EXPANDED.has(m.id);
        const subs = m.subs || [];
        h += '<div class="milestone'+(done?' done':'')+'">'
          + '<div class="milestone-row">'
          +   '<div class="milestone-num">'+(done?ico('check',14,3):(idx+1))+'</div>'
          +   '<div class="milestone-body">'
          +     '<div class="milestone-title">'+esc(m.title)+'</div>'
          +     '<div class="milestone-time">'
          +       (subs.length ? ('里程表 '+p.done+'/'+p.total) : (done ? (ico('trophy',11,2)+' 完成于 '+fmtMD(m.doneAt)) : '暂无里程表小项'))
          +     '</div>'
          +   '</div>'
          +   (subs.length ? '<div class="ms-mini">'+goalRing(p.pct, 40)+'</div>' : '')
          +   '<div class="milestone-actions">'
          +     (subs.length
                  ? '<button class="btn-achieve view" onclick="toggleGoal(\''+m.id+'\')">'+(mOpen?'收起里程表':'里程表 '+p.done+'/'+p.total)+'</button>'
                  : '<button class="btn-achieve'+(m.done?' completed':'')+'" onclick="toggleMilestone(\''+g.id+'\',\''+m.id+'\')">'+(m.done?'已完成':'标记完成')+'</button>')
          +     '<button class="iconbtn" title="展开里程表" onclick="toggleGoal(\''+m.id+'\')">'+ico('chev',14)+'</button>'
          +     '<button class="iconbtn" title="编辑" onclick="editMilestone(\''+g.id+'\',\''+m.id+'\')">'+ico('edit',14)+'</button>'
          +     '<button class="iconbtn del" title="删除" onclick="delMilestone(\''+g.id+'\',\''+m.id+'\')">'+ico('del',14)+'</button>'
          +   '</div>'
          + '</div>';
        if(mOpen){
          h += '<div class="sub-list">';
          if(!subs.length) h += '<div class="sub-empty">还没有里程表小项，把这个里程碑再拆成几步可执行的动作。</div>';
          subs.forEach((s,si)=>{
            h += '<div class="submile'+(s.done?' done':'')+'">'
              + '<button class="sub-check'+(s.done?' on':'')+'" onclick="toggleSub(\''+g.id+'\',\''+m.id+'\',\''+s.id+'\')" title="'+(s.done?'取消完成':'标记完成')+'">'+(s.done?ico('check',12,3.2):'')+'</button>'
              + '<span class="sub-idx">'+(idx+1)+'.'+(si+1)+'</span>'
              + '<span class="sub-title">'+esc(s.title)+'</span>'
              + (s.done ? '<span class="sub-at">'+fmtMD(s.doneAt)+'</span>' : '')
              + '<span class="sub-ops">'
              +   '<button class="iconbtn" title="编辑" onclick="editSub(\''+g.id+'\',\''+m.id+'\',\''+s.id+'\')">'+ico('edit',13)+'</button>'
              +   '<button class="iconbtn del" title="删除" onclick="delSub(\''+g.id+'\',\''+m.id+'\',\''+s.id+'\')">'+ico('del',13)+'</button>'
              + '</span></div>';
          });
          h += '<div class="addline sub-add"><input placeholder="添加里程表小项，回车保存" onkeydown="if(event.key===\'Enter\')quickSub(\''+g.id+'\',\''+m.id+'\',this)">'
            + '<button class="btn sm" onclick="editSub(\''+g.id+'\',\''+m.id+'\')">添加</button></div>';
          h += '</div>';
        }
        h += '</div>';
      });
      h += '<div class="addline"><input placeholder="添加一个里程碑，回车保存" onkeydown="if(event.key===\'Enter\')quickMilestone(\''+g.id+'\',this)">'
        + '<button class="btn sm" onclick="editMilestone(\''+g.id+'\')">添加</button></div>';
      h += '</div>';
    }
    h += '</div>';
  });
  return h;
}
function toggleGoal(id){ if(EXPANDED.has(id)) EXPANDED.delete(id); else EXPANDED.add(id); render(); }
function setGoalNewCat(c){ goalNewCat = c; render(); }
function addGoalInline(){
  const t = $('gaTitle'), n = $('gaNote');
  const v = (t.value||'').trim();
  if(!v){ toast('先写下目标内容'); t.focus(); return; }
  db.goals.unshift({ id:uid(), title:v, cat:goalNewCat, note:(n.value||'').trim(), created:TODAY, milestones:[] });
  t.value=''; n.value='';
  save(); render(); toast('目标已创建');
}
function quickMilestone(gid, el){
  const v = el.value.trim(); if(!v) return;
  db.goals.find(x=>x.id===gid).milestones.push({ id:uid(), title:v, done:false, subs:[] });
  el.value=''; save(); render(); toast('里程碑已添加');
}
function toggleMilestone(gid,mid){
  const g = db.goals.find(x=>x.id===gid);
  const m = g.milestones.find(x=>x.id===mid);
  if((m.subs||[]).length){ toast('这个里程碑有里程表，勾完小项会自动完成'); return; }
  m.done = !m.done;
  m.doneAt = m.done ? TODAY : '';
  if(m.done){
    const allDone = g.milestones.length && g.milestones.every(msIsDone);
    toast(allDone ? '目标达成！' : '里程碑达成');
  }
  save(); render();
}
/* ---- 第三层：里程表小项 ---- */
function findSub(gid,mid){
  const g = db.goals.find(x=>x.id===gid); if(!g) return {};
  const m = g.milestones.find(x=>x.id===mid); if(!m) return { g };
  if(!Array.isArray(m.subs)) m.subs = [];
  return { g, m };
}
function syncMilestone(g,m){
  const subs = m.subs || [];
  if(!subs.length) return;
  const all = subs.every(s=>s.done);
  m.done = all;
  m.doneAt = all ? (subs.map(s=>s.doneAt).filter(Boolean).sort().pop()||TODAY) : '';
}
function toggleSub(gid,mid,sid){
  const { g, m } = findSub(gid,mid); if(!m) return;
  const s = m.subs.find(x=>x.id===sid); if(!s) return;
  s.done = !s.done; s.doneAt = s.done ? TODAY : '';
  const before = m.done;
  syncMilestone(g,m);
  if(!before && m.done){
    const allDone = g.milestones.every(msIsDone);
    toast(allDone ? '目标达成！' : '里程碑「'+m.title+'」达成');
  }
  save(); render();
}
function quickSub(gid,mid,el){
  const v = el.value.trim(); if(!v) return;
  const { g, m } = findSub(gid,mid); if(!m) return;
  m.subs.push({ id:uid(), title:v, done:false, doneAt:'' });
  syncMilestone(g,m);
  el.value=''; save(); render(); toast('里程表已添加');
}
function editSub(gid,mid,sid){
  const { g, m } = findSub(gid,mid); if(!m) return;
  const s = sid ? m.subs.find(x=>x.id===sid) : null;
  openForm(s?'编辑里程表小项':'添加里程表小项', [
    { k:'title', l:'小项内容', t:'text', req:true, ph:'例：打通第一个获客渠道' }
  ], s || {}, v => {
    if(s) s.title = v.title;
    else m.subs.push({ id:uid(), title:v.title, done:false, doneAt:'' });
    syncMilestone(g,m); save(); render(); toast('已保存');
  });
}
function delSub(gid,mid,sid){
  const { g, m } = findSub(gid,mid); if(!m) return;
  const s = m.subs.find(x=>x.id===sid); if(!s) return;
  confirmBox('删除里程表小项？', '「'+s.title+'」删除后不可恢复。', ()=>{
    m.subs = m.subs.filter(x=>x.id!==sid);
    syncMilestone(g,m); save(); render(); toast('已删除');
  });
}
function editGoal(id){
  const g = id ? db.goals.find(x=>x.id===id) : null;
  openForm(g?'编辑大目标':'新建大目标', [
    { k:'title', l:'目标（写具体一点，能验收的那种）', t:'text', req:true, ph:'例：三年内成为能养活自己的独立开发者' },
    { k:'cat', l:'分类', t:'select', opts:GOAL_CATS },
    { k:'note', l:'备注 / 为什么想做这件事', t:'textarea' }
  ], g || { cat:'事业' }, v => {
    if(g) Object.assign(g, v);
    else db.goals.unshift({ id:uid(), title:v.title, cat:v.cat, note:v.note, created:TODAY, milestones:[] });
    save(); render(); toast(g?'已保存':'目标已创建');
  });
}
function delGoal(id){
  const g = db.goals.find(x=>x.id===id);
  const subN = g.milestones.reduce((a,m)=>a+(m.subs||[]).length,0);
  confirmBox('删除目标「'+g.title+'」？', '它下面的 '+g.milestones.length+' 个里程碑'+(subN?('和 '+subN+' 条里程表小项'):'')+'会一起删除，此操作不可撤销。', () => {
    db.goals = db.goals.filter(x=>x.id!==id); save(); render(); toast('已删除');
  });
}
function editMilestone(gid,mid){
  const g = db.goals.find(x=>x.id===gid);
  const m = mid ? g.milestones.find(x=>x.id===mid) : null;
  openForm(m?'编辑里程碑':'添加里程碑', [
    { k:'title', l:'里程碑内容', t:'text', req:true, ph:'例：积累 1000 名真实用户' }
  ], m || {}, v => {
    if(m) m.title = v.title;
    else g.milestones.push({ id:uid(), title:v.title, done:false, subs:[] });
    save(); render(); toast('已保存');
  });
}
function delMilestone(gid,mid){
  const g = db.goals.find(x=>x.id===gid);
  const m = g.milestones.find(x=>x.id===mid); if(!m) return;
  const n = (m.subs||[]).length;
  confirmBox('删除里程碑？', '「'+m.title+'」'+(n?('及其下 '+n+' 条里程表小项'):'')+'将被删除。', ()=>{
    g.milestones = g.milestones.filter(x=>x.id!==mid); save(); render(); toast('里程碑已删除');
  });
}

============================================================ */
const IDEA_TAGS = ['产品','内容','技术','生活','成长','搞钱','其他'];
function viewIdeas(){
  const all = db.ideas;
  const showDone = route.showDone;
  const f = route.filter || 'all';
  let list = f==='all' ? all : f==='todo' ? all.filter(i=>!i.done) : f==='done' ? all.filter(i=>i.done) : all.filter(i=>i.tag===f);
  if(!showDone) list = list.filter(i=>!i.done);
  list = list.slice().sort((a,b)=> (b.created||'').localeCompare(a.created||''));
  const todoN = all.filter(i=>!i.done).length;

  let h = '<div class="idea-add-card">'
    + '<div class="top">'
    + '<textarea id="ideaIn" class="idea-in" rows="1" placeholder="想到什么就写下来，回车换行，写完点「记录」保存"></textarea>'
    + dd('dd_ideaTag','ideaTag', IDEA_TAGS, IDEA_TAGS[0])
    + '<button class="btn primary" style="min-height:46px" onclick="quickIdea()">'+ico('plus',16)+'记录</button>'
    + '</div>'
    + '<div class="filters">'
    +   chip('all','全部 '+all.length) + chip('done','已完成 '+(all.length-todoN))
    +   IDEA_TAGS.map(t=>{ const c=all.filter(i=>i.tag===t).length; return c?chip(t,t+' '+c):''; }).join('')
    +   '<button class="btn sm" style="margin-left:auto" onclick="toggleShowDone()">'+(showDone?ico('eye',14):ico('eyeOff',14))+(showDone?'隐藏已完成':'显示已完成')+'</button>'
    + '</div></div>';

  if(!list.length) return h + emptyBox('这里还是空的，想法不记下来就跑掉了');

  // 小红书式多列瀑布流：高度随内容变化，点击轻微放大并选中
  h += '<div class="idea-masonry">';
  list.forEach(i => {
    h += '<div class="idea-card'+(i.done?' done':'')+(route.selIdea===i.id?' sel':'')+'" onclick="selIdea(\''+i.id+'\',event)">'
      + '<div class="idea-card-top">'
      +   '<span class="tag purple idea-note-tag">'+esc(i.tag||'其他')+'</span>'
      +   '<div class="idea-actions">'
      +     '<button class="iconbtn" title="编辑" onclick="editIdea(\''+i.id+'\')">'+ico('edit',13)+'</button>'
      +     '<button class="iconbtn del" title="删除" onclick="delIdea(\''+i.id+'\')">'+ico('del',13)+'</button>'
      +   '</div>'
      + '</div>'
      + '<div class="idea-card-text">'+esc(i.text)+'</div>'
      + '<div class="idea-card-foot">'
      +   '<button class="btn-done'+(i.done?' on':'')+'" onclick="toggleIdea(\''+i.id+'\')">'+(i.done?'已完成':'标记完成')+'</button>'
      +   '<span style="font-size:11.5px;color:var(--muted);margin-left:auto">'+fmtMD(i.created)+'</span>'
      + '</div>'
      + '</div>';
  });
  h += '</div>';
  return h;
}
function chip(k,label){ return '<button class="chip'+(route.filter===k?' on':'')+'" onclick="setFilter(\''+k+'\')">'+esc(label)+'</button>'; }
function setFilter(k){ route.filter = k; render(); }
function toggleShowDone(){ route.showDone = !route.showDone; render(); }
function selIdea(id, ev){
  if(ev && ev.target && ev.target.closest && ev.target.closest('button')) return;
  route.selIdea = route.selIdea === id ? null : id;
  render();
}
function quickIdea(){
  const el = $('ideaIn'); const v = el.value.trim(); if(!v){ el.focus(); return; }
  db.ideas.unshift({ id:uid(), text:v, tag:$('ideaTag').value, created:TODAY, done:false });
  save(); render(); toast('灵感已记录');
  setTimeout(()=>{ const n=$('ideaIn'); if(n) n.focus(); },40);
}
function toggleIdea(id){ const i=db.ideas.find(x=>x.id===id); i.done=!i.done; i.doneAt = i.done?TODAY:''; save(); render(); toast(i.done?'已完成':'已恢复'); }
function editIdea(id){
  const i = db.ideas.find(x=>x.id===id);

    { k:'text', l:'内容', t:'textarea', req:true },
    { k:'tag', l:'标签', t:'select', opts:IDEA_TAGS },
    { k:'created', l:'记录日期', t:'date' }
