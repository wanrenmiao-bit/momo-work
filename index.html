const EXPANDED = new Set();
function goalRing(pct, size){
  const s = size||56, p = Math.max(0, Math.min(100, Math.round(pct||0)));
  const r = 21.2, c = 2*Math.PI*r, on = c*p/100;
  const col = p>=100 ? 'var(--accent2)' : 'var(--accent)';
  const fs  = p>=100 ? 10.5 : 12;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 48 48" style="flex-shrink:0;overflow:visible">'
    + '<circle cx="24" cy="24" r="'+r+'" fill="none" stroke="#ece5dc" stroke-width="2.4"/>'
    + '<circle cx="24" cy="24" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="'+on.toFixed(1)+' '+(c-on).toFixed(1)+'" transform="rotate(-90 24 24)" style="transition:stroke-dasharray .45s ease"/>'
    + '<text x="24" y="28" text-anchor="middle" font-size="'+fs+'" font-weight="700" fill="var(--text)" letter-spacing="-.4">'+p+'<tspan font-size="'+(fs*0.62).toFixed(1)+'" font-weight="600" fill="var(--muted)" dx="0.6">%</tspan></text></svg>';
}
const GOAL_CATS = ['事业','健康','成长','财务','家庭','兴趣','其他'];
let goalNewCat = '事业';

/* 里程碑进度：有子里程表按子项算，没有就按自身 done */
function msProgress(m){
  const subs = m.subs || [];
  if(!subs.length) return { done:m.done?1:0, total:1, pct:m.done?100:0, leaf:true };
  const d = subs.filter(s=>s.done).length;
  return { done:d, total:subs.length, pct:Math.round(d/subs.length*100), leaf:false };
}
function msIsDone(m){ const p = msProgress(m); return p.total>0 && p.done===p.total; }
function goalProgress(g){
  let done=0, total=0;
  (g.milestones||[]).forEach(m=>{ const p = msProgress(m); done+=p.done; total+=p.total; });
  return { done, total, pct: total?Math.round(done/total*100):0 };
}

function viewGoals(){
  const gs = db.goals;
  const allM = gs.reduce((a,g)=>a+g.milestones.length,0);
  const doneM = gs.reduce((a,g)=>a+g.milestones.filter(msIsDone).length,0);
  const allSub = gs.reduce((a,g)=>a+g.milestones.reduce((b,m)=>b+(m.subs||[]).length,0),0);
  /* 已达成 = 所有层级已达成目标之和，含小目标 */
  const bigDone = gs.filter(g => g.milestones.length && g.milestones.every(msIsDone)).length;
  const msDone = gs.reduce((a,g)=>a+g.milestones.filter(msIsDone).length,0);
  const subDone = gs.reduce((a,g)=>a+g.milestones.reduce((b,m)=>b+(m.subs||[]).filter(s=>s.done).length,0),0);
  const achieved = bigDone + msDone + subDone;
  const doingGoals = gs.length - bigDone;
  let h = '<div class="goal-stats">'
    + '<div class="gstat achieved-hero">'
    +   '<div class="gstat-ico">'+ico('trophy',26)+'</div>'
    +   '<div class="gstat-num">'+achieved+'<span>个</span></div>'
    +   '<div class="gstat-lab">已达成目标</div>'
    +   (achieved ? '<div class="gstat-sub">'+ico('spark',12)+'大目标 '+bigDone+' · 里程碑 '+msDone+' · 小目标 '+subDone+'</div>' : '<div class="gstat-sub">完成第一个目标就能点亮奖杯</div>')
    + '</div>'
    + stat('人生大目标', gs.length, '个')
    + stat('进行中目标', doingGoals, '个')
    + stat('里程碑', allM, '个')
    + '</div>';

  /* 内联新建（不再弹框） */
  h += '<div class="goal-add-card">'
    + '<div class="ga-row">'
    +   '<input id="gaTitle" placeholder="写下一个大目标，比如：三年内成为能养活自己的独立开发者" onkeydown="if(event.key===\'Enter\')addGoalInline()">'
    +   '<input id="gaNote" class="ga-note" placeholder="备注 / 为什么想做这件事（可留空）">'
    +   '<button class="btn primary" onclick="addGoalInline()">'+ico('plus',15)+'添加</button>'
    + '</div>'
    + '<div class="ga-row2">'
    +   '<div class="ga-cats">'+GOAL_CATS.map(c=>'<button class="chip'+(goalNewCat===c?' on':'')+'" onclick="setGoalNewCat(\''+c+'\')">'+c+'</button>').join('')+'</div>'
    + '</div>'
    + '</div>';

  if(!gs.length) return h + emptyBox('还没有目标，在上面直接写下第一个想实现的事');

  h += '<div class="goal-list">';
  gs.forEach(g => {
    const gp = goalProgress(g);
    const msTotal = g.milestones.length, msDone = g.milestones.filter(msIsDone).length;
    const allDone = msTotal && msDone === msTotal;
    const expanded = EXPANDED.has(g.id);
    const lastDone = allDone ? (g.milestones.map(m=>m.doneAt).filter(Boolean).sort().pop()||'') : '';
    h += '<div class="goal-card'+(allDone?' achieved':'')+'" draggable="true" ondragstart="dragGoal(event,\''+g.id+'\')" ondragover="allowGoalDrop(event)" ondragleave="goalDragLeave(event)" ondrop="dropGoal(event,\''+g.id+'\')">'
      + '<div class="goal-head">'
      +   (allDone
            ? '<div class="goal-medal">'+ico('trophy',34)+'<span class="goal-medal-spark">'+ico('spark',13)+'</span></div>'

          +   '<div class="milestone-actions">'

              + '<span class="sub-idx">'+(idx+1)+'.'+(si+1)+'</span>'
              + '<span class="sub-title">'+esc(s.title)+'</span>'
              + (s.done ? '<span class="sub-at">'+fmtMD(s.doneAt)+'</span>' : '')
              + '<span class="sub-ops">'
              +   '<button class="iconbtn" title="编辑" onclick="editSub(\''+g.id+'\',\''+m.id+'\',\''+s.id+'\')">'+ico('edit',13)+'</button>'
              +   '<button class="iconbtn del" title="删除" onclick="delSub(\''+g.id+'\',\''+m.id+'\',\''+s.id+'\')">'+ico('del',13)+'</button>'
              + '</span></div>';
          });
          h += '<div class="addline sub-add"><input placeholder="添加里程表小项，回车保存" onkeydown="if(event.key===\'Enter\')quickSub(\''+g.id+'\',\''+m.id+'\',this)">'

        }
        h += '</div>';
      });
      h += '<div class="addline"><input placeholder="添加一个里程碑，回车保存" onkeydown="if(event.key===\'Enter\')quickMilestone(\''+g.id+'\',this)">'
        + '<button class="btn sm" onclick="editMilestone(\''+g.id+'\')">添加</button></div>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="goal-drop-last" ondragover="allowGoalDrop(event)" ondragleave="goalDragLeave(event)" ondrop="dropGoalLast(event)">'+ico('down',13)+'拖动目标到这里，放到最后</div>';
  return h;
}
function dragGoal(e, id){ e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; }
function allowGoalDrop(e){ e.preventDefault(); e.currentTarget.classList.add('dragover'); }
function goalDragLeave(e){ e.currentTarget.classList.remove('dragover'); }
function dropGoal(e, targetId){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const id = e.dataTransfer.getData('text/plain');
  if(!id || id === targetId) return;
  const from = db.goals.findIndex(x=>x.id===id);
  if(from < 0) return;
  const [moved] = db.goals.splice(from, 1);
  let to = db.goals.findIndex(x=>x.id===targetId);
  if(to < 0) to = db.goals.length;
  db.goals.splice(to, 0, moved);
  save(); render(); toast('已调整目标顺序');
}
function dropGoalLast(e){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const id = e.dataTransfer.getData('text/plain');
  const from = db.goals.findIndex(x=>x.id===id);
  if(from < 0 || from === db.goals.length - 1) return;
  const [moved] = db.goals.splice(from, 1);
  db.goals.push(moved);
  save(); render(); toast('已放到最后');
}
function moveGoal(id, dir){
  const i = db.goals.findIndex(x=>x.id===id);
  if(i < 0) return;
  const j = i + dir;
  if(j < 0 || j >= db.goals.length) return;
  const [m] = db.goals.splice(i, 1);
  db.goals.splice(j, 0, m);
  save(); render();
}

/* 目标达成后的奖励横幅：强调「这是一次值得庆祝的达成」，而不是勾掉一条任务 */
const GOAL_PRAISE = [
  '这一年你真的做到了，给自己一个大大的拥抱。',
  '从写下它到完成它，你一次都没有真正放弃过。',
  '很多人只是想想，而你把它一步步走完了。',
  '这不是运气，是你一天一天攒出来的结果。',
  '记得这一刻的感觉，下一个目标也一样能到。'
];
function daysBetween(a, b){
  if(!a || !b) return 0;
  const d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  if(isNaN(d1) || isNaN(d2)) return 0;
  return Math.max(0, Math.round((d2 - d1) / 86400000));
}
function goalRewardHTML(g, msTotal, gp, lastDone){
  const days = daysBetween(g.created, lastDone || TODAY);
  const praise = GOAL_PRAISE[(g.title||'').length % GOAL_PRAISE.length];
  return '<div class="goal-reward">'
    + '<div class="goal-reward-ico">'+ico('trophy',18,2.2)+'</div>'
    + '<div class="goal-reward-main">'
    +   '<div class="goal-reward-t">目标达成 · 恭喜沫沫！</div>'
    +   '<div class="goal-reward-s">'+esc(praise)+'</div>'
    + '</div>'
    + '<div class="goal-reward-chips">'
    +   (days ? '<span class="rchip gold">'+ico('clock',11,2.4)+'历时 '+days+' 天</span>' : '')
    +   '<span class="rchip">'+ico('flag',11,2.4)+'里程碑 '+msTotal+'</span>'
    +   (gp.total ? '<span class="rchip green">'+ico('check',11,2.8)+'小项 '+gp.done+'/'+gp.total+'</span>' : '')
    +   (lastDone ? '<span class="rchip">'+ico('star',11,2.2)+fmtMD(lastDone)+'</span>' : '')
    + '</div></div>';

function toggleMilestone(gid,mid){

function findSub(gid,mid){
  const g = db.goals.find(x=>x.id===gid); if(!g) return {};
  const m = g.milestones.find(x=>x.id===mid); if(!m) return { g };
  if(!Array.isArray(m.subs)) m.subs = [];
  return { g, m };
}
function syncMilestone(g,m){
  const subs = m.subs || [];
  if(!subs.length) return;
  const all = subs.every(s=>s.done);
  m.done = all;
  m.doneAt = all ? (subs.map(s=>s.doneAt).filter(Boolean).sort().pop()||TODAY) : '';
}
function toggleSub(gid,mid,sid){
  const { g, m } = findSub(gid,mid); if(!m) return;
  const s = m.subs.find(x=>x.id===sid); if(!s) return;
  s.done = !s.done; s.doneAt = s.done ? TODAY : '';
  const before = m.done;
  syncMilestone(g,m);
  if(!before && m.done){
    const allDone = g.milestones.every(msIsDone);
    toast(allDone ? '目标达成！' : '里程碑「'+m.title+'」达成');
  }
  save(); render();
}
function quickSub(gid,mid,el){
  const v = el.value.trim(); if(!v) return;
  const { g, m } = findSub(gid,mid); if(!m) return;
  m.subs.push({ id:uid(), title:v, done:false, doneAt:'' });
  syncMilestone(g,m);
  el.value=''; save(); render(); toast('里程表已添加');
}
function editSub(gid,mid,sid){
  const { g, m } = findSub(gid,mid); if(!m) return;
  const s = sid ? m.subs.find(x=>x.id===sid) : null;
  openForm(s?'编辑里程表小项':'添加里程表小项', [
    { k:'title', l:'小项内容', t:'text', req:true, ph:'例：打通第一个获客渠道' }
  ], s || {}, v => {
    if(s) s.title = v.title;
    else m.subs.push({ id:uid(), title:v.title, done:false, doneAt:'' });
    syncMilestone(g,m); save(); render(); toast('已保存');
  });
}
function delSub(gid,mid,sid){
  const { g, m } = findSub(gid,mid); if(!m) return;
  const s = m.subs.find(x=>x.id===sid); if(!s) return;
  confirmBox('删除里程表小项？', '「'+s.title+'」删除后不可恢复。', ()=>{
    m.subs = m.subs.filter(x=>x.id!==sid);
    syncMilestone(g,m); save(); render(); toast('已删除');
  });
}

function delGoal(id){

function delMilestone(gid,mid){

function ideaMobile(){ return window.innerWidth <= 768; }
function viewIdeas(){
  const all = db.ideas;
  const showDone = route.showDone;
  const f = route.filter || 'all';
  let list = f==='all' ? all : f==='todo' ? all.filter(i=>!i.done) : f==='done' ? all.filter(i=>i.done) : all.filter(i=>i.tag===f);
  if(!showDone) list = list.filter(i=>!i.done);
  list = list.slice().sort((a,b)=> (b.created||'').localeCompare(a.created||''));
  const todoN = all.filter(i=>!i.done).length;

  // 记录按钮左对齐：按钮置顶，其次输入框（自适应），最后标签
  let h = '<div class="idea-add-card">'
    + '<div class="top">'
    + '<button class="btn primary idea-rec" style="min-height:46px" onclick="quickIdea()">'+ico('plus',16)+'记录</button>'
    + '<textarea id="ideaIn" class="idea-in" rows="1" placeholder="想到什么就写下来，回车换行，写完点「记录」保存"></textarea>'
    + dd('dd_ideaTag','ideaTag', IDEA_TAGS, IDEA_TAGS[0])
    + '</div>'
    + '<div class="filters">'
    +   chip('all','全部 '+all.length) + chip('done','已完成 '+(all.length-todoN))
    +   IDEA_TAGS.map(t=>{ const c=all.filter(i=>i.tag===t).length; return c?chip(t,t+' '+c):''; }).join('')
    +   '<button class="btn sm" style="margin-left:auto" onclick="toggleShowDone()">'+(showDone?ico('eye',14):ico('eyeOff',14))+(showDone?'隐藏已完成':'显示已完成')+'</button>'
    + '</div></div>';

  if(!list.length) return h + emptyBox('这里还是空的，想法不记下来就跑掉了');

  // 按日期分组的时间轴瀑布流
  const groups = {};
  list.forEach(i => { const d = i.created || TODAY; (groups[d] = groups[d] || []).push(i); });
  const dates = Object.keys(groups).sort().reverse();
  h += '<div class="idea-timeline">';
  dates.forEach(d => {
    h += '<div class="idea-day-group">'
      + '<div class="idea-day-title">'+d.slice(0,4)+'年'+fmtMD(d)+'</div>'
      + '<div class="idea-masonry">';
    groups[d].forEach(i => { h += ideaCard(i); });
    h += '</div></div>';
  });
  h += '</div>';
  return h;
}

function quickStudy(){
  const t = $('studyTitle').value.trim();
  const tagStr = $('studyTags').value.trim();
  if(!t){ $('studyTitle').focus(); return; }
  const tags = tagStr ? tagStr.split(/[\s,，]+/).filter(Boolean) : [];
  db.studies.unshift({ id:uid(), title:t, content:'', tags, created:TODAY, createdAt:nowStamp(), duration:0 });
  $('studyTitle').value = ''; $('studyTags').value = '';
  save(); render(); toast('笔记已创建');
}
function editStudy(id){
  const s = id ? db.studies.find(x=>x.id===id) : null;
  openForm(s?'编辑学习笔记':'新建学习笔记', [
    { k:'title', l:'标题', t:'text', req:true, ph:'例：SVG 与 CSS 动画学习笔记' },
    { k:'content', l:'正文（长文本，支持多行）', t:'textarea', req:true, ph:'记下关键结论、心得、待办...' },
    { k:'tags', l:'标签（用空格分隔）', t:'text', ph:'前端 动画' },
    { k:'created', l:'日期', t:'date' },

  ], s ? { ...s, tags:(s.tags||[]).join(' '), duration:(s.duration||0) } : { created:TODAY, duration:0 }, v => {

   模块 4：项目
============================================================ */
const PRI = { P0:{c:'red'}, P1:{c:'amber'}, P2:{c:''} };
function projectAnalysisHTML(){
  const ps = db.projects;
  const ct = { '进行中':'#94b08e', '待启动':'#b6a6cf', '暂停':'#e0b56b', '已完成':'#9aa0a6' };
  const order = ['进行中','待启动','暂停','已完成'];
  const counts = order.map(s => ({ s, n: ps.filter(p=>p.status===s).length }));
  const total = ps.length || 1;
  const R=42, C=2*Math.PI*R, cx=60, cy=60;
  let off=0, segs='';
  counts.forEach(seg=>{
    if(seg.n>0){
      const len = seg.n/total*C;
      segs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+ct[seg.s]+'" stroke-width="13" stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      off += len;
    }
  });
  const donut = '<svg width="118" height="118" viewBox="0 0 120 120">'+segs
    + '<text x="60" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">'+ps.length+'</text>'
    + '<text x="60" y="74" text-anchor="middle" font-size="11" fill="var(--muted)">个项目</text></svg>';
  const legend = counts.map(seg=> '<div class="dlegend"><span class="dl-dot" style="background:'+ct[seg.s]+'"></span>'+seg.s+'<b>'+seg.n+'</b></div>').join('');

  const allT = ps.reduce((a,p)=>a+p.tasks.length,0);
  const doneT = ps.reduce((a,p)=>a+p.tasks.filter(t=>t.done).length,0);
  const tPct = allT ? Math.round(doneT/allT*100) : 0;
  const pbars = ps.slice().sort((a,b)=> (b.tasks.filter(t=>t.done).length)-(a.tasks.filter(t=>t.done).length)).slice(0,6).map(p=>{
    const t=p.tasks.length, d=p.tasks.filter(x=>x.done).length, pct=t?Math.round(d/t*100):0;
    return '<div class="pbar-row"><span class="pbar-name" title="'+esc(p.name)+'">'+esc(p.name)+'</span>'
      + '<span class="pbar-track"><i style="width:'+pct+'%;background:'+(p.status==='已完成'?'var(--green)':'var(--accent)')+'"></i></span>'
      + '<span class="pbar-pct">'+pct+'%</span></div>';
  }).join('') || '<div style="font-size:12px;color:var(--muted)">还没有项目</div>';

  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  const oc = months.map(m => ps.reduce((a,p)=> a + p.outputs.filter(o=>(o.date||'').slice(0,7)===m).length,0));
  const maxO = Math.max(1,...oc);
  const mbar = months.map((m,i)=> '<div class="mbar"><span class="mbar-f" style="height:'+Math.max(4,Math.round(oc[i]/maxO*100))+'%"></span><span class="mbar-l">'+m.slice(2)+'</span></div>').join('');

  return '<div class="card proj-an"><div class="card-h"><h3>项目数据分析</h3>'
    + '<div class="r" style="font-size:12px;color:var(--muted)">任务完成 '+doneT+'/'+allT+'（'+tPct+'%）</div></div>'
    + '<div class="proj-an-grid">'
    +   '<div class="pa-block"><div class="pa-h">状态分布</div><div class="pa-donut">'+donut+'<div class="pa-legend">'+legend+'</div></div></div>'
    +   '<div class="pa-block"><div class="pa-h">各项目任务完成度</div>'+pbars+'</div>'
    +   '<div class="pa-block"><div class="pa-h">近 6 个月产出</div><div class="mbars">'+mbar+'</div></div>'
    + '</div></div>';
}

function toggleTask(pid,tid){
  const t=db.projects.find(x=>x.id===pid).tasks.find(x=>x.id===tid);
  t.done=!t.done;
  if(t.done){ t.today=false; t.abandoned=false; }
  save();
  syncProjectTaskToPlan(pid,tid);
  render();
}
function syncProjectTaskToPlan(pid,tid){
  const p = db.projects.find(x=>x.id===pid); const t = p && p.tasks.find(x=>x.id===tid); if(!t) return;
  const idx = db.plans.findIndex(pl => pl.sourceType==='project' && pl.sourceId===pid && pl.sourceSub===tid);
  // 已完成或已放弃：移除计划看板中的关联项
  if(t.done || t.abandoned){ if(idx>=0){ db.plans.splice(idx,1); save(); } return; }
  const cat = priToCat(t.pri);
  if(idx>=0){
    const pl = db.plans[idx];
    pl.text = t.title; pl.cat = cat; pl.must = !!t.today; pl.date = TODAY;
  }else{
    db.plans.unshift({ id:uid(), cat, must:!!t.today, text:t.title, date:TODAY, done:false, created:TODAY, sourceType:'project', sourceId:pid, sourceSub:tid });
  }
  save();
}
function taskToPlan(pid, tid){
  const p = db.projects.find(x=>x.id===pid); const t = p && p.tasks.find(x=>x.id===tid); if(!t) return;
  if(t.done || t.abandoned){ toast('已完成/放弃的任务不再加入计划'); return; }
  const idx = db.plans.findIndex(pl => pl.sourceType==='project' && pl.sourceId===pid && pl.sourceSub===tid);
  if(idx>=0){ toast('这条任务已经在计划看板里了'); return; }
  db.plans.unshift({ id:uid(), cat:priToCat(t.pri), must:!!t.today, text:t.title, date:TODAY, done:false, created:TODAY, sourceType:'project', sourceId:pid, sourceSub:tid });
  save(); render(); toast('已加入计划看板（'+PLAN_CATS.find(c=>c.k===priToCat(t.pri)).n+'）');
}
function toggleTaskToday(pid,tid){

function resumeTask(pid,tid){

function isUrlLike(s){ return /^https?:\/\//i.test(s) || /^(www\.)?[\w-]+(\.[\w-]+){1,}(\/|$)/i.test(s); }
function urlHost(u){ try{ return new URL(normUrl(u)).hostname.replace(/^www\./,''); }catch(e){ return u; } }
function projQuickAdd(pid, field, el){
  const p = db.projects.find(x=>x.id===pid); if(!p || !el) return;
  const v = (el.value||'').trim(); if(!v) return;
  const link = isUrlLike(v);
  const item = link
    ? { id:uid(), title:urlHost(v), url:normUrl(v), note:'' }
    : { id:uid(), title:v, url:'', note:'' };
  if(field === 'outputs') item.date = TODAY;
  p[field].push(item);
  el.value = '';
  save(); render();
  toast(field==='assets' ? '资料已添加' : '产出已记录');
  /* 链接自动补标题和摘要，成功了再刷新一次 */
  if(link) libFetchMeta(item.url).then(m=>{
    const pp = db.projects.find(x=>x.id===pid); if(!pp) return;
    const it = (pp[field]||[]).find(x=>x.id===item.id); if(!it) return;
    let changed = false;
    if(m.title && (!it.title || it.title === urlHost(item.url))){ it.title = m.title; changed = true; }
    if(m.desc && !it.note){ it.note = m.desc; changed = true; }
    if(changed){ save(); render(); toast('已自动补全链接标题'); }
  }).catch(()=>{});
}
function projUpload(pid, field, input){
  const p = db.projects.find(x=>x.id===pid);
  const files = Array.prototype.slice.call(input.files||[]);
  input.value = '';
  if(!p || !files.length) return;
  Promise.all(files.map(f=>{
    const id = uid();
    return putFile(id, f).then(()=>{
      const item = { id, title:f.name, url:'', note:'',
        fileId:id, fileName:f.name, fileSize:f.size, fileType:(f.name.split('.').pop()||'file').toLowerCase() };
      if(field === 'outputs') item.date = TODAY;
      p[field].push(item);
    });
  })).then(()=>{
    save(); render(); toast('已上传 '+files.length+' 个文件（存在本机）');
  }).catch(()=>{
    save(); render(); toast('部分文件未能存入，可能超过浏览器存储上限');
  });
}

function projFindItem(pid, field, id){
  const p = db.projects.find(x=>x.id===pid); if(!p) return null;

}
function projOpenFile(pid, field, id){
  const it = projFindItem(pid, field, id); if(!it || !it.fileId) return;
  getFile(it.fileId).then(blob=>{
    if(!blob){ toast('本机文件数据缺失，请重新上传'); return; }
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 60000);
  }).catch(()=>toast('打开失败'));
}
function projDownloadFile(pid, field, id){
  const it = projFindItem(pid, field, id); if(!it || !it.fileId) return;
  getFile(it.fileId).then(blob=>{
    if(!blob){ toast('本机文件数据缺失'); return; }
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = it.fileName || it.title || 'file';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 60000);
  }).catch(()=>toast('下载失败'));
}

function statG(k,v,unit){
  return '<div class="stat"><div class="k">'+esc(k)+'</div><div class="v" style="color:#5f7d5a">'+v+(unit?'<small>'+unit+'</small>':'')+'</div></div>';

function barChart(list){
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  const vals = months.map(m => list.filter(x=>(x.date||'').startsWith(m)).reduce((a,x)=>a+(+x.amount||0),0));
  const max = Math.max(1, ...vals);
  const W = 640, H = 190, pad = 30, bw = 44;
  const step = (W - pad*2) / months.length;
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="190" preserveAspectRatio="xMidYMid meet" style="display:block">';
  [0,.25,.5,.75,1].forEach(f=>{ const y = pad + (H-pad-34)*(1-f); svg += '<line x1="'+pad+'" y1="'+y.toFixed(1)+'" x2="'+(W-pad+6)+'" y2="'+y.toFixed(1)+'" stroke="var(--surface3)" stroke-width="1"/>'; });
  months.forEach((m,i)=>{
    const v = vals[i];
    const hgt = Math.max(2, (H-pad-34) * v / max);
    const x = pad + step*i + (step-bw)/2;
    const y = H - 34 - hgt;
    const isNow = m === TODAY.slice(0,7);
    svg += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+hgt.toFixed(1)+'" rx="5" fill="'+(isNow?'#f3c9d6':'var(--accent)')+'"/>';
    if(v>0) svg += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--text)" font-weight="700">'+(v>=10000?(v/10000).toFixed(1)+'w':v)+'</text>';
    svg += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-13)+'" text-anchor="middle" font-size="11.5" fill="var(--muted)">'+(+m.slice(5))+'月</text>';
  });
  svg += '</svg>';
  return svg;
}
function sourceCard(list){
  const map = {};
  list.forEach(x => { const k = x.source||'未填来源'; map[k] = (map[k]||0) + (+x.amount||0); });
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max = Math.max(1, ...arr.map(a=>a[1]));
  const colors = ['#94b08e','var(--blue)','var(--accent)','var(--cyan)','var(--orange)','var(--pink)'];
  let h = '<div class="card" style="margin-bottom:0"><div class="card-h"><h3>收入来源 TOP</h3></div>';
  if(!arr.length) h += '<div style="color:var(--muted);font-size:13.5px">暂无数据</div>';
  arr.forEach((a,i)=>{
    h += '<div class="bar-row"><span class="nm" title="'+esc(a[0])+'">'+esc(a[0])+'</span>'
      + '<span class="tr"><i style="width:'+(a[1]/max*100).toFixed(1)+'%;background:'+colors[i%6]+'"></i></span>'
      + '<span class="vl">'+money(a[1])+'</span></div>';
  });
  return h + '</div>';
}
function catCard(list){
  const map = {};
  list.forEach(x => { const k = x.cat||'其他'; map[k] = (map[k]||0) + (+x.amount||0); });
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const total = arr.reduce((a,b)=>a+b[1],0) || 1;
  const colors = { '主业':'#94b08e','副业':'var(--orange)','理财':'var(--blue)','外快':'var(--accent)','红包':'var(--pink)','其他':'#b0a695' };
  let h = '<div class="card" style="margin-bottom:0"><div class="card-h"><h3>收入结构</h3></div>';
  if(!arr.length) return h + '<div style="color:var(--muted);font-size:13.5px">暂无数据</div></div>';
  const r = 52, cx = 66, cy = 66, C = 2*Math.PI*r;
  let acc = 0;
  let svg = '<svg viewBox="0 0 132 132" width="132" height="132" style="flex-shrink:0">';
  arr.forEach(a=>{
    const frac = a[1]/total, len = C*frac;
    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(colors[a[0]]||'#b0a695')+'" stroke-width="17" '

    acc += len;
  });
  svg += '<text x="66" y="63" text-anchor="middle" font-size="12" fill="var(--muted)">合计</text>';
  svg += '<text x="66" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">'+(total>=10000?(total/10000).toFixed(1)+' 万':total)+'</text>';

  });
  return h + '</div></div></div>';

let _openDD = null;
const _ddHooks = {};
/* opts 支持三种写法：'值' / ['值','显示名'] / {group:'分组标题'} */
function dd(id, inputId, opts, cur, onPick){
  const flat = opts.filter(o => !(o && o.group));
  const curOpt = flat.find(o=>{ const v=Array.isArray(o)?o[0]:o; return String(v)===String(cur); });
  const first = flat[0];
  const lab = curOpt ? (Array.isArray(curOpt)?curOpt[1]:curOpt)
                     : (first ? (Array.isArray(first)?first[1]:first) : '');
  if(onPick) _ddHooks[id] = onPick; else delete _ddHooks[id];
  let h = '<div class="dd" id="'+id+'">'
    + '<input type="hidden" id="'+inputId+'" value="'+esc(cur)+'">'
    + '<button type="button" class="dd-btn" onclick="toggleDD(\''+id+'\')">'
    +   '<span class="dd-val">'+esc(lab)+'</span>'
    +   '<svg class="dd-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
    + '</button>'
    + '<div class="dd-pop" style="display:none">';
  opts.forEach(o=>{
    if(o && o.group){ h += '<div class="dd-group">'+esc(o.group)+'</div>'; return; }
    const val = Array.isArray(o)?o[0]:o, l = Array.isArray(o)?o[1]:o;
    h += '<div class="dd-opt'+(String(val)===String(cur)?' on':'')+'" onclick="pickDD(\''+id+'\',\''+esc(val)+'\',\''+esc(l)+'\')">'+esc(l)+'</div>';
  });
  h += '</div></div>';
  return h;
}
function toggleDD(id){
  const el = document.getElementById(id); if(!el) return;
  const pop = el.querySelector('.dd-pop');
  const isOpen = pop.style.display === 'block';
  closeAllDD();
  if(!isOpen){ pop.style.display='block'; el.classList.add('on'); _openDD = id; }
}
function closeAllDD(){ document.querySelectorAll('.dd-pop').forEach(p=>p.style.display='none'); document.querySelectorAll('.dd').forEach(d=>d.classList.remove('on')); _openDD=null; }
function pickDD(ddId, val, lab){
  const el = document.getElementById(ddId);
  el.querySelector('.dd-val').textContent = lab;
  el.querySelector('input[type=hidden]').value = val;
  el.querySelectorAll('.dd-opt').forEach(o=>o.classList.remove('on'));
  const hit = Array.from(el.querySelectorAll('.dd-opt')).find(o=>o.textContent===lab);
  if(hit) hit.classList.add('on');
  closeAllDD();
  const fn = _ddHooks[ddId];
  if(typeof fn === 'function') fn(val, lab);
}

const GIST_API = 'https://api.github.com/gists';
const SYNC_FILE = 'momo-workbench.json';

function syncReady(){ return !!(meta.sync && meta.sync.token && meta.sync.gistId); }

    + '<div style="font-size:12.5px;color:var(--muted);margin:6px 0 12px"><span class="sync-dot '+(s.lastSync?'on':'')+'"></span>状态：'+cfg+' ｜ 上次同步：'+last+'</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + '<button class="btn primary" onclick="saveSyncCfg()">保存设置</button>'
    + '<button class="btn" onclick="closeModal();pullCloud(true)">从云端拉取 ▼</button>'
    + '<button class="btn" style="grid-column:1/3" onclick="closeModal();pushCloud(true)">推送本机数据到云端 ▲</button>'
    + '</div>';
  openModal('云端同步', b, [{ t:'关闭', cls:'btn', fn:closeModal }]);

async function saveSyncCfg(){
  meta.sync = meta.sync || {};
  meta.sync.token = $('syncToken').value.trim();
  meta.sync.gistId = $('syncGist').value.trim();
  meta.sync.auto = $('syncAuto').checked;
  saveMeta();
  closeModal();
  stopSyncInterval();
  if(!SESSION.user || !SKEY){ toast('已保存（未登录，暂不能同步）'); return; }
  if(!meta.sync.token){ toast('已保存（未填令牌，暂不能同步）'); return; }
  toast('同步设置已保存，正在校验云端…');
  try{
    if(!meta.sync.gistId){
      // 新建 Gist：把本地数据推上去
      await pushCloud(true, {force:true});
    } else {
      // 已有 Gist：先拉取，避免本地空数据覆盖云端完整数据
      await pullCloud(false, { noConfirm:true });
    }
    startSyncInterval();
  }catch(e){
    // 拉取失败（Gist 不存在/无文件/空数据）则尝试推送本地
    if(e.message === 'Gist not found' || e.message === 'No file' || e.message === 'Empty cloud data'){
      try{ await pushCloud(true, {force:true}); startSyncInterval(); }catch(e2){}
    } else {
      toast('同步校验失败：' + e.message);
    }
  }
}

/* 读取云端 Gist 元信息（文件名、更新时间），用于 push 前冲突检查 */
async function cloudHead(){
  if(!meta.sync.gistId) return { exists:false, updatedAt:0, file:null };
  const res = await fetch(GIST_API + '/' + meta.sync.gistId, { headers: ghHeaders() });
  if(!res.ok){
    if(res.status === 404) return { exists:false, updatedAt:0, file:null, notFound:true };
    throw new Error('HTTP ' + res.status);
  }
  const data = await res.json();
  const fname = userFile(SESSION.user);
  const file = data.files && data.files[fname];
  return { exists:true, updatedAt:new Date(data.updated_at).getTime(), file, data };
}

async function pushCloud(manual, opts){
  opts = opts || {};
  if(!SESSION.user || !SKEY){ if(manual) toast('请先登录账号再同步'); return; }
  if(!meta.sync || !meta.sync.token){ if(manual) toast('请先在「云端同步」填写令牌'); openSync(); return; }
  if(_pushing){ if(manual) toast('同步正在进行中，请稍候'); return; }
  _pushing = true;
  try{
    const fname = userFile(SESSION.user);
    // 推送前检查云端版本：若云端比本机新，阻止自动覆盖
    if(meta.sync.gistId && !opts.force){
      try{
        const head = await cloudHead();
        if(head.exists && head.file && head.updatedAt > (db._updatedAt || 0) + 3000){
          if(manual){
            confirmBoxCustom('云端数据更新', '云端数据比本机新（'+new Date(head.updatedAt).toLocaleString('zh-CN')+'）。直接推送会覆盖云端，建议先「从云端拉取」。', '仍要强制推送', ()=>pushCloud(manual, {force:true}));
          } else {
            console.warn('auto push skipped: cloud newer');
          }
          return;
        }
      }catch(e){ /* 版本检查失败仍继续推送 */ }
    }
    const b64 = await encryptWithKey(SKEY, db);
    let url = GIST_API, method = 'POST', recreate = false;
    const body = { files:{ [fname]:{ content:b64 } }, description:'沫沫人生工作台 用户数据同步' };
    if(meta.sync.gistId){ url = GIST_API + '/' + meta.sync.gistId; method = 'PATCH'; }
    let res = await fetch(url, { method, headers: ghHeaders(), body: JSON.stringify(body) });
    if(!res.ok && res.status === 404 && meta.sync.gistId){
      recreate = true;
      res = await fetch(GIST_API, { method:'POST', headers: ghHeaders(), body: JSON.stringify(body) });
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(data.id){ meta.sync.gistId = data.id; }
    meta.sync.lastSync = Date.now(); saveMeta();
    db._updatedAt = Math.max(db._updatedAt || 0, new Date(data.updated_at).getTime());
    if(manual) toast(recreate ? '云端 Gist 不存在，已重新创建并同步' : '已同步到云端');
  }catch(e){
    if(manual) toast('同步失败：' + e.message + '（检查令牌/网络，GitHub API 需联网）');
    else console.warn('auto push failed:', e.message);
  } finally {
    _pushing = false;
  }
}

async function pullCloud(manual, opts){
  opts = opts || {};
  if(!SESSION.user || !SKEY){ if(manual) toast('请先登录账号'); openLogin(); return; }
  if(!meta.sync || !meta.sync.token){ if(manual) toast('请先在「云端同步」填写令牌'); openSync(); return; }
  if(!meta.sync.gistId){ if(manual) toast('还没有云端 Gist，请先点「推送本机数据到云端」创建'); throw new Error('No gistId'); }
  let data;
  try{
    const res = await fetch(GIST_API + '/' + meta.sync.gistId, { headers: ghHeaders() });
    if(!res.ok){
      if(res.status === 404){
        if(manual) toast('云端 Gist 不存在，可能是 ID 填错或被删除，请重新推送创建');
        throw new Error('Gist not found');
      }
      throw new Error('HTTP ' + res.status);
    }
    data = await res.json();
    const file = data.files && data.files[userFile(SESSION.user)];
    if(!file || !file.content){
      if(manual) toast('云端暂无你的数据，请先推送一次');
      throw new Error('No file');
    }
    let nd;
    try{ nd = await decryptWithKey(SKEY, file.content); }catch(err){ if(manual) toast('解密失败，密码可能不正确'); throw err; }
    nd = migrateData(nd);
    const cloudCount = totalCount(nd);
    if(cloudCount === 0){
      if(manual) toast('云端数据为空，未覆盖本地');
      throw new Error('Empty cloud data');
    }
    nd._updatedAt = Math.max(nd._updatedAt || 0, new Date(data.updated_at).getTime());
    if(manual && !opts.noConfirm && totalCount() > 0){
      confirmBoxCustom('从云端拉取？', '会用云端记录覆盖本机当前数据，<b>未同步的改动会丢失</b>。建议先点「导出备份」留底。', '确认拉取覆盖', ()=>applyPull(nd));
    } else {
      applyPull(nd);
    }
  }catch(e){
    if(manual) toast('拉取失败：' + e.message);
    throw e;
  }
}

function applyPull(nd){
  db = Object.assign(blankDB(), nd);
  ['goals','ideas','studies','projects','incomes','plans','reviews','pomos','library'].forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
  if(typeof db.gratitude !== 'object' || db.gratitude === null || Array.isArray(db.gratitude)) db.gratitude = {};
  db.goals.forEach(g=>{ if(!Array.isArray(g.milestones)) g.milestones=[]; });
  db.projects.forEach(p=>{ ['tasks','assets','outputs'].forEach(k=>{ if(!Array.isArray(p[k])) p[k]=[]; }); });
  db.seeded = true;
  db._updatedAt = Math.max(db._updatedAt || 0, Date.now());
  // 直接落盘，不触发 schedulePush，避免拉取后又立刻推送造成循环
  try{ localStorage.setItem(scopeKey(), JSON.stringify(db)); }catch(e){ toast('存储空间不足，建议导出备份'); }
  meta.sync.lastSync = Date.now(); saveMeta();
  render();
  toast('已从云端拉取最新数据');
}

let _pushTimer = null, _syncInterval = null, _pushing = false;
function schedulePush(){
  if(!SESSION.user || !SKEY || !meta.sync || !meta.sync.auto || !meta.sync.token || !meta.sync.gistId) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(()=>{ pushCloud(false, {force:true}); }, 180);
}

function startSyncInterval(){
  stopSyncInterval();
  if(!SESSION.user || !SKEY || !meta.sync || !meta.sync.auto || !meta.sync.token || !meta.sync.gistId) return;
  _syncInterval = setInterval(()=>{
    if(!meta.sync.lastSync || (db._updatedAt || 0) > meta.sync.lastSync){
      pushCloud(false, {force:true});
    }
  }, 5000);
}
function stopSyncInterval(){ if(_syncInterval){ clearInterval(_syncInterval); _syncInterval = null; } }

async function doLogin(){
  const pass = (($('lgPass')||{}).value||'').trim();
  if(!pass){ toast('请输入密码'); return; }
  const user = (SESSION.user && !SKEY) ? SESSION.user : (($('lgUser')||{}).value||'').trim();
  if(!user){ toast('请输入账号'); return; }
  if(user !== 'wanren'){ toast('账号不存在，本工作台仅允许 wanren 登录'); return; }
  try{
    let verified = false, cloudData = null;
    // 优先以云端能否解密作为密码正确性判断（支持改密码后换设备登录）
    if(syncReady() && meta.sync.gistId){
      try{
        const res = await fetch(GIST_API + '/' + meta.sync.gistId, { headers: ghHeaders() });
        if(res.ok){
          const data = await res.json();
          const file = data.files && data.files[userFile(user)];
          if(file && file.content){
            const key = await deriveKey(user, pass);
            cloudData = migrateData(await decryptWithKey(key, file.content));
            verified = true;
            meta.wanrenPassHash = hashStr(pass); // 同步本地密码哈希
          }
        }
      }catch(e){ /* 云端无法访问或解密失败，回退到本地验证 */ }
    }
    // 无云端或云端无文件时，使用本地密码哈希验证
    if(!verified){
      if(hashStr(pass) === meta.wanrenPassHash) verified = true;
    }
    if(!verified){ toast('登录失败：密码不正确'); return; }

    const key = await deriveKey(user, pass);
    SKEY = key; SESSION = { user, guest:false };
    meta.session = { user }; saveMeta();
    await saveSessionRecord(key, user);

    if(cloudData && totalCount(cloudData) > 0){
      applyPull(cloudData);
      closeModal(); paintAccount(); startSyncInterval();
      toast('已登录：'+user+'（已同步云端最新数据）');
      return;
    }
    /* 首次使用 / 未配置云端 / 云端无数据：保留当前本地数据 */
    save(); render(); closeModal(); paintAccount();
    toast('已登录：'+user + (syncReady() ? '（首次同步中…）' : '（未配置云端，数据仅本机）'));
    if(syncReady()){ await pushCloud(false, {force:true}); startSyncInterval(); }
  }catch(e){ SKEY=null; toast('登录失败：'+e.message); }
}

async function doChangePass(){
  const oldP = (($('cpOld')||{}).value||'').trim();
  const newP = (($('cpNew')||{}).value||'').trim();
  const newP2 = (($('cpNew2')||{}).value||'').trim();
  if(!oldP || !newP || !newP2){ toast('请填写完整'); return; }
  if(newP.length < 4){ toast('新密码至少 4 位'); return; }
  if(newP !== newP2){ toast('两次新密码不一致'); return; }
  try{
    const oldKey = await deriveKey(SESSION.user, oldP);
    let verified = false;
    if(syncReady()){
      try{
        const res = await fetch(GIST_API+'/'+meta.sync.gistId, { headers:ghHeaders() });
        if(res.ok){
          const d = await res.json();
          const f = d.files && d.files[userFile(SESSION.user)];
          if(f && f.content){ await decryptWithKey(oldKey, f.content); verified = true; }
          else verified = true; /* 云端还没有本账号文件，无需校验 */
        } else verified = true;
      }catch(e){ verified = false; }
    } else {
      verified = true; /* 未配置云端，本机会话已登录即视为已授权 */
    }
    if(!verified){ toast('当前密码不正确'); return; }
    const newKey = await deriveKey(SESSION.user, newP);
    SKEY = newKey;
    meta.wanrenPassHash = hashStr(newP); // 更新本地密码哈希
    saveMeta();
    await saveSessionRecord(newKey, SESSION.user);
    toast('密码已更新，正在用新密码重新加密…');
    if(syncReady()) await pushCloud(false);
    closeModal();
  }catch(e){ toast('修改失败：'+e.message); }
}

const PLAN_CATS = [
  { k:'q1',   n:'重要且紧急',   color:'var(--red)',  desc:'立刻做' },
  { k:'q2',   n:'重要不紧急',   color:'var(--green)',desc:'排期做，别拖' },
  { k:'q3',   n:'紧急不重要',   color:'var(--blue)', desc:'能委托就委托' },
  { k:'q4',   n:'不紧急不重要', color:'var(--muted)',desc:'有空再说' }
];
let planAddCat = 'q1';

function viewPlan(){
  const all = db.plans;
  const open = all.filter(p=>!p.done);
  const doneAll = all.filter(p=>p.done);
  const doneToday = doneAll.filter(p=>p.doneAt === TODAY).length;
  const overdue = open.filter(p=>p.date && p.date < TODAY).length;
  const rate = all.length ? Math.round(overdue/all.length*100) : 0;

  let h = '<div class="grid g4 stats" style="margin-bottom:18px">'
    + stat('待办中', open.length, '条') + stat('今日完成', doneToday, '条')
    + stat('累计完成', doneAll.length, '条') + stat('逾期率', rate, '%') + '</div>';

  // 新布局：左侧今日必须完成（大列） + 右侧 2×2 四象限
  h += '<div class="plan-layout">';
  h += '<div class="plan-must-col">' + planZone('must', all.filter(p=>p.must), true) + '</div>';
  h += '<div class="plan-quadrant-grid">';
  ['q1','q2','q3','q4'].forEach(k=>{ h += planZone(k, all.filter(p=>p.cat===k), false); });
  h += '</div></div>';

  // 每日完成记录
  h += '<div class="card"><div class="card-h"><h3>每日完成记录</h3></div><div class="pr-hist">';
  const donePlans = all.filter(p=>p.done && p.doneAt);
  if(!donePlans.length) h += '<div class="empty" style="padding:18px 0">还没有完成的计划，勾选一条试试</div>';
  else {
    const groups = {};
    donePlans.forEach(p=>{ (groups[p.doneAt]=groups[p.doneAt]||[]).push(p); });
    Object.keys(groups).sort((a,b)=>b.localeCompare(a)).slice(0,21).forEach(d=>{
      const label = d===TODAY ? '今天' : (d===off(-1) ? '昨天' : fmtMD(d));
      h += '<div class="pr-hist-day"><b>'+label+'</b><span>'+groups[d].length+' 条完成</span></div>';
      groups[d].forEach(p=>{
        const c = PLAN_CATS.find(x=>x.k===p.cat) || PLAN_CATS[0];
        h += '<div class="pr-hist-row">'+ico('check',14)+'<span>'+esc(p.text)+'</span>'
          +  '<i class="hist-cat" style="color:'+c.color+'">'+c.n+'</i></div>';
      });
    });
  }
  h += '</div></div>';
  return h;
}

function planZone(cat, items, full){
  const isMust = cat === 'must';
  const c = isMust ? { k:'must', n:'今日必须完成的', color:'var(--red)', desc:'今天无论如何都要做完' } : PLAN_CATS.find(x=>x.k===cat);
  let h = '<div class="plan-zone'+(isMust?' must':'')+'" style="--zc:'+c.color+'" data-cat="'+cat+'" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropPlan(event,\''+cat+'\')">';
  h += '<div class="plan-zone-h">';
  if(isMust){
    h += '<span class="must-flag">'+ico('flag',14)+'</span><span style="font-weight:800">'+c.n+'</span><span class="cnt">'+items.length+'</span>';
  }else{
    h += '<span class="dot" style="background:'+c.color+'"></span>'+c.n+'<span class="cnt">'+items.length+'</span>';
  }
  h += '</div>';

  // 四象限直接在头部添加任务
  if(!isMust){
    h += '<div class="plan-zone-add">'
      + '<input id="planInput_'+cat+'" placeholder="'+esc(c.desc)+'，回车添加" onkeydown="if(event.key===\'Enter\')addPlan(\''+cat+'\')">'
      + '<button class="btn sm primary" onclick="addPlan(\''+cat+'\')">'+ico('plus',14)+'</button></div>';
  }

  h += '<div class="plan-zone-body">';
  if(!items.length) h += '<div class="plan-zone-empty">'+(isMust?'从右侧点亮小太阳，把任务提升过来':c.desc)+'</div>';
  items.forEach(p=>{ h += planItemHTML(p); });
  h += '</div>';
  h += '</div>';
  return h;
}

function planItemHTML(p){

function dragPlan(e,id){ e.dataTransfer.setData('text/plain', id); }
function allowDrop(e){ e.preventDefault(); e.currentTarget.classList.add('dragover'); }
function dragLeave(e){ e.currentTarget.classList.remove('dragover'); }
function dropPlan(e,cat){
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  const id = e.dataTransfer.getData('text/plain');
  const p = db.plans.find(x=>x.id===id);
  if(!p) return;
  if(cat === 'must'){
    if(!p.must){ p.must = true; save(); render(); toast('已设为今日必须完成'); }
  }else if(p.cat !== cat){
    p.cat = cat; save(); render(); toast('已移动到「'+PLAN_CATS.find(c=>c.k===cat).n+'」');
  }
}

function addPlan(cat){

  const el = $('planInput_'+cat); if(!el) return;
  const t = el.value.trim(); if(!t){ el.focus(); return; }
  db.plans.unshift({ id:uid(), cat, must:false, text:t, date:TODAY, done:false, created:TODAY });
  save(); render(); toast('已添加到「'+PLAN_CATS.find(c=>c.k===cat).n+'」');
}
function togglePlan(id){
  const p=db.plans.find(x=>x.id===id); if(!p) return;
  p.done=!p.done; p.doneAt=p.done?TODAY:'';
  // 同步完成状态到关联任务
  if(p.sourceType==='project' && p.sourceId && p.sourceSub){
    const t = db.projects.find(x=>x.id===p.sourceId)?.tasks.find(x=>x.id===p.sourceSub);
    if(t){ t.done = p.done; if(t.done){ t.today=false; t.abandoned=false; } }
  }
  if(p.sourceType==='gratitude' && p.sourceSub){
    const arr = db.gratitude[p.sourceSub]?.tomorrow; if(arr){
      const it = arr.find(x=>x.text===p.text); if(it){ it.done = p.done; if(it.done){ it.today=false; it.abandoned=false; } }
    }
  }
  save(); render();
}
function togglePlanSun(id){
  const p = db.plans.find(x=>x.id===id); if(!p) return;
  const toMust = !p.must;
  // 关联任务：通过原模块的太阳状态同步
  if(p.sourceType==='project' && p.sourceId && p.sourceSub){
    const t = db.projects.find(x=>x.id===p.sourceId)?.tasks.find(x=>x.id===p.sourceSub);
    if(t){ t.today = toMust; if(toMust) t.abandoned=false; save(); syncProjectTaskToPlan(p.sourceId,p.sourceSub); render(); toast(toMust?'已设为今日必须完成':'已移出今日必须完成'); }
    return;
  }
  if(p.sourceType==='gratitude' && p.sourceSub){
    const arr = db.gratitude[p.sourceSub]?.tomorrow; if(arr){
      const idx = arr.findIndex(x=>x.text===p.text);
      if(idx>=0){ const it=arr[idx]; it.today=toMust; if(toMust) it.abandoned=false; save(); syncGratTaskToPlan(idx); render(); toast(toMust?'已设为今日必须完成':'已移出今日必须完成'); }
    }
    return;
  }
  // 普通计划项：只切换 must 字段，cat 保持不动
  p.must = toMust;
  save(); render();
  toast(toMust?'已设为今日必须完成':'已移出今日必须完成');
}

let gratView = { ym: TODAY.slice(0,7), sel: TODAY };

function gratHas(d){
  const g = db.gratitude[d]; if(!g) return false;
  const txt = x => typeof x === 'string' ? x : (x && x.text) || '';
  return [].concat(g.grateful||[],g.great||[],g.want||[],g.tomorrow||[]).some(x=> txt(x).trim());
}
function gratComplete(d){
  const g = db.gratitude[d]; if(!g) return false;
  const n = a => (a||[]).length;
  return !!(g.mood && g.mood.trim())
    && n(g.grateful)>=5 && n(g.great)>=5 && n(g.tomorrow)>=5
    && n(g.want)>=1 && n(g.want)<=3;
}

function gratMonthNav(delta){
  let [y,m] = gratView.ym.split('-').map(Number);
  m += delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  gratView.ym = y+'-'+String(m).padStart(2,'0');
  render();
}
function selGratDay(d){ gratView.sel = d; render(); }

function gratCalendar(){
  const [y,m] = gratView.ym.split('-').map(Number);
  const first = new Date(y,m-1,1), startDow = first.getDay();
  const daysInMonth = new Date(y,m,0).getDate();
  const prevDays = new Date(y,m-1,0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({ d:prevDays-i, other:true });
  for(let d=1;d<=daysInMonth;d++) cells.push({ d, other:false, date: y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0') });
  while(cells.length%7!==0) cells.push({ d:'', other:true });
  const dows = ['日','一','二','三','四','五','六'];
  let h = '<div class="cal"><div class="cal-head">'
    + '<button class="iconbtn" onclick="gratMonthNav(-1)">'+ico('chev',16)+'</button>'
    + '<div class="mt">'+y+'年'+m+'月</div>'
    + '<button class="iconbtn" onclick="gratMonthNav(1)">'+ico('chev',16)+'</button></div>';
  h += '<div class="cal-grid">'+dows.map(w=>'<div class="cal-dow">'+w+'</div>').join('')+'</div>';
  h += '<div class="cal-grid">';
  cells.forEach(c=>{
    if(c.other || !c.date){ h += '<div class="cal-day other"></div>'; return; }
    const g = db.gratitude[c.date];
    const moodFace = (g && g.mood && moodOf(g.mood)) ? '<span class="cal-mood" title="'+esc(g.mood)+'">'+moodIcon(g.mood,13)+'</span>' : '';
    const cls = 'cal-day'+(c.date===TODAY?' today':'')+(c.date===gratView.sel?' sel':'')+(gratHas(c.date)?' has':'')+(gratComplete(c.date)?' done':'');
    h += '<div class="'+cls+'" onclick="selGratDay(\''+c.date+'\')">'+c.d+moodFace+'</div>';
  });
  h += '</div></div>';
  return h;
}

function gratMoodAnalysis(){
  const [y,m] = gratView.ym.split('-').map(Number);
  const daysInMonth = new Date(y,m,0).getDate();
  const counts = {}; MOODS.forEach(md => counts[md.k] = 0);

  for(let d=1; d<=daysInMonth; d++){
    const date = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const g = db.gratitude[date];
    if(g && g.mood && counts[g.mood] !== undefined){ counts[g.mood]++; total++; }
  }
  const rows = MOODS.map(md => ({ k:md.k, c:md.c, n:counts[md.k] })).filter(r => r.n > 0).sort((a,b)=>b.n-a.n);
  let h = '<div class="card grat-mood-an"><div class="card-h"><h3>本月心情分析</h3>'
    + '<div class="r" style="font-size:12px;color:var(--muted)">'+y+'年'+m+'月 · '+total+' 天有记录</div></div>';
  if(!total){
    h += emptyBox('这个月还没有记录心情，挑一个可爱的小表情记下今天吧');
  } else {
    const maxN = rows[0].n || 1;
    h += '<div class="mood-dist">';

    h += '<div class="mood-verdict">'+ico('spark',14)+'<span>本月最常出现的心情是 <b>'+rows[0].k+'</b>，共 '+rows[0].n+' 天。</span></div>';

/* ---- 声音：Web Audio 合成机械滴答 ---- */
let _AC = null, _tickBuf = {};
function audioCtx(){
  if(!_AC){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{ _AC = new AC(); }catch(e){ return null; }
  }
  if(_AC.state === 'suspended'){ try{ _AC.resume(); }catch(e){} }
  return _AC;
}
function tickBuffer(ac, high){
  const key = high ? 'h' : 'l';
  if(_tickBuf[key]) return _tickBuf[key];
  const len = Math.floor(ac.sampleRate * 0.035);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++){
    const decay = Math.pow(1 - i/len, high ? 11 : 8);
    d[i] = (Math.random()*2 - 1) * decay;
  }
  _tickBuf[key] = buf;
  return buf;
}
function playTick(high){
  if(!pomoCfg.sound) return;
  const ac = audioCtx(); if(!ac) return;
  try{
    const src = ac.createBufferSource();
    src.buffer = tickBuffer(ac, high);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = high ? 2700 : 1850;
    bp.Q.value = 7;
    const g = ac.createGain();
    g.gain.value = high ? 0.15 : 0.19;
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start();
  }catch(e){}
}
function playBell(){
  const ac = audioCtx(); if(!ac) return;
  try{
    const t0 = ac.currentTime;
    [880, 1108.7, 1318.5].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      const t = t0 + i * 0.19;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.26, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 1.1);
    });
  }catch(e){}
}

  pomoCfg.sound = !pomoCfg.sound;
  meta.pomoCfg = { minutes:pomoCfg.minutes, sound:pomoCfg.sound };
  saveMeta();
  if(pomoCfg.sound){ audioCtx(); playTick(true); }

function pomoLinkOptions(){
  const opts = [['none|', '不关联，纯专注']];
  if(db.goals.length){
    opts.push({ group:'人生目标' });
    db.goals.forEach(g => opts.push(['goal|'+g.id, g.title]));
  }
  const openTasks = [];
  db.projects.forEach(p => p.tasks.filter(t=>!t.done).forEach(t => openTasks.push(['task|'+t.id, t.title + '（' + p.name + '）'])));
  const openPlans = db.plans.filter(p => !p.done).map(p => ['plan|'+p.id, p.text]);
  if(openTasks.length || openPlans.length){
    opts.push({ group:'待办任务' });
    openTasks.forEach(o => opts.push(o));
    openPlans.forEach(o => opts.push(o));
  }
  if(db.projects.length){
    opts.push({ group:'项目' });
    db.projects.forEach(p => opts.push(['project|'+p.id, p.name]));
  }
  return opts;
}
function pomoLinkLabel(type, id){
  if(type === 'goal'){ const g = db.goals.find(x=>x.id===id); return g ? g.title : ''; }
  if(type === 'project'){ const p = db.projects.find(x=>x.id===id); return p ? p.name : ''; }
  if(type === 'plan'){ const p = db.plans.find(x=>x.id===id); return p ? p.text : ''; }
  if(type === 'task'){
    for(const p of db.projects){ const t = p.tasks.find(x=>x.id===id); if(t) return t.title; }
    return '';
  }
  return '';
}

/* ---- 知识框架（可编辑分类树）---- */
function libCatLabel(id){ const f = db.frameworks.find(x=>x.id===id); return f ? f.name : ''; }
function libChildren(id){ return db.frameworks.filter(x=>x.parent===id); }
function libDescendants(id){
  const out=[id]; const st=libChildren(id).map(x=>x.id);
  while(st.length){ const c=st.pop(); out.push(c); libChildren(c).forEach(k=>st.push(k.id)); }
  return out;
}
function libCatOptions(){
  const opts=[];
  const walk=(parent,depth)=>{ db.frameworks.filter(x=>x.parent===parent).forEach(n=>{ opts.push([n.id, (depth?'　'.repeat(depth):'')+n.name]); walk(n.id, depth+1); }); };
  walk('',0);
  return opts;
}
const LIB_EXP = new Set();          /* 展开的分类节点 */
function libAncestors(id){
  const out=[]; let cur = db.frameworks.find(x=>x.id===id);
  while(cur && cur.parent){ out.push(cur.parent); cur = db.frameworks.find(x=>x.id===cur.parent); }
  return out;
}
function libSetCatId(id){
  libCatId = id;
  if(id && id!=='__none__'){ libAncestors(id).forEach(p=>LIB_EXP.add(p)); if(libChildren(id).length) LIB_EXP.add(id); }
  render();
}
function libToggleExp(id){ LIB_EXP.has(id) ? LIB_EXP.delete(id) : LIB_EXP.add(id); render(); }
function libExpandAll(open){
  LIB_EXP.clear();
  if(open) db.frameworks.forEach(n=>{ if(libChildren(n.id).length) LIB_EXP.add(n.id); });
  render();
}
function libTreeHTML(parent, depth){
  const kids = libChildren(parent);
  if(!kids.length) return '';
  const d = depth || 0;
  let h = '<div class="lib-tree-list">';
  kids.forEach(n=>{
    const set = new Set(libDescendants(n.id));
    const cnt = db.library.filter(x=>set.has(x.catId||'')).length;
    const hasKid = libChildren(n.id).length > 0;
    const open = LIB_EXP.has(n.id);
    h += '<div class="lib-node d'+Math.min(d,2)+(libCatId===n.id?' on':'')+(open?' open':'')+'">'
      + '<div class="lib-node-row" draggable="true" ondragstart="dragFw(event,\''+n.id+'\')" ondragover="libFwDragOver(event,this)" ondragleave="libFwDragLeave(event,this)" ondrop="libFwDrop(event,\''+n.id+'\')" onclick="libSetCatId(\''+n.id+'\')">'
      +   (hasKid
            ? '<button class="ln-caret'+(open?' open':'')+'" title="展开 / 收起" onclick="event.stopPropagation();libToggleExp(\''+n.id+'\')">'+ico('chev',12)+'</button>'
            : '<span class="ln-caret ph"></span>')
      +   '<span class="ln-name">'+esc(n.name)+'</span>'
      +   (cnt ? '<span class="ln-cnt">'+cnt+'</span>' : '')
      + '</div>'
      + '<div class="lib-node-ops">'
      +   '<button class="iconbtn sm" title="加子分类" onclick="event.stopPropagation();fwAdd(\''+n.id+'\')">'+ico('plus',13)+'</button>'
      +   '<button class="iconbtn sm" title="改名" onclick="event.stopPropagation();fwRename(\''+n.id+'\')">'+ico('edit',13)+'</button>'
      +   '<button class="iconbtn sm del" title="删除" onclick="event.stopPropagation();fwDel(\''+n.id+'\')">'+ico('del',13)+'</button>'
      + '</div>'
      + (open ? libTreeHTML(n.id, d+1) : '')
      + '</div>';
  });
  h += '</div>';
  return h;
}

function fwRestoreDefaults(){
  confirmBoxCustom('导入推荐知识框架？',
    '会按《全维度个人知识体系》补齐 10 大领域的分类结构。已有的同名分类会自动复用，不会重复创建，你已经分好类的资料也不会受影响。',
    '导入', ()=>{
      const rec = defaultFrameworks(); const map = {}; let added = 0;
      rec.forEach(n=>{
        const pid = n.parent ? (map[n.parent] || '') : '';
        const exist = db.frameworks.find(x=>(x.parent||'')===(pid||'') && x.name===n.name);
        if(exist){ map[n.id] = exist.id; }
        else { const nid = uid(); db.frameworks.push({ id:nid, name:n.name, parent:pid }); map[n.id] = nid; added++; }
      });
      save(); render(); toast(added ? ('已补齐 '+added+' 个分类节点') : '推荐框架已存在，无需重复导入');
    });
}
function fwAdd(parent){
  openForm('新增分类', [{ k:'name', l:'分类名称', req:true, ph:'例如：工作方法论' }], {}, out=>{
    if(!out.name) return;
    db.frameworks.push({ id:uid(), name:out.name.trim(), parent:parent||'' });
    save(); render(); toast('已新增分类');
  });
}
function fwRename(id){
  const n = db.frameworks.find(x=>x.id===id); if(!n) return;
  openForm('重命名分类', [{ k:'name', l:'分类名称', req:true }], { name:n.name }, out=>{
    if(!out.name) return; n.name = out.name.trim(); save(); render(); toast('已重命名');
  });
}
function fwDel(id){
  const node = db.frameworks.find(x=>x.id===id); if(!node) return;
  const kids = libChildren(id);
  const doDel = ()=>{
    kids.forEach(k=> k.parent = node.parent );
    db.frameworks = db.frameworks.filter(x=>x.id!==id);
    db.library.forEach(x=>{ if(x.catId===id) x.catId=''; });
    if(libCatId===id) libCatId='';
    save(); render(); toast('已删除分类');
  };
  const desc = kids.length ? ('它包含 '+kids.length+' 个子分类，删除后子分类将上移到上一级；该分类下的资料会变为「未分类」。') : '该分类下的资料会变为「未分类」。';
  confirmBoxCustom('删除该分类？', desc, '删除', doDel);
}

function libLinkOptions(){
  const opts = [['none|', '不关联（通用资料）']];
  if(db.projects.length){ opts.push({ group:'项目' }); db.projects.forEach(p=>opts.push(['project|'+p.id, p.name])); }
  if(db.studies.length){ opts.push({ group:'学习科目' }); db.studies.forEach(s=>opts.push(['study|'+s.id, s.title])); }
  if(db.goals.length){ opts.push({ group:'人生目标' }); db.goals.forEach(g=>opts.push(['goal|'+g.id, g.title])); }
  return opts;
}
function libLinkLabel(type, id){
  if(type === 'project'){ const p = db.projects.find(x=>x.id===id); return p ? p.name : ''; }
  if(type === 'study'){ const s = db.studies.find(x=>x.id===id); return s ? s.title : ''; }
  if(type === 'goal'){ const g = db.goals.find(x=>x.id===id); return g ? g.title : ''; }
  return '';
}

function libMatch(x){
  const q = (libSearchTerm||'').toLowerCase();
  if(libCat && libCat !== 'all' && (x.linkedType||'none') !== libCat) return false;
  if(libCatId === '__none__'){ if(x.catId) return false; }
  else if(libCatId){ if(!libCatSet.has(x.catId||'')) return false; }
  if(q && !(x.name||'').toLowerCase().includes(q) && !(x.note||'').toLowerCase().includes(q) && !libCatLabel(x.catId||'').toLowerCase().includes(q)) return false;
  return true;

      db.library.unshift({ id, name:f.name, type:ext||'file', size:f.size, date:TODAY, catId:defCat, linkedType:'none', linkedId:'', note:'' });

  }).catch(()=>{

  });

/* ---- 链接自动抓取：标题 + 内容摘要 ---- */
function normUrl(u){ u = (u||'').trim(); return /^https?:\/\//i.test(u) ? u : (u ? 'https://'+u : ''); }
function _fetchText(url, ms){
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>{ try{ctl.abort()}catch(e){} }, ms||14000) : null;
  return fetch(url, ctl ? { signal: ctl.signal } : {}).then(r=>{
    if(t) clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  });
}
/* 从 markdown 正文抽出可读摘要 */
function _mdSummary(md, n){
  const max = n || 170, buf = [];
  String(md||'').split('\n').forEach(raw=>{
    if(buf.join(' ').length > max) return;
    let l = raw.trim();
    if(!l) return;
    if(/^(\||-{3,}|\*{3,}|```|!\[|\[!)/.test(l)) return;
    l = l.replace(/^#{1,6}\s*/,'').replace(/^>\s*/,'')
         .replace(/!\[[^\]]*\]\([^)]*\)/g,'')
         .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
         .replace(/[*_`~]/g,'')
         .replace(/\s+/g,' ').trim();
    if(l.length < 10) return;
    buf.push(l);
  });
  let s = buf.join(' ');
  if(s.length > max) s = s.slice(0, max).replace(/[，,、；;]$/,'') + '…';
  return s;
}
function libFetchMeta(rawUrl){
  const url = normUrl(rawUrl);
  /* 方案 1：正文阅读服务，能同时拿到标题和文章摘要 */
  return _fetchText('https://r.jina.ai/' + url, 15000).then(txt=>{
    const mT = txt.match(/^Title:\s*(.+)$/m);
    const i = txt.indexOf('Markdown Content:');
    const title = (mT ? mT[1] : '').trim();
    const desc = _mdSummary(i >= 0 ? txt.slice(i + 17) : txt, 170);
    if(!title && !desc) throw new Error('empty');
    return { title, desc };
  }).catch(()=>{
    /* 方案 2：取原始 HTML，解析 <title> 与 description */
    return _fetchText('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), 13000).then(html=>{
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const tEl = doc.querySelector('title');
      const title = tEl ? tEl.textContent.replace(/\s+/g,' ').trim() : '';
      const mEl = doc.querySelector('meta[name="description"],meta[property="og:description"],meta[name="twitter:description"]');
      let desc = mEl ? (mEl.getAttribute('content')||'') : '';
      if(!desc){
        const ps = Array.prototype.slice.call(doc.querySelectorAll('article p, main p, p'))
          .map(p=>p.textContent.replace(/\s+/g,' ').trim()).filter(x=>x.length > 24);
        desc = ps.slice(0,3).join(' ');
      }
      desc = desc.replace(/\s+/g,' ').trim();
      if(desc.length > 170) desc = desc.slice(0,170) + '…';
      if(!title && !desc) throw new Error('empty');
      return { title, desc };
    });
  });
}
let _grabbedUrl = '';
function libGrab(manual){
  const el = $('f_url'); if(!el) return;
  const url = (el.value||'').trim();
  const tip = $('grabTip'), btn = $('grabBtn'), nEl = $('f_name'), tEl = $('f_note');
  if(!url){ if(tip){ tip.className='hint'; tip.textContent='先粘贴一个链接地址。'; } return; }
  if(!manual){
    if(_grabbedUrl === url) return;                        // 同一个链接不重复抓
    if(nEl && nEl.value.trim() && tEl && tEl.value.trim()) return;  // 已手填就不打扰
  }
  _grabbedUrl = url;
  if(tip){ tip.className='hint grabbing'; tip.textContent='正在读取网页标题与内容摘要…'; }
  if(btn){ btn.disabled = true; btn.textContent = '读取中'; }
  libFetchMeta(url).then(m=>{
    const n = $('f_name'), t2 = $('f_note');
    if(n && m.title && (manual || !n.value.trim())) n.value = m.title;
    if(t2 && m.desc && (manual || !t2.value.trim())) t2.value = m.desc;
    const tp = $('grabTip');
    if(tp){
      tp.className = 'hint ok';
      tp.textContent = '已自动获取' + (m.title ? '标题' : '') + (m.title && m.desc ? '和' : '') + (m.desc ? '内容摘要' : '') + '，可自行修改。';
    }
  }).catch(()=>{
    const tp = $('grabTip');
    if(tp){ tp.className='hint warn'; tp.textContent='没读到内容（对方网站限制访问或网络不通），手动填写标题即可。'; }
  }).then(()=>{
    const b = $('grabBtn');
    if(b){ b.disabled = false; b.innerHTML = ico('refresh',14) + '重新抓取'; }
  });
}

function libDragRes(e, id){ e.dataTransfer.setData('text/plain', 'res:'+id); e.dataTransfer.effectAllowed='move'; const it=e.currentTarget.closest('.lib-item'); if(it) it.classList.add('dragging'); }
function libResDragEnd(e){ const it=e.currentTarget.closest('.lib-item'); if(it) it.classList.remove('dragging'); }
function dragFw(e, id){ e.dataTransfer.setData('text/plain', 'fw:'+id); e.dataTransfer.effectAllowed='move'; }
function libFwDragOver(e, el){ e.preventDefault(); el.classList.add('dragover'); }
function libFwDragLeave(e, el){ el.classList.remove('dragover'); }
function libFwDrop(e, targetId){
  e.preventDefault();
  const row = e.currentTarget.querySelector('.lib-node-row') || e.currentTarget;
  row.classList.remove('dragover');
  const data = (e.dataTransfer.getData('text/plain')||'');
  if(data.startsWith('res:')){
    const id = data.slice(4);
    const x = db.library.find(z=>z.id===id); if(!x) return;
    if(x.catId === targetId) return;
    x.catId = targetId;
    save(); render();
    toast('已移动到「'+(targetId?libCatLabel(targetId):'未分类')+'」');
    return;
  }
  if(data.startsWith('fw:')){
    const id = data.slice(3);
    if(id === targetId) return;
    const dragged = db.frameworks.find(x=>x.id===id);
    const target = db.frameworks.find(x=>x.id===targetId);
    if(!dragged || !target) return;
    if(dragged.parent !== target.parent) return;   // 仅同级重排，避免误改层级
    const from = db.frameworks.findIndex(x=>x.id===id);
    const [moved] = db.frameworks.splice(from, 1);
    let to = db.frameworks.findIndex(x=>x.id===targetId);
    if(to < 0) to = db.frameworks.length;
    db.frameworks.splice(to, 0, moved);
    save(); render(); toast('已调整分类顺序');
    return;
  }
}
function libStartResize(e){
  e.preventDefault();
  const side = document.querySelector('.lib-side'); if(!side) return;
  const startX = e.clientX, startW = side.getBoundingClientRect().width;
  document.body.style.userSelect='none'; document.body.style.cursor='col-resize';
  const res = e.currentTarget; if(res) res.classList.add('drag');
  const move = ev => {
    let w = startW + (ev.clientX - startX);
    w = Math.max(180, Math.min(560, w));
    side.style.width = w + 'px'; libSideW = w;
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.body.style.userSelect=''; document.body.style.cursor='';
    if(res) res.classList.remove('drag');
    localStorage.setItem('wb_momo_libside_w', String(libSideW));
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

let _libUrl = null;
function libModal(title, body, btns){
  openModal(title, body, btns);
  const m = $('mask').querySelector('.modal'); if(m) m.classList.add('lib-preview');
}
function libOpen(id){
  const x = db.library.find(z=>z.id===id); if(!x) return;
  const ext = (x.type||'').toLowerCase();
  if(x.type === 'link'){
    _libUrl = null;
    libModal(esc(x.name),
      '<div class="lib-pv-link"><iframe class="lib-pv-frame" src="'+esc(x.url)+'"></iframe>'
      + '<div class="lib-pv-tip">若对方网站禁止内嵌，可点「新标签打开」</div></div>',
      [ { t:'新标签打开', cls:'btn', fn:()=>window.open(x.url,'_blank','noopener') }, { t:'关闭', cls:'btn', fn:closeModal } ]);
    return;
  }
  getFile(id).then(blob=>{
    if(!blob){ toast('本机文件数据缺失，请重新上传'); return; }
    if(['txt','md','csv'].includes(ext)){
      _libUrl = null;
      blob.text().then(txt=>{
        libModal(esc(x.name), '<pre class="lib-pv-text">'+esc(txt)+'</pre>', [ { t:'关闭', cls:'btn', fn:closeModal } ]);
      });
      return;
    }
    _libUrl = URL.createObjectURL(blob);
    let body;
    const btns = [ { t:'关闭', cls:'btn', fn:closeModal } ];
    if(['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext)){
      body = '<div class="lib-pv-imgwrap"><img class="lib-pv-img" src="'+_libUrl+'" alt="'+esc(x.name)+'"></div>';
    } else if(ext === 'pdf'){
      body = '<iframe class="lib-pv-frame" src="'+_libUrl+'"></iframe>';
    } else {
      body = '<div class="lib-pv-none">'+ico('file',30)+'<p>此文件类型暂不支持内联预览</p><span>'+esc(x.name)+'</span></div>';
      btns.unshift({ t:'下载到本机打开', cls:'btn primary', fn:()=>libDownload(id) });
    }
    libModal(esc(x.name), body, btns);
  }).catch(()=> toast('打开失败'));
}
function libDownload(id){
  const x = db.library.find(z=>z.id===id); if(!x) return;
  if(x.type === 'link'){ window.open(x.url,'_blank','noopener'); return; }
  getFile(id).then(blob=>{
    if(!blob){ toast('本机文件数据缺失'); return; }
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = x.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 60000);
  }).catch(()=> toast('下载失败'));
}
function libDel(id){
  const x = db.library.find(z=>z.id===id); if(!x) return;
  confirmBoxCustom('删除这份资料？', '「'+esc(x.name)+'」将从资料库移除'+(x.type!=='link'?'，本机文件也会一并删除':'')+'。', '删除', ()=>{
    db.library = db.library.filter(z=>z.id!==id);
    if(x.type!=='link') delFile(id);
    save(); render(); toast('已删除');
  });
}

/* ---- 计时 ---- */
function fmtClock(sec){
  const m = Math.floor(Math.max(0,sec)/60), s = Math.max(0,sec)%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function setPomoMinutes(m){
  if(pomo.running) return;
  pomoCfg.minutes = m;
  pomo.total = m*60; pomo.remain = m*60;
  meta.pomoCfg = { minutes:m, sound:pomoCfg.sound };
  saveMeta();
  render();
}
function startPomo(){
  audioCtx();
  if(pomo.paused){
    pomo.endAt = Date.now() + pomo.remain*1000;
    pomo.paused = false; pomo.running = true;
  }else{
    pomo.total = pomoCfg.minutes*60;
    pomo.remain = pomo.total;
    pomo.endAt = Date.now() + pomo.total*1000;
    pomo.running = true; pomo.paused = false;
    pomo.interrupts = [];
  }
  pomo.lastSec = -1;
  if(pomo.timer) clearInterval(pomo.timer);
  pomo.timer = setInterval(pomoLoop, 200);
  render();
  toast('专注开始，'+pomoCfg.minutes+' 分钟后见');
}
function pausePomo(){
  if(!pomo.running) return;
  pomo.remain = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
  pomo.running = false; pomo.paused = true;
  if(pomo.timer){ clearInterval(pomo.timer); pomo.timer = null; }
  render();
}
function buildPomoNote(){
  const parts = [];
  if(pomoCfg.note && pomoCfg.note.trim()) parts.push(pomoCfg.note.trim());
  if(pomoCfg.records && pomoCfg.records.length) parts.push(pomoCfg.records.map((r,i) => (i+1)+'. '+r).join('\n'));
  return parts.join('\n\n');
}
function abortPomo(){
  confirmBox('放弃这个番茄？', '放弃的番茄会被记为「未完成」，用于计算完成率。', () => {
    const actualMin = Math.max(1, Math.round((pomo.total - pomo.remain)/60));
    stopPomoTimer();
    const now = new Date();
    const at = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    const links = pomoCfg.links.map(l=>({ type:l.type, id:l.id }));
    db.pomos.unshift({
      id: uid(), date: d2s(now), at: at, min: pomoCfg.minutes, actualMin: actualMin,
      links: links, label: links.map(l=>pomoLinkLabel(l.type,l.id)).join(' · '), note: buildPomoNote(),
      interrupts: pomo.interrupts || [], aborted: true
    });
    save();
    pomo.interrupts = [];
    pomoCfg.note = ''; pomoCfg.records = [];
    pomo.remain = pomoCfg.minutes*60;
    pomo.total = pomoCfg.minutes*60;
    render();
    toast('已放弃，这个番茄被记为未完成');
  });
}
function stopPomoTimer(){
  if(pomo.timer){ clearInterval(pomo.timer); pomo.timer = null; }
  pomo.running = false; pomo.paused = false; pomo.lastSec = -1;
}
function pomoLoop(){
  const left = Math.max(0, Math.round((pomo.endAt - Date.now())/1000));
  if(left !== pomo.lastSec){
    pomo.lastSec = left;
    pomo.remain = left;
    pomo.secTick++;
    if(left > 0) playTick(pomo.secTick % 2 === 0);
    paintPomo();
  }
  if(left <= 0) finishPomo();
}
function finishPomo(){
  stopPomoTimer();
  playBell();
  const now = new Date();
  const at = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const links = pomoCfg.links.map(l=>({ type:l.type, id:l.id }));
  db.pomos.unshift({
    id: uid(), date: d2s(now), at: at, min: pomoCfg.minutes, actualMin: pomoCfg.minutes,
    links: links,
    label: links.map(l=>pomoLinkLabel(l.type,l.id)).join(' · '), note: buildPomoNote(),
    interrupts: pomo.interrupts || [], aborted: false
  });
  save();
  pomo.interrupts = [];
  pomoCfg.note = ''; pomoCfg.records = [];
  pomo.remain = pomoCfg.minutes*60;
  pomo.total = pomoCfg.minutes*60;
  render();
  const lab = curPomoLabel();
  toast('番茄完成！' + (lab ? '「'+lab+'」+1' : '专注 '+pomoCfg.minutes+' 分钟'));
}

function logInterrupt(reason){
  if(!pomo.running) return;
  pomo.interrupts = pomo.interrupts || [];
  pomo.interrupts.push({ reason: reason || '其他', at: fmtClock(pomo.total - pomo.remain) });
  toast('已记录干扰：'+reason);
  // 只刷新中断区，避免重绘计时环
  const box = document.querySelector('.pomo-interrupt');
  if(box){
    box.innerHTML = '<div class="pi-h">'+ico('zap',14)+' 已记录 '+pomo.interrupts.length+' 次干扰</div>'
      + '<div class="pi-chips">' + POMO_INTERRUPTS.map(r =>
        '<button class="btn xs" onclick="logInterrupt(\''+esc(r)+'\')">'+esc(r)+'</button>').join('') + '</div>'
      + '<div class="pi-list">'+pomo.interrupts.map((it,i)=>'<span class="pi-tag">'+(i+1)+'. '+esc(it.reason)+' @'+it.at+'</span>').join('')+'</div>';
  }
}

/* ---- 只刷新计时相关节点，避免整页重绘 ---- */
function paintPomo(){
  const t = fmtClock(pomo.remain);
  const el = $('pomoTime'); if(el) el.textContent = t;
  const ring = $('pomoArc');
  if(ring){
    const r = 104, c = 2*Math.PI*r;
    const pct = pomo.total ? (pomo.total - pomo.remain)/pomo.total : 0;
    ring.setAttribute('stroke-dasharray', (c*pct).toFixed(1)+' '+(c*(1-pct)).toFixed(1));
  }
  const hand = $('pomoHand');
  if(hand){
    const secInto = pomo.total - pomo.remain;
    hand.setAttribute('transform', 'rotate('+((secInto % 60) * 6)+' 60 60)');
  }
  paintPomoMini();
}
function paintPomoMini(){
  const box = $('pomoMini'); if(!box) return;
  const active = pomo.running || pomo.paused;
  box.classList.toggle('on', active && route.tab !== 'pomo');
  box.classList.toggle('paused', pomo.paused);
  if(!active) return;
  $('pomoMiniTime').textContent = fmtClock(pomo.remain);
  $('pomoMiniIco').innerHTML = ico(pomo.paused ? 'pause' : 'tomato', 16);
  const l = curPomoLabel();
  $('pomoMiniLab').textContent = l || (pomo.paused ? '已暂停' : '专注中');
}

function pomoDateSeries(days){
  const arr = [];
  for(let i=days-1;i>=0;i--){ arr.push(off(-i)); }
  return arr;
}
function pomoMetrics(rangeDays){
  const dates = pomoDateSeries(rangeDays);
  const ps = db.pomos.filter(p => dates.includes(p.date));
  const completed = ps.filter(p => !p.aborted);
  const aborted = ps.filter(p => p.aborted);
  const totalStarted = ps.length;
  const totalInt = completed.reduce((a,p)=>a+(p.interrupts||[]).length,0);
  const activeDays = new Set(completed.map(p=>p.date)).size || 1;
  const totalMin = completed.reduce((a,p)=>a+(p.actualMin||p.min||25),0);
  const completionRate = totalStarted ? completed.length / totalStarted : 0;
  const avgDailyMin = Math.round(totalMin / activeDays);
  const avgInterrupt = completed.length ? totalInt / completed.length : 0;
  // 黄金时段：按小时汇总实际专注分钟
  const hourMin = {};
  completed.forEach(p => {
    const h = (p.at||'').slice(0,2); if(!h) return;
    hourMin[h] = (hourMin[h]||0) + (p.actualMin||p.min||25);
  });
  const topHours = Object.entries(hourMin).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([h,m])=>({h,m}));
  const avgActual = completed.length ? totalMin / completed.length : 0;
  const longest = completed.length ? Math.max(...completed.map(p=>p.actualMin||p.min||25)) : 0;
  const intRate = completed.length ? Math.min(1, totalInt / completed.length) : 0;
  const depth = completionRate*0.4*100 + Math.min(longest/60,1)*0.3*100 + Math.max(0,1-intRate)*0.3*100;
  return { completed, aborted, totalStarted, totalInt, activeDays, totalMin, completionRate, avgDailyMin, avgInterrupt, topHours, avgActual, longest, depth };
}

function formatMin(m){

function pomoTrendChart(days){
  const dates = pomoDateSeries(days);
  const data = dates.map(d => {
    const list = db.pomos.filter(p => p.date === d);
    const completed = list.filter(p => !p.aborted);
    const min = completed.reduce((a,p)=>a+(p.actualMin||p.min||25),0);
    const total = list.length;
    const rate = total ? completed.length / total : 0;
    return { d, min, rate, completed: completed.length, total };
  });
  const maxMin = Math.max(1, ...data.map(x=>x.min));
  const W = 640, H = 220, pad = 36, rightPad = 46, chartW = W - pad - rightPad, chartH = H - pad - 34;
  const step = chartW / (data.length - 1 || 1);
  const x = i => pad + step * i;
  const yMin = v => pad + chartH - (v / maxMin) * chartH;
  const yRate = r => pad + chartH - r * chartH;

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="220" preserveAspectRatio="xMidYMid meet" style="display:block">';
  [0,.25,.5,.75,1].forEach(f=>{
    const y = pad + chartH * (1-f);
    svg += '<line x1="'+pad+'" y1="'+y+'" x2="'+(W-rightPad)+'" y2="'+y+'" stroke="var(--surface3)" stroke-width="1"/>';
    svg += '<text x="'+(pad-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+Math.round(maxMin*f)+'</text>';
  });
  // 柱状：总时长
  const barW = Math.max(4, step * 0.5);
  data.forEach((p,i)=>{
    const hgt = Math.max(2, (p.min / maxMin) * chartH);
    const bx = x(i) - barW/2, by = pad + chartH - hgt;
    svg += '<rect x="'+bx+'" y="'+by+'" width="'+barW+'" height="'+hgt+'" rx="3" fill="var(--accent-soft)"/>';
  });
  // 折线：完成率
  let path = '';
  data.forEach((p,i)=>{ const px=x(i), py=yRate(p.rate); path += (i?'L':'M') + px + ' ' + py; });
  svg += '<path d="'+path+'" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  // 峰值日标记
  const peak = data.slice().sort((a,b)=>b.min-a.min)[0];
  data.forEach((p,i)=>{
    const py = yRate(p.rate);
    const color = p.rate === 1 ? 'var(--green)' : 'var(--orange)';
    svg += '<circle cx="'+x(i)+'" cy="'+py+'" r="4" fill="var(--surface)" stroke="'+color+'" stroke-width="2"/>';
    if(peak && p.d === peak.d && p.min > 0){
      svg += '<g style="cursor:pointer" onclick="go(\'records\')"><circle cx="'+x(i)+'" cy="'+yMin(p.min)+'" r="6" fill="var(--green)"/>'
        + '<text x="'+x(i)+'" y="'+(yMin(p.min)-10)+'" text-anchor="middle" font-size="10" fill="var(--green)">峰值日</text></g>';
    }
  });
  // X 轴标签
  data.forEach((p,i)=>{
    const label = p.d === TODAY ? '今天' : (+p.d.slice(5,7))+'/'+p.d.slice(8,10);
    svg += '<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+label+'</text>';
  });
  // 图例
  svg += '<g transform="translate('+(W-120)+' 14)"><rect x="0" y="0" width="12" height="8" rx="2" fill="var(--accent-soft)"/><text x="16" y="8" font-size="10" fill="var(--text2)">时长</text><circle cx="70" cy="4" r="3" fill="var(--orange)"/><text x="78" y="8" font-size="10" fill="var(--text2)">完成率</text></g>';
  svg += '</svg>';

  let h = '<div class="card-h"><h3>趋势分析</h3><span style="font-size:12px;color:var(--muted)">近 '+days+' 天 · 柱状=总时长 · 折线=完成率</span></div>' + svg;
  if(peak && peak.min > 0) h += '<div class="pd-insight">'+ico('spark',14)+' 峰值日是 <b>'+(peak.d===TODAY?'今天':fmtMD(peak.d))+'</b>，专注了 '+peak.min+' 分钟，完成 '+peak.completed+'/'+peak.total+' 个番茄。</div>';
  return h;
}
function pomoInterruptPie(){
  const completed = db.pomos.filter(p => !p.aborted);
  const map = {};
  completed.forEach(p => (p.interrupts||[]).forEach(it => { map[it.reason] = (map[it.reason]||0)+1; }));
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const total = arr.reduce((a,b)=>a+b[1],0);
  const colors = ['#cf9b94','#d6a878','#94b08e','#9fb4c4','#e0a3b8','#9ec3bf'];

  let h = '<div class="card-h"><h3>干扰归因</h3><span style="font-size:12px;color:var(--muted)">点击扇区查看建议</span></div>';
  if(!total) return h + '<div class="empty" style="padding:24px 0">还没有记录干扰，专注时遇到问题记得点「标记中断」</div>';

  const r = 56, cx = 70, cy = 70, C = 2*Math.PI*r;
  let acc = 0;
  let svg = '<svg viewBox="0 0 160 140" width="160" height="140" style="flex-shrink:0">';
  arr.forEach(([name,n],i)=>{
    const len = C * n / total;
    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colors[i%6]+'" stroke-width="22"'
      + ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'"'
      + ' transform="rotate(-90 '+cx+' '+cy+')" style="cursor:pointer" onclick="pomoPieTip(\''+esc(name)+'\')"/>';
    acc += len;
  });
  svg += '<text x="'+cx+'" y="'+cy+'" text-anchor="middle" font-size="11" fill="var(--muted)">干扰</text>'
    + '<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="16" font-weight="800" fill="var(--text)">'+total+'</text>';
  svg += '</svg>';

  let leg = '<div class="pd-pie-legend">';
  arr.forEach(([name,n],i)=>{
    leg += '<div class="pd-pie-item" onclick="pomoPieTip(\''+esc(name)+'\')">'
      + '<span class="pd-dot" style="background:'+colors[i%6]+'"></span>'
      + '<span class="pd-name">'+esc(name)+'</span><span class="pd-num">'+n+'</span></div>';
  });
  leg += '</div>';

  h += '<div class="pd-pie">'+svg+leg+'</div>';
  return h;
}
